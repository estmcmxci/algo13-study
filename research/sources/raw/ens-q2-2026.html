uot;DCE6F0\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e10_DevConnect Argentina 2025\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1486×898 95.3 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWe also hosted several workshops and talks covering ENSv2 readiness, decentralized websites, Hidden Contract Accounts, \\u003ca href=\\\&quot;https://www.youtube.com/watch?v=UulQ3P4I91o\\\&quot;\\u003establecoin payment UX\\u003c/a\\u003e, and emerging standards such as agent-focused identity primitives.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/92d7e95687062c981a809bc215b72f386b61fdb8.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/92d7e95687062c981a809bc215b72f386b61fdb8\\\&quot; title=\\\&quot;11_DevConnect Argentina 2025\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/92d7e95687062c981a809bc215b72f386b61fdb8_2_439x500.jpeg\\\&quot; alt=\\\&quot;11_DevConnect Argentina 2025\\\&quot; data-base62-sha1=\\\&quot;kX2iwW0AGKRiaF3xnTiTZSHId0Q\\\&quot; width=\\\&quot;439\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/92d7e95687062c981a809bc215b72f386b61fdb8_2_439x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/92d7e95687062c981a809bc215b72f386b61fdb8_2_658x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/92d7e95687062c981a809bc215b72f386b61fdb8_2_878x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;496E7E\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e11_DevConnect Argentina 2025\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e980×1116 113 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe ENS booth was at an ideal location within the Social District of Devconnect, where we tested out a new format of “\\u003ca href=\\\&quot;https://x.com/ensdomains/status/1998424243584065602\\\&quot;\\u003eoffice hours\\u003c/a\\u003e” to showcase apps, service providers, and working groups. Sentiment was very well received and exhibited a great way to onboard, troubleshoot and support our users and the ecosystem IRL.\\u003c/p\\u003e\\n\\u003cp\\u003eFor example, if someone had a question about subnames, we could direct them to come by to meet the Namespace or JustaName teams during their designated office hours.\\u003c/p\\u003e\\n\\u003cp\\u003eWe are grateful to experience incredible turnout from the ecosystem from the \\u003cstrong\\u003eENS DAO working groups\\u003c/strong\\u003e, \\u003cstrong\\u003eZKemail\\u003c/strong\\u003e, \\u003cstrong\\u003eUnruggable\\u003c/strong\\u003e, \\u003cstrong\\u003eNamespace\\u003c/strong\\u003e, \\u003cstrong\\u003eNamehash Labs\\u003c/strong\\u003e, and many more!\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/e/e42896ccae35dd74f3d5700f4f4049972f44fc10.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/e42896ccae35dd74f3d5700f4f4049972f44fc10\\\&quot; title=\\\&quot;12_DevConnect Argentina 2025\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e42896ccae35dd74f3d5700f4f4049972f44fc10_2_690x219.jpeg\\\&quot; alt=\\\&quot;12_DevConnect Argentina 2025\\\&quot; data-base62-sha1=\\\&quot;wynP90rym5d3LedjS5eiZMzYVeU\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;219\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e42896ccae35dd74f3d5700f4f4049972f44fc10_2_690x219.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e42896ccae35dd74f3d5700f4f4049972f44fc10_2_1035x328.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e42896ccae35dd74f3d5700f4f4049972f44fc10_2_1380x438.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;7E6F71\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e12_DevConnect Argentina 2025\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×610 126 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eDespite this year’s theme of the “Ethereum World Fair,” it showed us that stable internet access may still be a weakness in global adoption. The internet at the venue was nearly unusable, both from networks being overloaded, causing the Devconnect App was buggy and slow to load, which definitely hindered the \\u003ca href=\\\&quot;https://x.com/EFDevcon/status/1989475906604454047\\\&quot;\\u003eworldfair.eth subname claim\\u003c/a\\u003e and made it hard to communicate with other ENS Labs team members on the ground.\\u003c/p\\u003e\\n\\u003cp\\u003eMoreover, the significance of the massive Cloudflare outage on Day 2 of DevConnect in 2025 could not be understated. Fortunately, Simon Schmid (ENS Labs, Head of DevRel) was ready with a \\u003ca href=\\\&quot;https://x.com/Filecoin/status/1993755731347050890?s=20\\\&quot;\\u003elive demo\\u003c/a\\u003e on how ENS, Filecoin’s Onchain Cloud, and Safe could be leveraged to create a simple yet secure deployment pipeline for website and app publication (the decentralized way). We’ve \\u003ca href=\\\&quot;https://ens.domains/blog/post/decentralized-websites\\\&quot;\\u003esince published a practical guide\\u003c/a\\u003e on building a decentralized website using ENS, Filecoin, Omnipin, IPFS, and Safe.\\u003c/p\\u003e\\n\\u003cp\\u003eSimon also moderated a panel on “\\u003ca href=\\\&quot;https://www.youtube.com/watch?v=FWT9AVaN9NU\\\&quot;\\u003eThe Trust Layer in the Agentic Stack: ERC-8004\\u003c/a\\u003e” discussing the emerging agentic economy, infrastructure for coordination, identity, and payments, the role of TEEs, growing adoption of standards like MCP, A2A, and ERC-8004, and early use cases focused on API tooling ahead of full automation.\\u003c/p\\u003e\\n\\u003cp\\u003eTate (ENS Labs, Protocol Lead) hosted an in-depth workshop on how ENS’ architecture introduced the \\u003ca href=\\\&quot;https://www.youtube.com/watch?v=ViZd_AR51OE\\\&quot;\\u003eHidden Contract Account (HCA) model\\u003c/a\\u003e to improve interoperability, usability, and governance across wallets and networks.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/0/07b39419e570618475450fd90f0eae38924a11b0.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/07b39419e570618475450fd90f0eae38924a11b0\\\&quot; title=\\\&quot;13_DevConnect Argentina 2025\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/07b39419e570618475450fd90f0eae38924a11b0_2_690x216.jpeg\\\&quot; alt=\\\&quot;13_DevConnect Argentina 2025\\\&quot; data-base62-sha1=\\\&quot;1685qlfKFESma9OTLPTjxTF5SiQ\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;216\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/07b39419e570618475450fd90f0eae38924a11b0_2_690x216.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/07b39419e570618475450fd90f0eae38924a11b0_2_1035x324.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/07b39419e570618475450fd90f0eae38924a11b0_2_1380x432.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;2E2833\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e13_DevConnect Argentina 2025\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×603 118 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eImportantly, we began unveiling our two new apps, sharing the user philosophies and design decisions behind them. These efforts were validated through live user testing, where community members interacted with the alpha apps and provided immediate feedback.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/e/e83ce9f86573c4fe331a7f1d7bb682cffdc353c1.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/e83ce9f86573c4fe331a7f1d7bb682cffdc353c1\\\&quot; title=\\\&quot;14_DevConnect Argentina 2025\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e83ce9f86573c4fe331a7f1d7bb682cffdc353c1_2_366x500.jpeg\\\&quot; alt=\\\&quot;14_DevConnect Argentina 2025\\\&quot; data-base62-sha1=\\\&quot;x8thoU8PdMGra86410j55ki0KQh\\\&quot; width=\\\&quot;366\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e83ce9f86573c4fe331a7f1d7bb682cffdc353c1_2_366x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e83ce9f86573c4fe331a7f1d7bb682cffdc353c1_2_549x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e83ce9f86573c4fe331a7f1d7bb682cffdc353c1_2_732x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;716D72\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e14_DevConnect Argentina 2025\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1028×1402 180 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-60249-ethglobal-buenos-aires-14\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-ethglobal-buenos-aires-14\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eETHGlobal Buenos Aires\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003ePost-DevConnect, our DevRel and Protocol teams were excited to spend the next three days connecting in=person with ENS builders and developers in the ecosystem. We kicked off the hackathons events with an in person presentation of “\\u003ca href=\\\&quot;https://www.youtube.com/watch?v=mOQEk6k2Ohw\\\&quot;\\u003eENS - Identity in Your Apps\\u003c/a\\u003e” for crypto-newcomers and veteran ENS users alike.\\u003c/p\\u003e\\n\\u003cp\\u003eThousands of hackers participated at the Buenos Aires hackathon with \\u003cstrong\\u003e475 projects\\u003c/strong\\u003e being built on ENS!\\u003c/p\\u003e\\n\\u003cp\\u003eHackathon teams built on ENS across a wide range of use cases, including decentralized infrastructure and identity, privacy-preserving payments and social apps, AI agents and automation, developer tooling, gaming and consumer experiences, compliance and reputation layers, and cross-chain wallets and DeFi.\\u003c/p\\u003e\\n\\u003cp\\u003eWe awarded $10,000+ in prizes to five winning teams including:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ethglobal.com/showcase/filify-td1aq\\\&quot;\\u003e\\u003cstrong\\u003eFilify\\u003c/strong\\u003e\\u003c/a\\u003e winning 1st place building Vercel for the decentralized web by deploying to Filecoin for storage + ENS for addressing, all with no single point of failure.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ethglobal.com/showcase/iwitness-cyo18\\\&quot;\\u003e\\u003cstrong\\u003eiWitness\\u003c/strong\\u003e\\u003c/a\\u003e came close in 2nd for their solution to combat AI fakes with hardware-attested stereo depth, leveraging ENS as the Public Key Infrastructure (PKI).\\u003c/li\\u003e\\n\\u003cli\\u003eFinally a tie between \\u003ca href=\\\&quot;https://ethglobal.com/showcase/nydus-ky1fr\\\&quot;\\u003e\\u003cstrong\\u003eNydus\\u003c/strong\\u003e\\u003c/a\\u003e a privacy payment network, \\u003ca href=\\\&quot;https://ethglobal.com/showcase/dmail-otqvo\\\&quot;\\u003e\\u003cstrong\\u003edmail\\u003c/strong\\u003e\\u003c/a\\u003e a decentralized end-to-end encrypted email using ENS identities + Filecoin storage, and \\u003ca href=\\\&quot;https://ethglobal.com/showcase/split-npxrs\\\&quot;\\u003e\\u003cstrong\\u003eSplit\\u003c/strong\\u003e\\u003c/a\\u003e to seamlessly split receipts with friends and settle payments instantly.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-60249-ethrome-2025-15\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-ethrome-2025-15\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eETHRome 2025\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eIn October, we sponsored ETHRome’s 250+ hacker attendees, of which 53 builders selected ENS to build across 28 projects.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eKey highlights for ENS hackathons projects included:\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://taikai.network/ethrome/hackathons/2025/projects/cmgx4r1we02d112kkxt8y1sxi/idea\\\&quot;\\u003e\\u003cstrong\\u003eAUTARK\\u003c/strong\\u003e\\u003c/a\\u003e\\u003cstrong\\u003e,\\u003c/strong\\u003e a crypto-anarchic DevSecOps framework for more secure, self-sovereign frontend deployments, enforcing immutable, decentralized, and multi-party-verified frontend governance through the combined power of SAFE, ENS, and IPFS.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://taikai.network/ethrome/hackathons/2025/projects/cmgwawcpq01pd12kk2j59udvv/idea\\\&quot;\\u003e\\u003cstrong\\u003eMyDocs\\u003c/strong\\u003e\\u003c/a\\u003e, a decentralized, self-sovereign platform for collaborative document editing.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://taikai.network/ethrome/hackathons/2025/projects/cmgwlzf0001wx12kkjkagexnv/idea\\\&quot;\\u003e\\u003cstrong\\u003eAttenzione!\\u003c/strong\\u003e\\u003c/a\\u003e, a decentralized crime reporting system for the Rome Metro, utilizing Ethereum, ENS, and IPFS for transparency.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/3/33da41f80731aa5ba29b9f855b6f7fa881a2b0ba.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/33da41f80731aa5ba29b9f855b6f7fa881a2b0ba\\\&quot; title=\\\&quot;15_ETHRome 2025\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/3/33da41f80731aa5ba29b9f855b6f7fa881a2b0ba_2_690x383.jpeg\\\&quot; alt=\\\&quot;15_ETHRome 2025\\\&quot; data-base62-sha1=\\\&quot;7oHXT4isTxHJwEjqX6NBw1j1pbA\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;383\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/3/33da41f80731aa5ba29b9f855b6f7fa881a2b0ba_2_690x383.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/3/33da41f80731aa5ba29b9f855b6f7fa881a2b0ba_2_1035x574.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/3/33da41f80731aa5ba29b9f855b6f7fa881a2b0ba_2_1380x766.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;807169\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e15_ETHRome 2025\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1754×974 164 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-our-icann-strategy-ens-as-a-brand-16\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-our-icann-strategy-ens-as-a-brand-16\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eOur ICANN Strategy: .ens as a .brand\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eQ4 also deepened ENS Labs’ engagement with the traditional DNS ecosystem. Work accelerated around ICANN participation and preparation for the upcoming 2026 gTLD round, including the strategic decision to pursue an ENS gTLD as a “.brand”.\\u003c/p\\u003e\\n\\u003cp\\u003eThis effort is driven by brand protection and ecosystem integrity, positioning ENS as a long-term leader and participant in DNS governance.\\u003c/p\\u003e\\n\\u003cp\\u003eAt the ICANN84 Annual General Meeting in Dublin, we \\u003ca href=\\\&quot;https://ens.domains/blog/post/d3-doma\\\&quot;\\u003eunveiled a new partnership with D3\\u003c/a\\u003e to add a second path for registries and communities to more seamlessly add ENS features to their domains. We spoke to numerous registries and TLD operators interested in offering ENS functionality to their domains.\\u003c/p\\u003e\\n\\u003cp\\u003eENS Labs increased its visibility through panels, workshops, and technical presentations at ICANN and DNS-focused forums. These efforts reinforce ENS’ credibility within global internet governance discussions and help mitigate risks associated with name collisions and malicious domains.\\u003c/p\\u003e\\n\\u003cp\\u003eRead about \\u003ca href=\\\&quot;https://ens.domains/blog/post/icann-84-gtld\\\&quot;\\u003eHow ENS Is Approaching ICANN’s gTLD Expansion Program\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-growth-indicators-17\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-growth-indicators-17\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eGrowth Indicators\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eThe overarching Growth focus of 2025 was to show everything ENS can do. ENS is beyond a simple identity layer, supporting multi-chain addresses, being an open protocol for apps to seamlessly integrate, and works with DNS enabling teams to create their own namespace.\\u003c/p\\u003e\\n\\u003cp\\u003eWe have a creative vision for getting users to upgrade to ENSv2, and are bringing in the talent to help execute it. With this foundation, we can continue pursuing unique integrations, whether apps need universal identity, fintech companies that are bringing RWAs and banks onchain or the burgeoning AI agent space.\\u003c/p\\u003e\\n\\u003cp\\u003eImportantly, this foundation gives us the space to stay relentlessly focused on our primary goal in the first half of this year: bring ENSv2 to market.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/7/7434ee7da1bc7a36b073e48fd722beaa71d65792.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/7434ee7da1bc7a36b073e48fd722beaa71d65792\\\&quot; title=\\\&quot;16_Growth Indicators\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7434ee7da1bc7a36b073e48fd722beaa71d65792_2_690x431.png\\\&quot; alt=\\\&quot;16_Growth Indicators\\\&quot; data-base62-sha1=\\\&quot;gA0N6uyO0YVlmTD8FeXcr3pwTnQ\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;431\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7434ee7da1bc7a36b073e48fd722beaa71d65792_2_690x431.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7434ee7da1bc7a36b073e48fd722beaa71d65792_2_1035x646.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7434ee7da1bc7a36b073e48fd722beaa71d65792_2_1380x862.png 2x\\\&quot; data-dominant-color=\\\&quot;DEE8EA\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e16_Growth Indicators\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1812×1134 179 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eSource: \\u003ca href=\\\&quot;https://lookerstudio.google.com/u/0/reporting/8785928a-71d5-4b17-9fea-fe1c937b064f/page/p_ovi4hg0opc?s=j1wlK90ZIbA\\\&quot;\\u003eENS Dashboard\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eQ4 saw a drop in net-new registrations from Q3, with \\u003cstrong\\u003e32K,\\u003c/strong\\u003e while renewals remained consistent with the 2025 monthly averages. The broader ENS subname ecosystem hit new milestones this year:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eWorld App - world.id - 17,571,156 names\\u003c/li\\u003e\\n\\u003cli\\u003eCaldera - calderans.eth - 9,602,057 names\\u003c/li\\u003e\\n\\u003cli\\u003eUniswap - uni.eth - 2,000,000 names\\u003c/li\\u003e\\n\\u003cli\\u003eBase - base.eth - 917,000 names\\u003c/li\\u003e\\n\\u003cli\\u003eLinea - linea.eth - 530,000 names\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-60249-integrations-18\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-integrations-18\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIntegrations\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eDuring Q4, we remained focused on new integration opportunities while also tackling the challenges of ensuring all types of ENS names resolve.\\u003c/p\\u003e\\n\\u003cp\\u003eWe’ve prioritized partnering with FinTech apps that are leading the charge on bringing the larger consumer market of users onchain. Building partnerships in new verticals requires longer sales cycles than we might like sometimes, we now have the supporting case studies, contacts, and attention to help push along some exciting new ENS integrations in 2026.\\u003c/p\\u003e\\n\\u003cp\\u003eWe are optimistic that in 2026 we will see pilots using ENS subdomains for administering government services, opportunities to name real world assets moving, and explore partnerships with banking messaging networks to coordinate naming standards between financial institutions.\\u003c/p\\u003e\\n\\u003cp\\u003eCheck out how we partnered with \\u003ca href=\\\&quot;https://ens.domains/blog/post/d3-doma\\\&quot;\\u003eDoma Protocol / D3\\u003c/a\\u003e on tokenizing DNS domains. Also how ENS helped power \\u003ca href=\\\&quot;https://ens.domains/blog/post/celonames-powered-by-ens\\\&quot;\\u003eCelonames\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-60249-press-19\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-press-19\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003ePress\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eThe crypto media landscape saw major changes in 2025. Notably Axios shuttered their crypto newsletter after 3 years. Blockworks shuttered their newsroom, a pillar of crypto news since 2017. Crypto media isn’t dead, but the delineation of where crypto begins and ends is blurring. Crypto coverage is now an umbrella term falling into a variety of industries: finance, AI, privacy, identity.\\u003c/p\\u003e\\n\\u003cp\\u003eThis year, ENS entered many more of these spheres of influence. We were covered by DNS focused publications, policy reporters, financial reporters and crypto publications.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ4 highlights include:\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eNick Johnson’s commentary on the impacts Fusaka upgrade was featured in \\u003ca href=\\\&quot;https://www.dlnews.com/articles/defi/what-fusaka-upgrade-means-for-ethereum-410bn-blockchain/\\\&quot;\\u003eDL News\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://decrypt.co/350667/what-expect-ethereums-fusaka-upgrade\\\&quot;\\u003eDecrypt\\u003c/a\\u003e (which was later syndicated by \\u003ca href=\\\&quot;https://finance.yahoo.com/news/expect-ethereum-fusaka-upgrade-194102650.html\\\&quot;\\u003eYahoo Finance\\u003c/a\\u003e)\\u003c/li\\u003e\\n\\u003cli\\u003eAlex Urbelis was quoted in a \\u003ca href=\\\&quot;https://www.coindesk.com/policy/2025/12/15/most-influential-roman-storm\\\&quot;\\u003eCoinDesk article\\u003c/a\\u003e around Roman Storms impact this year\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://www.ccn.com/education/crypto/ens-labs-shopify-ux-onchain-identity-james-beck/\\\&quot;\\u003eCCN EOY/2026 outlook piece\\u003c/a\\u003e on how ENS is evolving from naming into a broader onchain identity layer, including ENSv2, Namechain, cross-chain interoperability, and what this means for UX and Ethereum’s roadmap heading into 2026\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-combating-the-ens-npm-supply-chain-attack-20\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-combating-the-ens-npm-supply-chain-attack-20\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eCombating the ENS NPM Supply Chain Attack\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eOn November 24, 2025, ENS Labs identified that certain NPM packages containing ENS packages were targeted by a Sh1-Hulud supply-chain attack compromising 400+ NPM libraries.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/8/8e41d834c72944ad059f59955dae2e6ebeeaba2d.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/8e41d834c72944ad059f59955dae2e6ebeeaba2d\\\&quot; title=\\\&quot;17_Combating the ENS NPM Supply Chain Attack\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/8e41d834c72944ad059f59955dae2e6ebeeaba2d_2_452x499.jpeg\\\&quot; alt=\\\&quot;17_Combating the ENS NPM Supply Chain Attack\\\&quot; data-base62-sha1=\\\&quot;kisS4oVRaAxbOaEEnyAYH4EQt6B\\\&quot; width=\\\&quot;452\\\&quot; height=\\\&quot;499\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/8e41d834c72944ad059f59955dae2e6ebeeaba2d_2_452x499.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/8e41d834c72944ad059f59955dae2e6ebeeaba2d_2_678x748.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/8e41d834c72944ad059f59955dae2e6ebeeaba2d_2_904x998.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;161718\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e17_Combating the ENS NPM Supply Chain Attack\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1122×1240 111 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWith urgency, the entire team across Engineering leadership, Security, Operations, Growth, and Legal jumped into action for threat and impact assessment of our 44 \\u003ca href=\\\&quot;https://enslabs.notion.site/ENS-update-on-npm-packages-supply-chain-attack-2b57a8b1f0ed8084b807ea445ce5c970\\\&quot;\\u003eENS Domains packages\\u003c/a\\u003e. Based on our investigation, we removed all affected NPM packages and we confirmed there were \\u003cem\\u003ezero\\u003c/em\\u003e downloads of the compromised package versions.\\u003c/p\\u003e\\n\\u003cp\\u003eThe malicious script originated from an external project unrelated to ENS Labs’ core code. It was introduced via a PostHog dependency that executed a postinstall script containing the Shai Hulud malware. The affected development environment was isolated, and all publishing credentials were rotated.\\u003c/p\\u003e\\n\\u003cp\\u003eTo proactively combat future cases of similar supply chain attacks, we have strengthened our repository and deployment procedures, as well as:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eUsing \\u003cstrong\\u003elatest\\u003c/strong\\u003e tags and will continue proceeding with key rotations.\\u003c/li\\u003e\\n\\u003cli\\u003eRequiring 2FA and disallowing tokens on NPM, using only trusted publishers.\\u003c/li\\u003e\\n\\u003cli\\u003eEnsuring all code repositories are on the latest version of \\u003cstrong\\u003epnpm\\u003c/strong\\u003e.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-financial-reporting-21\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-financial-reporting-21\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eFinancial Reporting\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/8/82eef28333ea362096dd2fc7b16a83965fed361b.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/82eef28333ea362096dd2fc7b16a83965fed361b\\\&quot; title=\\\&quot;18_Q4 Quarterly Income Statement\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82eef28333ea362096dd2fc7b16a83965fed361b_2_690x328.png\\\&quot; alt=\\\&quot;18_Q4 Quarterly Income Statement\\\&quot; data-base62-sha1=\\\&quot;iGi0PA2cZcrT7fefFSio5a2DqUX\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;328\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82eef28333ea362096dd2fc7b16a83965fed361b_2_690x328.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82eef28333ea362096dd2fc7b16a83965fed361b_2_1035x492.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82eef28333ea362096dd2fc7b16a83965fed361b_2_1380x656.png 2x\\\&quot; data-dominant-color=\\\&quot;ECECEC\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e18_Q4 Quarterly Income Statement\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1796×856 140 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-60249-income-22\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-income-22\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIncome\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eAs of FY2025 close on December 31, 2025, we have received $9,697,500.00 USDC from the ENS DAO.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-60249-expenses-23\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-expenses-23\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eExpenses\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eOur expenses for Q4 2025 totaled $1,265,638.30 USD (~40% decrease from Q3) with total FY expenses totalling $6,150,727.97 USD.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/c/cd90628b8480c46cc2042596c6a21a4ef0621e05.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/cd90628b8480c46cc2042596c6a21a4ef0621e05\\\&quot; title=\\\&quot;19_Q4 Expenses\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/c/cd90628b8480c46cc2042596c6a21a4ef0621e05_2_690x433.png\\\&quot; alt=\\\&quot;19_Q4 Expenses\\\&quot; data-base62-sha1=\\\&quot;tkvdVWKY1rkn1EuTtfNACzZYdYV\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;433\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/c/cd90628b8480c46cc2042596c6a21a4ef0621e05_2_690x433.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/c/cd90628b8480c46cc2042596c6a21a4ef0621e05_2_1035x649.png 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/c/cd90628b8480c46cc2042596c6a21a4ef0621e05.png 2x\\\&quot; data-dominant-color=\\\&quot;D6D7D8\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e19_Q4 Expenses\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1314×826 99.7 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eFor Q4, the top three expense categories were:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eEmployee Compensation \\u0026amp; Benefits\\u003c/strong\\u003e (51.5%) for payroll, benefits, and employer contributions for our 31 full-time employees and two contractors.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eProfessional Services\\u003c/strong\\u003e (24.6%) included ENSv2 infrastructure and audit teams, as well as regular expenses to our operational external agencies and firms (e.g. Legal, Recruiting, PR).\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eIT \\u0026amp; Software Hosting\\u003c/strong\\u003e (6.0%) regular hosting, infrastructure, and organizational tooling software providers (e.g. Google Suite, Cloudflare).\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-h-2026-the-year-of-ensv2-24\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-h-2026-the-year-of-ensv2-24\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003e2026: The year of ENSv2\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eQ4 2025 brought ENS Labs to a new stage of readiness. ENSv2 is now code complete, early interfaces live in private alpha, and ecosystem readiness efforts are underway across tooling, documentation, and partnerships.\\u003c/p\\u003e\\n\\u003cp\\u003eAs ENS Labs enters 2026, priorities are aligned across the organization:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eComplete ENSv2 launch readiness and coordinated ecosystem adoption\\u003c/li\\u003e\\n\\u003cli\\u003eExpand the ENS Manager and ENS Explorer apps from private alpha to public testing\\u003c/li\\u003e\\n\\u003cli\\u003eDeliver a clear, well-supported migration experience for ENS users\\u003c/li\\u003e\\n\\u003cli\\u003eContinue strengthening ENS’s role within DNS governance and security ecosystems\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eWe are grateful to the ENS DAO for its continued trust and support. The progress made in Q4 reflects years of groundwork and growing organizational alignment, and we look forward to sharing further launch milestones in the months ahead.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:8,\&quot;updated_at\&quot;:\&quot;2026-01-22T17:21:23.222Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:128,\&quot;reads\&quot;:50,\&quot;readers_count\&quot;:49,\&quot;score\&quot;:955.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:20565,\&quot;topic_slug\&quot;:\&quot;ens-labs-quarterly-progress-reports\&quot;,\&quot;display_username\&quot;:\&quot;Katherine Wu\&quot;,\&quot;primary_group_name\&quot;:\&quot;delegates\&quot;,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://jobs.ashbyhq.com/ens-l  Newsletter #105 — 2/1/2026\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Delegate\&quot;,\&quot;title_is_group\&quot;:true,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:14}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:7836,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/ens-labs-quarterly-progress-reports/20565/6\&quot;,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:12},{\&quot;id\&quot;:\&quot;fire\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:1},{\&quot;id\&quot;:\&quot;tada\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:1}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:14,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:61101,\&quot;name\&quot;:\&quot;Katherine Wu\&quot;,\&quot;username\&quot;:\&quot;katherine.eth\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discuss.ens.domains/katherine.eth/{size}/7729_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2026-04-17T21:07:45.768Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-ens-labs-quarterly-report-q1-2026-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-ens-labs-quarterly-report-q1-2026-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS Labs Quarterly Report -\\u003c/strong\\u003e Q1 2026\\u003c/h1\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-abstract-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-abstract-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eAbstract\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eQ1 2026 accelerated exciting progress towards ENSv2’s launch in the coming months.\\u003c/p\\u003e\\n\\u003cp\\u003eAcross ENS Labs, two threads came together this quarter that set up the final push: the team reached the shape we need for v2 delivery, and our company-wide offsite locked in organizational alignment on mission, vision, and go-to-market.\\u003c/p\\u003e\\n\\u003cp\\u003eIn February, we launched public alphas of both the \\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-app-alpha\\\&quot;\\u003eENS App\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-explorer-alpha\\\&quot;\\u003eENS Explorer\\u003c/a\\u003e on Sepolia testnet, sharing with the community the first interaction with the next generation of ENS applications. By quarter end, ENSv2 contracts were 100% written with 98% test coverage and are now with auditors for a final check.\\u003c/p\\u003e\\n\\u003cp\\u003eThis quarter was also defined by a difficult \\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-staying-on-ethereum\\\&quot;\\u003earchitectural decision\\u003c/a\\u003e to deploy ENSv2 exclusively on Ethereum L1, and to cease development of Namechain. This decision was ultimately the correct path forward for the protocol and has simplified migration paths for millions of names, and will enable users to register or renew an ENS name with stablecoins from any EVM chain without manual bridging or gas, and focuses engineering efforts beyond the deployment stack.\\u003c/p\\u003e\\n\\u003cp\\u003eThere were also new opportunities for ENS that we pursued and started ideating around: we deepened our position across the AI frontier striving \\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-ai-agent-erc8004\\\&quot;\\u003eto solve the identity problem in agentic commerce\\u003c/a\\u003e. In March, we introduced \\u003ca href=\\\&quot;https://ens.domains/blog/post/on-eth-chain-registry\\\&quot;\\u003eon.eth\\u003c/a\\u003e in collaboration with ecosystem partners, advancing a more unified approach to interoperable naming. This work establishes a canonical onchain registry, replacing fragmented offchain systems with verifiable onchain resolution via \\u003ca href=\\\&quot;https://eips.ethereum.org/EIPS/eip-7828\\\&quot;\\u003eERC-7828\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eQ1 set the foundation for what comes next: ENSv2 Beta launches in May on testnet, with ENSv2 mainnet as a fast follow.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-team-updates-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-team-updates-3\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eTeam Updates\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eWe closed Q1 at 39 full-time employees, with 7 new hires across Product, Design, Engineering, Growth, and DevRel (a 21% headcount increase). This is the right sized team for ENS Labs to achieve v2 delivery and beyond.\\u003c/p\\u003e\\n\\u003cp\\u003eENSv2 is a complete reimagining of ENS and goes way beyond a single deliverable: it spans the protocol itself, a consumer app, a developer-grade explorer, enterprise-grade resolution infrastructure, and the migration tooling required to carry millions of existing names from v1 to v2 without breaking the experience for anyone. Shipping all of that and seeing it integrated broadly across hundreds of wallets, apps, and interfaces requires migration readiness, developer enablement, and go-to-market execution running in parallel. We feel incredibly energized with this team for ENSv2, and do not anticipate having additional hiring needs in the next quarters to come.\\u003c/p\\u003e\\n\\u003cp\\u003eIn March, we brought together the team for our largest scale IRL offsite. The goals were straightforward: confirm ENSv2 launch readiness, align on the go-to-market plan, explore new areas of opportunity, and renew ENS Labs’ mission, vision, and values.\\u003c/p\\u003e\\n\\u003cp\\u003eWe left with all three.\\u003c/p\\u003e\\n\\u003cp\\u003eOur vision: to make ENS the universal pointer for anything on the internet, and the naming layer for all emerging digital primitives.\\u003c/p\\u003e\\n\\u003cp\\u003eOur values: permissionlessness, commitment to open source, and credible neutrality.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/e/e7325ad03cc3cb7af0a828319b539bd0a1c96217.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/e7325ad03cc3cb7af0a828319b539bd0a1c96217\\\&quot; title=\\\&quot;1_2026 Company Offsite\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e7325ad03cc3cb7af0a828319b539bd0a1c96217_2_458x500.jpeg\\\&quot; alt=\\\&quot;1_2026 Company Offsite\\\&quot; data-base62-sha1=\\\&quot;wZgbaIg1NbahnwdjYsm7owitAEv\\\&quot; width=\\\&quot;458\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e7325ad03cc3cb7af0a828319b539bd0a1c96217_2_458x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e7325ad03cc3cb7af0a828319b539bd0a1c96217_2_687x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e7325ad03cc3cb7af0a828319b539bd0a1c96217_2_916x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;E9ECE9\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e1_2026 Company Offsite\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1092×1190 251 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe offsite also clarified three adoption drivers we’re orienting around for 2026 and beyond:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eStablecoin payments as the new nexus of real-world crypto adoption\\u003c/li\\u003e\\n\\u003cli\\u003ePrioritizing integrations, particularly with FinTechs (much longer sales cycle but worthwhile impact)\\u003c/li\\u003e\\n\\u003cli\\u003eExplore APIs and other products and services that would make for a more seamless integration experience across new and existing partners\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/3/372de05e8bd1c3249ee015718e7736f8624bf2b0.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/372de05e8bd1c3249ee015718e7736f8624bf2b0\\\&quot; title=\\\&quot;4_ENS Labs Team Photo\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/3/372de05e8bd1c3249ee015718e7736f8624bf2b0_2_690x474.jpeg\\\&quot; alt=\\\&quot;4_ENS Labs Team Photo\\\&quot; data-base62-sha1=\\\&quot;7S8y8Tb7wAWBvARIwiTLw1qXeyk\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;474\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/3/372de05e8bd1c3249ee015718e7736f8624bf2b0_2_690x474.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/3/372de05e8bd1c3249ee015718e7736f8624bf2b0_2_1035 ioritizing bug fixes and usability improvements based on real user feedback, strengthening the foundation for the production-ready versions soon to come.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/8/8b41aaf035306db0b295c641cfb47528116f071f.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/8b41aaf035306db0b295c641cfb47528116f071f\\\&quot; title=\\\&quot;6_ENSv2 App Public Alpha_1\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/8b41aaf035306db0b295c641cfb47528116f071f_2_685x500.jpeg\\\&quot; alt=\\\&quot;6_ENSv2 App Public Alpha_1\\\&quot; data-base62-sha1=\\\&quot;jRV3LUkLI4tIlJBcDSsuHkcpY87\\\&quot; width=\\\&quot;685\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/8b41aaf035306db0b295c641cfb47528116f071f_2_685x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/8b41aaf035306db0b295c641cfb47528116f071f_2_1027x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/8/8b41aaf035306db0b295c641cfb47528116f071f.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;E8E1E5\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e6_ENSv2 App Public Alpha_1\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1306×952 207 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u00 t; href=\\\&quot;#p-61101-ens-app-6\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS App\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eThe ENS App emphasizes simplicity and onboarding users. Here is a non-exhaustive list of Q1 alpha launch features for the ENS App:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eSingle-Click Registration Flow:\\u003c/strong\\u003e One-click name registration using Smart Sessions with stablecoin payment support, while still allowing optional manual wallet approvals.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eDashboard:\\u003c/strong\\u003e Unified dashboard displaying primary names, all owned names with search and filtering, accurate metadata including expiry and primary status, and dynamic insights.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eProfile Editing:\\u003c/strong\\u003e Detailed name profile view with Smart Session support for seamless record edits for owners or accounts with appropriate role permissions.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eNotifications:\\u003c/strong\\u003e Real-time notification service supporting Telegram, email, and in-browser channels with configurable preferences.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eInternationalization:\\u003c/strong\\u003e Multi-language support to serve ENS’s global user base.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eWallet Auto-Funding:\\u003c/strong\\u003e Streamlined onboarding by enabling wallet auto-funding registration (for alpha testing purposes only).\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003ePrimary Name Flow:\\u003c/strong\\u003e Improved flow for setting and managing primary names.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/7 rong\\u003e is the source of truth for ENS: a comprehensive developer tool offering complete protocol visibility with precise controls. This is the tooling that should showcase the full power of the ENS protocol to power users and more technical users who would like a data-rich view- the complete opposite of the abstraction principles that rule the ENS App. As ENS serves an incredibly diverse user base, these two products are made for both sides of the abstraction/ complication spectrum.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/5/587716657ffe21cb38223d2b52692c4618476575.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/587716657ffe21cb38223d2b52692c4618476575\\\&quot; title=\\\&quot;9_ENSv2 Explorer Public Alpha_1\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/587716657ffe21cb38223d2b52692c4618476575_2_676x500.jpeg\\\&quot; alt=\\\&quot;9_ENSv2 Explorer Public Alpha_1\\\&quot; data-base62-sha1=\\\&quot;cCB9ZvrOUkNQD7yTZVLHEyX0a9L\\\&quot; width=\\\&quot;676\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/587716657ffe21cb38223d2b52692c4618476575_2_676x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/587716657ffe21cb38223d2b52692c4618476575_2_1014x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/587716657ffe21cb38223d2b52692c4618476575_2_1352x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F4F4F5\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e9_ENSv2 Explorer Public Alpha_1\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1380×1020 139 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/98719c6465edac10f35b995bad37d604d3dcb998.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/98719c6465edac10f35b995bad37d604d3dcb998\\\&quot; title=\\\&quot;10_ENSv2 Explorer Public Alpha_2\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/98719c6465edac10f35b995bad37d604d3dcb998_2_690x471.jpeg\\\&quot; alt=\\\&quot;10_ENSv2 Explorer Public Alpha_2\\\&quot; data-base62-sha1=\\\&quot;lKzZ7eJvhDYoUYLChJSyXxv50da\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;471\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/98719c6465edac10f35b995bad37d604d3dcb998_2_690x471.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/98719c6465edac10f35b995bad37d604d3dcb998_2_1035x706.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/98719c6465edac10f35b995bad37d604d3dcb998_2_1380x942.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F7F7F7\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e10_ENSv2 Explorer Public Alpha_2\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1442×986 89.9 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eHere is a non-exhaustive list of Q1 alpha launch features for the Explorer:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eToken info, roles, and fuses display\\u003c/li\\u003e\\n\\u003cli\\u003eName registration directly from Explorer\\u003c/li\\u003e\\n\\u003cli\\u003eTemporary premiums and bulk or single renewals\\u003c/li\\u003e\\n\\u003cli\\u003eResolver pages with aliasing and history\\u003c/li\\u003e\\n\\u003cli\\u003ePermissioned resolver dashboard with owned resolver management\\u003c/li\\u003e\\n\\u003cli\\u003eImproved search functionality\\u003c/li\\u003e\\n\\u003cli\\u003eEnhanced editing via transaction manager\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eNow is the perfect time to check out the \\u003ca href=\\\&quot;https://app.ens.dev/\\\&quot;\\u003eENS App Alpha\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://explorer.ens.dev/\\\&quot;\\u003eENS Explorer Alpha\\u003c/a\\u003e and leave feedback directly in-app! We are working quickly to refine our final versions and would welcome any further feedback.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-ensv2-architecture-universal-resolver-8\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-ensv2-architecture-universal-resolver-8\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENSv2 Architecture \\u0026amp; Universal Resolver\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eENSv2 is a reinvention of the ENS protocol that is designed around the idea of giving users unprecedented control over their namespace. With v2, ENS will move away from a single, flat registry contract and towards hierarchical registries.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/ensv2-architecture\\\&quot;\\u003eA hierarchical architecture is one\\u003c/a\\u003e where every ENS name can have its own resolver and a subregistry. That opens up subtree management, a flexible roles system (resolver, name/node, record), and multi-name registry management. When a name expires, it’s removed from the registry immediately, so re-registration and subname management start from a clean slate.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/8/84065564bc0659944813bd359459a2e7a5f2bf86.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/84065564bc0659944813bd359459a2e7a5f2bf86\\\&quot; title=\\\&quot;11_ENSv2 Universal Resolver\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/84065564bc0659944813bd359459a2e7a5f2bf86_2_556x499.jpeg\\\&quot; alt=\\\&quot;11_ENSv2 Universal Resolver\\\&quot; data-base62-sha1=\\\&quot;iPWAVTCBVZIbQx3kq12fV1822yO\\\&quot; width=\\\&quot;556\\\&quot; height=\\\&quot;499\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/84065564bc0659944813bd359459a2e7a5f2bf86_2_556x499.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/84065564bc0659944813bd359459a2e7a5f2bf86_2_834x748.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/84065564bc0659944813bd359459a2e7a5f2bf86_2_1112x998.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;ECEFED\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e11_ENSv2 Universal Resolver\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1256×1128 196 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eName resolution in v2 will also undergo a smoother upgrade path. In v2, clients no longer handle resolution themselves. Instead, they call a single \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://docs.ens.domains/resolvers/universal/\\\&quot;\\u003eUniversal Resolver\\u003c/a\\u003e\\u003c/strong\\u003e contract that manages the entire process. That means resolution occurs either directly onchain or through coordinating CCIP-Read lookups, where offchain data is fetched and finalized onchain. All the while, complexities of the new hierarchical lookup process are hidden from the client implementations.\\u003c/p\\u003e\\n\\u003cp\\u003eThis provides a seamless experience for end users during the upgrade from v1 to v2. In the simplest case, developers simply use the latest Viem or Ethers libraries, instead of having to rewrite integrations. We are optimizing for all major ENS integrations to be “v2 ready” before users upgrade so that there are no disruptions during or post launch. ENSv2 becomes more powerful under the hood while everything on the surface keeps working exactly as before.\\u003c/p\\u003e\\n\\u003cp\\u003eThere are already dozens of ENS-integrated projects that are “ENSv2-ready” using the Universal Resolver. As part of v2 launch readiness, we are racing to ensure that as many major ENS compatible partners are part of v2 at launch.\\u003c/p\\u003e\\n\\u003cp\\u003eBy end of Q1, ENSv2 contracts were deployed to Sepolia, test coverage was at 98%, contracts were 100% written, and the code is now with auditors. Other Q1 engineering milestones:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eLaunched the ENS App and ENS Explorer public alphas using an internally-built indexer\\u003c/li\\u003e\\n\\u003cli\\u003eNamechain code fully removed, making ENSv2 entirely independent of ENSv1 contracts\\u003c/li\\u003e\\n\\u003cli\\u003eImproved migration process with a clear upgrade path and forward compatibility with ENSv1\\u003c/li\\u003e\\n\\u003cli\\u003eSecurity improvements via more granular contract control\\u003c/li\\u003e\\n\\u003cli\\u003eUsability improvements to registry contracts\\u003c/li\\u003e\\n\\u003cli\\u003eDNSSEC bug fix and optimized v1 security\\u003c/li\\u003e\\n\\u003cli\\u003eSecurity controllers implemented for registrar and root\\u003c/li\\u003e\\n\\u003cli\\u003eL2 primary name bug fixes with better efficiency and reliability\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-shaping-the-v2-experience-9\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-shaping-the-v2-experience-9\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eShaping the V2 Experience\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eOne of our initial goals when designing Namechain was to ensure that interacting across EVM chains no longer felt like a fragmented user experience. The L1-only decision has not changed that goal. For the ENS names purchase flow in v2, we have \\u003ca href=\\\&quot;https://www.rhinestone.dev/blog/crosschain-checkout-for-ens-name-registration-using-rhinestone\\\&quot;\\u003epartnered with Rhinestone\\u003c/a\\u003e to make the ENSv2 purchase flow feel like a single, unified experience regardless of where a user’s assets are. With this integration, name registration is ‘one step’ using an intents-based registration flow. This means that names can be registered using assets from any EVM chain without manual bridging or gas management. We believe this will be a huge unlock for user experience in today’s multichain ecosystem.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/6/6ae31d0a8298270f7c56baa7046000ea9cb9dbb8.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/6ae31d0a8298270f7c56baa7046000ea9cb9dbb8\\\&quot; title=\\\&quot;12_ENS Rhinestone Partnership\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6ae31d0a8298270f7c56baa7046000ea9cb9dbb8_2_690x313.jpeg\\\&quot; alt=\\\&quot;12_ENS Rhinestone Partnership\\\&quot; data-base62-sha1=\\\&quot;ffzcpsCZLUxuRbOKsZJyX9kkm4E\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;313\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6ae31d0a8298270f7c56baa7046000ea9cb9dbb8_2_690x313.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6ae31d0a8298270f7c56baa7046000ea9cb9dbb8_2_1035x469.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/6/6ae31d0a8298270f7c56baa7046000ea9cb9dbb8.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;1E1E1E\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e12_ENS Rhinestone Partnership\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1334×606 81.8 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAdditionally, our design team ran a full review of both the ENS App and Explorer to assess impact on existing user flows after the decision to stay on the L1. Because the design foundations were already built around the user, the core impact was minimal. Design completed an audit for consistency across both apps, and the upgrade flow was rescoped into a simpler, more focused experience.\\u003c/p\\u003e\\n\\u003cp\\u003eWith the beta version of the apps targeted for release in May, we will be focused on the following in Q2:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eUpgrading priority integrators to the Universal Resolver\\u003c/li\\u003e\\n\\u003cli\\u003eCompleting the notification service, new contract data indexing, and account abstraction infrastructure\\u003c/li\\u003e\\n\\u003cli\\u003eDeeper Para integration for users who create a wallet via social or email\\u003c/li\\u003e\\n\\u003cli\\u003eShipping updated `ensjs` and a self-contained test environment for local ENS development\\u003c/li\\u003e\\n\\u003cli\\u003eProducing comprehensive ENSv2 developer documentation ahead of launch\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eMaintenance also continued on the existing ENS Manager app, including WebSocket migration, DNS sync fixes, avatar and header crop improvements, mobile profile fixes, and an ENSjs v4.2.2 upgrade.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-empowering-the-developer-ecosystem-10\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-empowering-the-developer-ecosystem-10\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eEmpowering the Developer Ecosystem\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/d/d77071c154ec4369c7f3edbfff6474656af6f33e.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/d77071c154ec4369c7f3edbfff6474656af6f33e\\\&quot; title=\\\&quot;13_ENSv2 Readiness Checker\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/d/d77071c154ec4369c7f3edbfff6474656af6f33e_2_676x500.jpeg\\\&quot; alt=\\\&quot;13_ENSv2 Readiness Checker\\\&quot; data-base62-sha1=\\\&quot;uJRz9Omx6jmd39POL62chzaCV8q\\\&quot; width=\\\&quot;676\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/d/d77071c154ec4369c7f3edbfff6474656af6f33e_2_676x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/d/d77071c154ec4369c7f3edbfff6474656af6f33e_2_1014x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/d/d77071c154ec4369c7f3edbfff6474656af6f33e.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;1B1B1D\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e13_ENSv2 Readiness Checker\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1282×948 101 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWith our dedicated ENSv2 Readiness squad across DevRel, Growth, and Engineering, the team focused on building out critical infrastructure for the v2 upgrade including:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ens-v2-checker.vercel.app/\\\&quot;\\u003eENSv2 Readiness Checker\\u003c/a\\u003e to help integrators verify compatibility\\u003c/li\\u003e\\n\\u003cli\\u003eCreated the \\u003ca href=\\\&quot;https://github.com/ensdomains/resolution-tests\\\&quot;\\u003eresolution-tests\\u003c/a\\u003e repo, a standardized test suite to verify ENS resolution accuracy across libraries and tools\\u003c/li\\u003e\\n\\u003cli\\u003eDeveloped and documented an \\u003ca href=\\\&quot;https://github.com/ensdomains/ethers-patch\\\&quot;\\u003eethers.js monkey patch\\u003c/a\\u003e for ENSv2 compatibility\\u003c/li\\u003e\\n\\u003cli\\u003eDrafted Wallet Integration Guidelines to help wallets prepare for ENSv2\\u003c/li\\u003e\\n\\u003cli\\u003eAchieved 23% Universal Resolver adoption on NPM and 10.8% of GitHub repositories with 10+ stars ready for ENSv2\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eThe growth of our DevRel, Growth, and Engineering teams in Q1 made a dedicated ENSv2 Readiness squad possible. We’re excited how much further these scaled teams can bring us to winning cornerstone integrations in the next few quarters. We also launched ENS Developer Office Hours, a biweekly community call for developers building with ENS, with our ENS Developers Telegram growing from 560 to 606 members in Q1.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-hackathons-developer-engagement-11\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-hackathons-developer-engagement-11\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eHackathons \\u0026amp; Developer Engagement\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-61101-ethglobal-hackmoney-2026-virtual-12\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-ethglobal-hackmoney-2026-virtual-12\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eETHGlobal HackMoney 2026 [Virtual]\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eWe started the year strong with ETHGlobal’s HackMoney with 45% ENS adoption, the highest rate compared to any other ETHGlobal attended events!\\u003c/p\\u003e\\n\\u003cp\\u003eThere were 272 of 600+ projects represented by 1,300+ hackers globally that were built on ENS. We were excited to award $5,000 in prizes by pooling prizes across 145 teams.\\u003c/p\\u003e\\n\\u003cp\\u003eCheck out the winners for Most Creative Use of ENS for DeFi:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e\\u003ca href=\\\&quot;https://ethglobal.com/showcase/acn-38ima\\\&quot;\\u003eACN\\u003c/a\\u003e\\u003c/strong\\u003e (Agent Commitment Network) - Decentralized marketplace designed to solve the critical trust gap in autonomous AI agent ecosystems. Achieved by using ENS + EIP-8004 for onchain agent identity, then storing portable reputation records directly on the ENS PublicResolver, and then establishing agent identities as immutable NFTs.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e\\u003ca href=\\\&quot;https://ethglobal.com/showcase/gridgame-hyperswiper-dytxo\\\&quot;\\u003eGridGame-HyperSwiper\\u003c/a\\u003e\\u003c/strong\\u003e - Blockchain-native multiplayer game where ENS identity, verifiable skill, and state channels are core to gameplay, not just settlement.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e\\u003ca href=\\\&quot;https://ethglobal.com/showcase/takeaway-xx1h8\\\&quot;\\u003eTakeaway\\u003c/a\\u003e\\u003c/strong\\u003e - Create chain-specific ENS subnames. Send funds to the subname, and a relayer automatically reads your destination chain and address from ENS text records and bridges the funds via \\u003ca href=\\\&quot;http://Li.Fi\\\&quot;\\u003eLi.Fi\\u003c/a\\u003e. No bridge UI, no extra signing after setup.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-61101-h-13\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-h-13\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-61101-ethdenver-2026-14\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-ethdenver-2026-14\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eETHDenver 2026\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eWe sponsored ETHDenver with a booth at Etherspace, where Greg (DevRel Engineer) gave a Main Stage talk on “\\u003ca href=\\\&quot;https://www.youtube.com/watch?v=soXkDEYt_hg\\\&quot;\\u003eBuilding Resilient Websites With ENS\\u003c/a\\u003e.” This year there was strong attendance amongst attendees from traditional finance and FinTech backgrounds compared to previous years.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/2/268a13a3e2bb7ce178eae361cd24b53731cf8ad8.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/268a13a3e2bb7ce178eae361cd24b53731cf8ad8\\\&quot; title=\\\&quot;14_ETHDenver 2026\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/268a13a3e2bb7ce178eae361cd24b53731cf8ad8_2_690x383.jpeg\\\&quot; alt=\\\&quot;14_ETHDenver 2026\\\&quot; data-base62-sha1=\\\&quot;5uVYfVcwT6sWpnRHX94UICSPAKs\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;383\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/268a13a3e2bb7ce178eae361cd24b53731cf8ad8_2_690x383.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/268a13a3e2bb7ce178eae361cd24b53731cf8ad8_2_1035x574.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/2/268a13a3e2bb7ce178eae361cd24b53731cf8ad8.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;836673\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e14_ETHDenver 2026\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1264×702 191 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eETHDenver showcased ENS in action by \\u003ca href=\\\&quot;https://x.com/ensdomains/status/2023769405776380343\\\&quot;\\u003epowering the ticketing system\\u003c/a\\u003e with \\u003ca href=\\\&quot;http://unicorn.ethdenver.com\\\&quot;\\u003eunicorn.ethdenver.com\\u003c/a\\u003e with each attendee ticket represented as a human-readable identity on Ethereum.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/9d97a26edfdc3b7afeb289f72cf9ee90e18263ed.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/9d97a26edfdc3b7afeb289f72cf9ee90e18263ed\\\&quot; title=\\\&quot;15_ETHDenver 2026 Unicorn.eth\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9d97a26edfdc3b7afeb289f72cf9ee90e18263ed_2_690x445.jpeg\\\&quot; alt=\\\&quot;15_ETHDenver 2026 Unicorn.eth\\\&quot; data-base62-sha1=\\\&quot;mu7PYnqmxGHgFKdWVfmuSVHB2oJ\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;445\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9d97a26edfdc3b7afeb289f72cf9ee90e18263ed_2_690x445.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9d97a26edfdc3b7afeb289f72cf9ee90e18263ed_2_1035x667.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/9/9d97a26edfdc3b7afeb289f72cf9ee90e18263ed.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;121313
