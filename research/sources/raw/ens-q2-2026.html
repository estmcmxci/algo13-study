        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_20565&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:56990,\&quot;name\&quot;:\&quot;Katherine Wu\&quot;,\&quot;username\&quot;:\&quot;katherine.eth\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discuss.ens.domains/katherine.eth/{size}/7729_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T01:47:13.698Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003cstrong\\u003eOverview\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eTo continue scaling and evolving ENS, ENS Labs has submitted a \\u003ca href=\\\&quot;https://discuss.ens.domains/t/temp-check-ep-5-22-ensv2-development-funding-request/19762/3\\\&quot;\\u003efunding request\\u003c/a\\u003e to pursue ENSv2 Development,the most significant upgrade to the ENS protocol since its inception in 2017. Given the scale of this initiative, along with the resources needed for its maintenance, auditing, and deployment, this request reflects a substantial increase over previous years’ funding.\\u003c/p\\u003e\\n\\u003cp\\u003eENS Labs is deeply committed to both decentralization in our technology and transparency in our processes. We recognize the responsibility and trust that accompanies the funding we receive from the DAO. In response to community feedback on our funding request, we are enhancing our \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-transparency-reports/19806\\\&quot;\\u003ecommitment\\u003c/a\\u003e to transparency by providing quarterly financial and progress reports as it relates to ENSv2 development, starting Q1 of 2025, which will be posted to this thread.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQuarterly Reports\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e2025- \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/2\\\&quot;\\u003eQ1 Report\\u003c/a\\u003e  (January 01, 2025- March 31, 2025)\\u003cbr\\u003e\\n2025- \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/4\\\&quot;\\u003eQ2 Report\\u003c/a\\u003e (April 01, 2025- June 30, 2025)\\u003cbr\\u003e\\n2025- \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/5\\\&quot;\\u003eQ3 Report\\u003c/a\\u003e (July 01, 2025- September 30, 2025)\\u003cbr\\u003e\\n2025- \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/6\\\&quot;\\u003eQ4 Report\\u003c/a\\u003e (October 01- December 31, 2025)\\u003cbr\\u003e\\n2026- \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/7\\\&quot;\\u003eQ1 Report\\u003c/a\\u003e(January 01, 2026 - March 31, 2026)\\u003cbr\\u003e\\n2026- \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/8\\\&quot;\\u003eQ2 Report\\u003c/a\\u003e (April 01, 2026- June 30, 2025)\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eComments on this thread are restricted for ease of read. If you would like to discuss any developments related to these reports, please create a new post under \\u003ca href=\\\&quot;https://discuss.ens.domains/c/ens-dev/\\\&quot;\\u003eENS Development\\u003c/a\\u003e\\u003c/em\\u003e.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:8,\&quot;updated_at\&quot;:\&quot;2026-07-18T01:57:54.485Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:379,\&quot;reads\&quot;:84,\&quot;readers_count\&quot;:83,\&quot;score\&quot;:1936.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:20565,\&quot;topic_slug\&quot;:\&quot;ens-labs-quarterly-progress-reports\&quot;,\&quot;display_username\&quot;:\&quot;Katherine Wu\&quot;,\&quot;primary_group_name\&quot;:\&quot;delegates\&quot;,\&quot;flair_name\&quot;:null,\&quot;fla ;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:7836,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/ens-labs-quarterly-progress-reports/20565/1\&quot;,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:2}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:2,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:56991,\&quot;name\&quot;:\&quot;Katherine Wu\&quot;,\&quot;username\&quot;:\&quot;katherine.eth\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discuss.ens.domains/katherine.eth/{size}/7729_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T02:09:41.950Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003ch1\\u003e\\u003ca name=\\\&quot;p-56991-ens-labs-quarterly-report-q1-2025-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-ens-labs-quarterly-report-q1-2025-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS Labs Quarterly Report - Q1 2025\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-56991-abstract-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-abstract-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eAbstract\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eIn October 2024, ENS Labs achieved quorum in favor of ENSv2 funding, marking a significant milestone in the evolution and growth of the ENS protocol. The DAO’s \\u003ca href=\\\&quot;https://www.tally.xyz/gov/ens/proposal/33504840096777976512510989921427323867039135570342563123194157971712476988820\\\&quot;\\u003eapproval\\u003c/a\\u003e increased ENS Labs’ annual budget to $9.7M USDC, with an additional one-time grant allocated to ENSv2 security audits.\\u003c/p\\u003e\\n\\u003cp\\u003eAs \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-transparency-reports/19806\\\&quot;\\u003epromised\\u003c/a\\u003e, quarterly transparency reports will be provided in this forum to provide financial and technical progress updates on the development of ENSv2 and ENS’ L2 Namechain.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-56991-h-2025-a-new-chapter-for-ens-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-h-2025-a-new-chapter-for-ens-3\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003e2025: A New Chapter for ENS\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eENS Labs closed 2024 with a sprint to host \\u003ca href=\\\&quot;https://frensday.ens.domains/\\\&quot;\\u003efrENSday\\u003c/a\\u003e, where we officially announced \\u003ca href=\\\&quot;https://app.ens.domains/ens-v2\\\&quot;\\u003eNamechain\\u003c/a\\u003e and laid out the vision for ENSv2 at large. We met so many ENS community members, integrators and champions, which was an incredibly energizing and inspiring way to close out the year.\\u003c/p\\u003e\\n\\u003cp\\u003e2025 will be the year of growth and new direction for ENS, a new chapter with a renewed focus on user experience and technological innovation.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-leadership-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-leadership-4\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eLeadership\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eENSv2 is an extension of what the team has been building towards for the past 8 years. As with any new chapter, change is inevitable as a company scales. To that end, we have two exciting updates on the Leadership team:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eNick Johnson\\u003c/strong\\u003e, founder and lead developer of the ENS Protocol, will step into the position of CEO of ENS Labs. Nick is the original founder of ENS Labs and the inventor of the ENS Protocol. After 8 years, he remains dedicated to the growth of ENS and true to the core values of decentralization and permissionless innovation. In this role, Nick will continue to lead the Protocol Engineering team as well as set strategic vision and direction for ENS Labs for years to come.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eJeff Lau\\u003c/strong\\u003e, one of ENS Labs’ first employees and long-time protocol engineer will step up as CTO. Jeff has spent the past 8 years at ENS Labs on the Engineering side; initially as a front-end engineer before moving over to protocol development. In this new seat, Jeff will oversee Engineering and Product — leading these teams as we scale, driving technical execution of ENSv2, and ensuring the protocol continues upholding the highest standards of security, performance, and decentralization.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eBoth of these role changes will level up ENS Labs massively as we head into an incredibly important development year for the ENS Protocol and Namechain.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-team-5\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-team-5\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eTeam\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eAs we closed Q1, we added 12 headcount (full time employees \\u0026amp; contractors) to the team, bringing our current headcount to 28. Our new hires span across 8 team members on Engineering and Product, with 4 on our Growth and Operations teams.\\u003c/p\\u003e\\n\\u003cp\\u003eWe’re thrilled to announce the establishment of the Growth team, which includes Partnerships, Marketing, and Ecosystem. This function will enable strategic scale by focusing on integrations and partnerships that will surface all of the powerful capabilities of ENS to users and developers– ultimately helping to drive adoption, expand utility, and cement ENS as foundational infrastructure for the Ethereum ecosystem and beyond.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you are excited about ENS and the work that we are doing here at Labs, please consider \\u003ca href=\\\&quot;https://www.enslabs.org/jobs\\\&quot;\\u003ejoining us\\u003c/a\\u003e!\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-56991-growth-ecosystem-community-6\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-growth-ecosystem-community-6\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eGrowth, Ecosystem \\u0026amp; Community\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ1 of 2025 was a period of strategic calibration and expansion for the Growth team. ENS Labs organized the Ethereum Cambridge Workshop (more on this under Protocol updates), collaborated with leading projects at ETH Denver, and formed potential integration relationships with registries and registrars at ICANN 82.\\u003c/p\\u003e\\n\\u003cp\\u003eWith our new Head of Growth, the Growth team revamped its marketing processes to keep educational and partnership content engaging, useful for users, and to ensure that ENS is part of the important Ethereum ecosystem narratives in 2025 ahead of Namechain launch.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-growth-indicators-7\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-growth-indicators-7\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eGrowth Indicators\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eThe first quarter of 2025 demonstrated positive growth across our key metrics. Both .eth registrations and renewals on mainnet Ethereum increased compared to Q4 2024, while subname growth continued to play a major role in establishing ENS names as the standard naming protocol.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/e/e421185038eaea1c467c644f8986a98d6f032de8.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/e421185038eaea1c467c644f8986a98d6f032de8\\\&quot; title=\\\&quot;registrations-quarter\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e421185038eaea1c467c644f8986a98d6f032de8_2_690x426.png\\\&quot; alt=\\\&quot;registrations-quarter\\\&quot; data-base62-sha1=\\\&quot;wy7LFIxqn1C7q6ohhvfJus4MGVO\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;426\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e421185038eaea1c467c644f8986a98d6f032de8_2_690x426.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e421185038eaea1c467c644f8986a98d6f032de8_2_1035x639.png 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/e/e421185038eaea1c467c644f8986a98d6f032de8.png 2x\\\&quot; data-dominant-color=\\\&quot;E8F0EC\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eregistrations-quarter\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1200×742 44.8 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e(Source: \\u003ca href=\\\&quot;https://dune.com/ethereumnameservice/ens\\\&quot;\\u003ehttps://dune.com/ethereumnameservice/ens\\u003c/a\\u003e)\\u003c/p\\u003e\\n\\u003cp\\u003eSubnames have also continued to be a huge driver in the proliferation of ENS names across the industry. As we work to further standardize subname systems in the ENS protocol and L2 primary names (more on this next quarter), we hope to bring more names onchain across different L2 ecosystems.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/6/686eb43b69e3581a1dc27b7a3f9663fd64fe3711.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/686eb43b69e3581a1dc27b7a3f9663fd64fe3711\\\&quot; title=\\\&quot;registrations\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/686eb43b69e3581a1dc27b7a3f9663fd64fe3711_2_690x426.png\\\&quot; alt=\\\&quot;registrations\\\&quot; data-base62-sha1=\\\&quot;eTQQ1XJUT4Gizi6I6L2z0ydhWrn\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;426\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/686eb43b69e3581a1dc27b7a3f9663fd64fe3711_2_690x426.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/686eb43b69e3581a1dc27b7a3f9663fd64fe3711_2_1035x639.png 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/6/686eb43b69e3581a1dc27b7a3f9663fd64fe3711.png 2x\\\&quot; data-dominant-color=\\\&quot;EDE7F0\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eregistrations\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1200×742 41.6 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-eth-denver-2025-8\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-eth-denver-2025-8\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eETH Denver 2025\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eThe entire Growth and DevRel teams were present at ETH Denver to answer questions about Namechain, ENS subnames, how multichain ENS works, and discuss other ENS use cases. We met with dozens of companies interested in issuing their own subnames or integrating ENS and are working to refine those partnerships– hopefully these will be announced throughout the course of this year. At EthDenver, we also provided ENS branded swag for .eth owners, special swag for active users that set profile records, and ENS-branded Burner wallets with brnr.eth subnames using Namestone.\\u003c/p\\u003e\\n\\u003cp\\u003eOn Feb 28th at Beacon RiNO, ENS co-hosted “Linea After Dark”, in collaboration with Consensys, Trusta Labs, and the ENS DAO Ecosystem WG. 500+ attendees picked up special Linea.eth subname shirts, live-painted by local graffiti artists. We also collaborated with POAP on a scavenger hunt.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/a/a296ae7ab9c52d6e4691449890a1b7422b9e2959.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/a296ae7ab9c52d6e4691449890a1b7422b9e2959\\\&quot; title=\\\&quot;denver-1\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a296ae7ab9c52d6e4691449890a1b7422b9e2959_2_690x453.jpeg\\\&quot; alt=\\\&quot;denver-1\\\&quot; data-base62-sha1=\\\&quot;nckbpamhF1q0EcLmwB8aTjH2wwp\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;453\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a296ae7ab9c52d6e4691449890a1b7422b9e2959_2_690x453.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a296ae7ab9c52d6e4691449890a1b7422b9e2959_2_1035x679.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a296ae7ab9c52d6e4691449890a1b7422b9e2959_2_1380x906.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;696C71\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003edenver-1\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×1262 233 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/f/f881ac337e76180ee83f0b3df199e8348116e9fe.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/f881ac337e76180ee83f0b3df199e8348116e9fe\\\&quot; title=\\\&quot;denver-2\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f881ac337e76180ee83f0b3df199e8348116e9fe_2_689x292.jpeg\\\&quot; alt=\\\&quot;denver-2\\\&quot; data-base62-sha1=\\\&quot;zsoezAJB5tOYRBcewnHuGnfH5jo\\\&quot; width=\\\&quot;689\\\&quot; height=\\\&quot;292\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f881ac337e76180ee83f0b3df199e8348116e9fe_2_689x292.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f881ac337e76180ee83f0b3df199e8348116e9fe_2_1033x438.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f881ac337e76180ee83f0b3df199e8348116e9fe_2_1378x584.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;765B6B\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003edenver-2\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e2748×1164 380 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-icann-82-seattle-9\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-icann-82-seattle-9\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eICANN 82 - Seattle\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eIn 2026, ICANN will be accepting new gTLD applications. We are actively working to facilitate DNS + ENS integrations with registries and companies applying for new gTLDs.\\u003c/p\\u003e\\n\\u003cp\\u003eTo kickstart this, ENS Labs participated at ICANN 82 in Seattle earlier in March. While in attendance, we met with registries, registrars, IP law firms, tech companies, national country-code representatives, GAC country representatives, and ICANN board members - with the goal to proliferate both ENS and Ethereum goals. With more ICANN conventions on the horizon for the remainder of 2025 and into 2026, we plan to continuously stay engaged and deepen our partnerships with potential DNS integration partners.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/b/b675c67a4b594720acba4763153734143f04e602.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/b675c67a4b594720acba4763153734143f04e602\\\&quot; title=\\\&quot;icann\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/b/b675c67a4b594720acba4763153734143f04e602_2_666x500.jpeg\\\&quot; alt=\\\&quot;icann\\\&quot; data-base62-sha1=\\\&quot;q27enZ1HNqI8KX8JbOGrM7j2sZc\\\&quot; width=\\\&quot;666\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/b/b675c67a4b594720acba4763153734143f04e602_2_666x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/b/b675c67a4b594720acba4763153734143f04e602_2_999x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/b/b675c67a4b594720acba4763153734143f04e602_2_1332x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;353C4D\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eicann\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1600×1200 211 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-community-social-10\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-community-social-10\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eCommunity \\u0026amp; Social\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eOur growth strategy was focused on increased community engagement and measured through social media presence.\\u003c/p\\u003e\\n\\u003ch4\\u003e\\u003ca name=\\\&quot;p-56991-social-11\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-social-11\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eSocial\\u003c/strong\\u003e\\u003c/h4\\u003e\\n\\u003cp\\u003eX (\\u003cspan class=\\\&quot;mention\\\&quot;\\u003e@ensdomains\\u003c/span\\u003e) grew \\u003cstrong\\u003e12.1%\\u003c/strong\\u003e in the last 3 months. The biggest drivers of growth are \\u003cstrong\\u003elikes (+64%)\\u003c/strong\\u003e and \\u003cstrong\\u003eprofile visits (+46%)\\u003c/strong\\u003e, which indicate higher engagement and visibility. LinkedIn profile visits increased by \\u003cstrong\\u003e9.2%\\u003c/strong\\u003e and followers increased by \\u003cstrong\\u003e11%\\u003c/strong\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eThis quarter we’ve superpowered the ENS Blog, spanning across topics like NameChain design decisions to highlighting integrations and product releases. Check it out!\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/namechain-workshop\\\&quot;\\u003eNamechain Workshop in Cambridge\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/breaking-down-ens\\\&quot;\\u003eBreaking Down ENS (With Less Crypto Jargon)\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/private-transactions-with-fluidkey\\\&quot;\\u003ePrivate ENS Transactions With Fluidkey\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/para\\\&quot;\\u003eENS x Para: Making Web3 Identity Effortless\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/multi-delegate-manager\\\&quot;\\u003eIntroducing Multi-Delegate Manager\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eWe’re developing a new social media strategy focused on informational ENS content and co-marketing with partners. Recent examples include collaborations with \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1903107410304417919\\\&quot;\\u003ePayPal\\u003c/a\\u003e and content highlighting the \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1901642495949484257\\\&quot;\\u003emanager app’s renewal date feature\\u003c/a\\u003e. In addition to expanding our fintech integrations and subname ecosystem partnerships, we’re aiming to integrate ENS into more traditional web2 companies which will prove to be an important source of onboarding both into ENS and into web3 at large for new users.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-press-12\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-press-12\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003ePress\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eENS was featured in 19 pieces of earned coverage with an estimated 2.15M views. Highlights include:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eNick Johnson’s commentary on the Pectra upgrade in \\u003ca href=\\\&quot;https://www.fxstreet.com/cryptocurrencies/news/ethereum-price-forecast-eth-sees-a-downtick-despite-successful-pectra-launch-on-hoodi-testnet-202503262305\\\&quot;\\u003eFXStreet\\u003c/a\\u003e,\\u003c/li\\u003e\\n\\u003cli\\u003eAlex Urbelis’ investigation of .gov updates in \\u003ca href=\\\&quot;https://www.reuters.com/world/us/white-house-registers-deigov-wastegov-amid-federal-workforce-purge-2025-02-05/\\\&quot;\\u003eReuters\\u003c/a\\u003e, and\\u003c/li\\u003e\\n\\u003cli\\u003eJames Beck’s discussion of ENS’ integration of Para in \\u003ca href=\\\&quot;https://thedefiant.io/news/nfts-and-web3/ethereum-name-service-teams-up-with-para-wallet-to-simplify-registration\\\&quot;\\u003eThe Defiant\\u003c/a\\u003e.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eIn Q2, we look forward to publishing even more educational content across wallets, apps, and other ENS integrators, partnership and product updates. We’d love to hear from the community any additional useful topics.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-legal-operations-13\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-legal-operations-13\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eLegal \\u0026amp; Operations\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eOn the operational side, the legal team at ENS Labs has been continuously working closely with the DAO in order to assist on important DAO matters: compliance and legal requirements to issue and grants (including the service provider program and the Public Goods WG grants), and working on updating the bylaws for the ENS Foundation. As Labs continues to incur and pay costs associated with DAO-related legal work out of pocket, there is a possibility that Labs would seek reimbursement from the DAO. We remain prudent on costs associated with out of scope legal work, and will monitor spend as it relates to legal and policy work that is done on behalf of the DAO and the broader ENS ecosystem.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-56991-product-engineering-updates-14\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-product-engineering-updates-14\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eProduct \\u0026amp; Engineering Updates\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eIn Q1, across product and front-end - We’ve shipped new \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1889708367356239953\\\&quot;\\u003eSpanish translations\\u003c/a\\u003e, manager app \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1890058102357234175\\\&quot;\\u003edark mode\\u003c/a\\u003e, design improvements to the ens.domains website and animations, a new docs site with improved processes \\u003cem\\u003e(\\u003ca href=\\\&quot;https://github.com/ensdomains/docs/pull/405\\\&quot;\\u003ePR\\u003c/a\\u003e),\\u003c/em\\u003e and a brand new \\u003ca href=\\\&quot;http://enslabs.org\\\&quot;\\u003eENS Labs homepage\\u003c/a\\u003e! As mentioned earlier, we also redesigned and shipped a new \\u003ca href=\\\&quot;https://ens.domains/blog\\\&quot;\\u003eBlog\\u003c/a\\u003e page where we have been posting a lot of exciting updates.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/2/261c2c9517f67c3911a7b3d6e7dbbaa2e77bc55c.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/261c2c9517f67c3911a7b3d6e7dbbaa2e77bc55c\\\&quot; title=\\\&quot;dark-mode\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/261c2c9517f67c3911a7b3d6e7dbbaa2e77bc55c_2_690x387.png\\\&quot; alt=\\\&quot;dark-mode\\\&quot; data-base62-sha1=\\\&quot;5r8vpOnqF9mk4n5cB0jdW4JaooI\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;387\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/261c2c9517f67c3911a7b3d6e7dbbaa2e77bc55c_2_690x387.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/261c2c9517f67c3911a7b3d6e7dbbaa2e77bc55c_2_1035x580.png 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/2/261c2c9517f67c3911a7b3d6e7dbbaa2e77bc55c.png 2x\\\&quot; data-dominant-color=\\\&quot;232832\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003edark-mode\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1173×659 77 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAdditionally, our open-source design system and component library, \\u003ca href=\\\&quot;https://thorin.ens.domains/\\\&quot;\\u003eThorin\\u003c/a\\u003e, now has a stable release. Alongside cleaning up and clarifying the API, we’ve moved over to using vanilla-extract, making it smaller and easier to slot into any application.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the integration side, we recently \\u003ca href=\\\&quot;https://ens.domains/blog/post/para\\\&quot;\\u003eannounced\\u003c/a\\u003e a partnership with \\u003ca href=\\\&quot;https://www.getpara.com/\\\&quot;\\u003ePara\\u003c/a\\u003e, a wallet and authentication suite designed to make interacting with web3 applications simple and secure. Para’s embedded wallet technology utilizes distributed multi-party computation (MPC) and passkey protocols, enabling users to authenticate into applications using only their email address, phone number, or social media account. The universality of Para’s embedded wallets makes them an ideal partner in our mission to make ENS names available to anyone, regardless of their familiarity with crypto wallets or where they want to use their ENS name. Any apps that support Para will automatically resolve wallet addresses to an ENS name– and for users who do not use browser extension based wallet, \\u003ca href=\\\&quot;https://blog.getpara.com/supporting-ens/\\\&quot;\\u003ePara\\u003c/a\\u003e provides a seamless way to sign in and manage your ENS identity.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also released the \\u003ca href=\\\&quot;https://ens.domains/blog/post/multi-delegate-manager\\\&quot;\\u003eMulti-Delegate Manager\\u003c/a\\u003e, a smart contract for ENS token holders to delegate their voting power across multiple delegates with as little friction as possible. The MDM is built on Ethereum and leverages proxy contracts to hold and delegate voting power on behalf of the token holder. We believe the MDM to be the next unlock in democratizing DAO governance. With more flexibility in delegation, more voices and perspectives can participate in governance. If you have ENS tokens and want to delegate to more ENS holders, or reallocate voting power, please consider doing so at \\u003ca href=\\\&quot;http://delegate.ens.domains.\\\&quot;\\u003edelegate.ens.domains\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/0/0f7ecbe4d083d18b67b37fc165b046d2621503ec.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/0f7ecbe4d083d18b67b37fc165b046d2621503ec\\\&quot; title=\\\&quot;multi-delegate\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0f7ecbe4d083d18b67b37fc165b046d2621503ec_2_690x496.jpeg\\\&quot; alt=\\\&quot;multi-delegate\\\&quot; data-base62-sha1=\\\&quot;2d4OYBZVKbiZy5ZpUPAk39h3pJa\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;496\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0f7ecbe4d083d18b67b37fc165b046d2621503ec_2_690x496.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0f7ecbe4d083d18b67b37fc165b046d2621503ec_2_1035x744.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0f7ecbe4d083d18b67b37fc165b046d2621503ec_2_1380x992.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;E0E3E4\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003emulti-delegate\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1600×1152 452 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eLast but not least, the Product team has been heads down doing intense UX research as we start to think about what the next era of the front-end Manager app may look like in the Namechain Era (\\u003cimg src=\\\&quot;https://discuss.ens.domains/images/emoji/twitter/eyes.png?v=15\\\&quot; title=\\\&quot;:eyes:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:eyes:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e). We hope to share more insights on this in the Q2 update.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-56991-protocol-namechain-updates-15\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-protocol-namechain-updates-15\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eProtocol + Namechain Updates\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ1 started off with a 3-day workshop in Cambridge alongside leading researchers and developers from \\u003ca href=\\\&quot;https://x.com/LineaBuild\\\&quot;\\u003eLinea\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://status.app/\\\&quot;\\u003eStatus\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://x.com/OpenZeppelin\\\&quot;\\u003eOpenZeppelin\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://www.titanbuilder.xyz/\\\&quot;\\u003eTitan\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://x.com/Spire_Labs\\\&quot;\\u003eSpire Labs\\u003c/a\\u003e and the \\u003ca href=\\\&quot;https://x.com/ethereumfndn\\\&quot;\\u003eEthereum Foundation\\u003c/a\\u003e. This workshop was primarily about how to create scalable, decentralized infrastructure for \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1869020166794993702\\\&quot;\\u003eNamechain\\u003c/a\\u003e. At this 3 day offsite, ENS Labs decided that Namechain will aim to launch as a based rollup (scaling Ethereum by processing transactions off-chain while using Ethereum as the sequencer for secure validation).\\u003c/p\\u003e\\n\\u003cp\\u003eAs we will be working with Linea to launch Namechain, the Linea team is currently assessing the necessary features and timescale to implement based-rollups, and have posted the initial protocol design \\u003ca href=\\\&quot;https://community.linea.build/t/linea-as-a-based-rollup-a-theoretical-architecture/9882\\\&quot;\\u003ehere\\u003c/a\\u003e. This will be a critical step in validating the scalability and cost-efficiency of a based-rollup. We are also actively following the development and viability of Native-rollups– though the exact viability and timeline of Native roll-ups will ultimately depend on Ethereum Network upgrades.\\u003c/p\\u003e\\n\\u003cp\\u003eGathering the research work we did in Q1 and looking ahead, here is a non-exhaustive feature list that ENS x Linea are working on for Namechain:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eMultiprover\\u003c/strong\\u003e: Support for multiple independent provers, which will reduce the chances of a bug causing catastrophic consequences.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eInvalidity Proo\\u003c/strong\\u003ef: With permissionless sequencing, a sequencer can propose an invalid block– so the ability to prove invalidity becomes critical.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eShared Blobs Support\\u003c/strong\\u003e: Sharing blobs requires modifications to the smart contract and prover, necessitating audits. Implementation may begin without this feature.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eReorganization Support\\u003c/strong\\u003e: Based rollups must support reorganization in the instance that a L1 reorganizes.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eRealtime State Reconstruction\\u003c/strong\\u003e: Real-time state reconstruction without proof dependency requires transaction signatures in the DA. This system must manage reorganizations and verify block validity.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eLimitless Prover\\u003c/strong\\u003e: This feature simplifies sequencing and invalidity proofs for based rollups while enhancing user experience generally. Implementation is underway with completion expected in April.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eCoordinator/Prover Decentralization\\u003c/strong\\u003e: Sequencer decentralization requires coordinator and prover decentralization as well.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eResearch: UX Impact\\u003c/strong\\u003e: Vanilla based rollups affect user experience, particularly regarding inclusion time, which will exceed L1 block time. This warrants further investigation.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eL1 State Anchoring\\u003c/strong\\u003e: A trustless message passing solution from L1 to L2 requires anchoring the L1 state trustlessly. Research is needed to determine the optimal approach based on delay requirements.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eIntegration with L1 Sequencer\\u003c/strong\\u003e: L1 sequencers supporting the chain must implement infrastructure for tracking, building, and posting blocks. The solution should facilitate component updates, especially when prover incompatibilities arise.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eType 1 Rollups\\u003c/strong\\u003e: Type 1 rollup implementation simplifies interoperability by eliminating need for L2-specific state proof mechanisms. Supporting existing state representation (Patricia Merkle Trees) avoids debates about future L1 state representation while increasing prover costs but simplifying other aspects.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eENS Labs is excited to also join and contribute to \\u003ca href=\\\&quot;https://ethresear.ch/t/fabric-fabric-to-accelerate-based-rollup-infrastructure-connectivity/21640\\\&quot;\\u003eFABRIC\\u003c/a\\u003e, an initiative focused on standardizing rollup interoperability across different Layer 2s. This collaboration will play a key role in ensuring seamless scaling and integration for Namechain.\\u003c/p\\u003e\\n\\u003cp\\u003eAs a sneak peak for Q2: We are very close to finalizing the \\u003ca href=\\\&quot;https://docs.ens.domains/web/reverse/#l2-primary-names\\\&quot;\\u003eL2 primary name\\u003c/a\\u003e launch! Currently, ENS Primary names are only officially supported on Ethereum Mainnet. With this launch, primary names will be supported on multiple L2s, which would make it possible for developers and users to have an end-to-end experience with ENS on L2 networks. Stay tuned for the launch on this soon!.\\u003c/p\\u003e\\n\\u003cp\\u003eLast but not least, please find below a non-exhaustive list of achievements and code deliverables from the Protocol team in Q1:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eInfrastructure \\u0026amp; Tooling\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eImproved how we deploy ENS on public test networks for better consistency and credential safety.\\u003c/li\\u003e\\n\\u003cli\\u003eImproved code coverage, linting, etc, in our repositories.\\u003c/li\\u003e\\n\\u003cli\\u003eBetter standardization of contract naming and structure.\\u003c/li\\u003e\\n\\u003cli\\u003eStarted using unruggable-gateways in place of the original ENS gateway implementation.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eCore Registry \\u0026amp; Resolver Development\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eCompleted the implementation of numerous ENSv2 core smart contracts, as well as functional improvements to existing ones to match the ENSv2 roadmap requirements.\\u003c/li\\u003e\\n\\u003cli\\u003eBuilt a library that acts as a factory for verifiable proxy contracts. This means that copies of a common contract such as an ENS resolver can be cheaply deployed for each user on Namechain, while providing upgradeability and the ability to trustlessly verify the current implementation a proxy is using via CCIP-Read.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-56991-financial-reporting-16\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-financial-reporting-16\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eFinancial Reporting\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/978563982a6734abf488545dba74834c3d8ecf2f.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/978563982a6734abf488545dba74834c3d8ecf2f\\\&quot; title=\\\&quot;income-statement\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/978563982a6734abf488545dba74834c3d8ecf2f_2_690x336.png\\\&quot; alt=\\\&quot;income-statement\\\&quot; data-base62-sha1=\\\&quot;lCpSJfurm4gEsQOWybGwj34nXyv\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;336\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/978563982a6734abf488545dba74834c3d8ecf2f_2_690x336.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/978563982a6734abf488545dba74834c3d8ecf2f_2_1035x504.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/978563982a6734abf488545dba74834c3d8ecf2f_2_1380x672.png 2x\\\&quot; data-dominant-color=\\\&quot;F1F1F1\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eincome-statement\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1600×781 171 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-income-17\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-income-17\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIncome\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eAs of Q1 close, we have received $2,391,780.82 USDC from the ENS DAO.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-56991-expenses-18\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-expenses-18\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eExpenses\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eOur total expenses for Q1 2025 totalled $1,295,447.75. The top three expense categories were:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eEmployee Compensation \\u0026amp; Benefits\\u003c/strong\\u003e (66.5%) which reflects our exciting +75% (+12) growth in headcount (full-time + contractors) in Q1.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eProfessional Services\\u003c/strong\\u003e (12.5%) includes our third-party providers supporting our Accounting, Legal \\u0026amp; Compliance, and Recruiting \\u0026amp; Hiring services.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eAdvertising \\u0026amp; Marketing\\u003c/strong\\u003e (5.6%) covering our PR services and media relations.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/7/779a704562d5b57e9d79e44bb3e0888ad75c59c0.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/779a704562d5b57e9d79e44bb3e0888ad75c59c0\\\&quot; title=\\\&quot;q1-expenses\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/779a704562d5b57e9d79e44bb3e0888ad75c59c0_2_690x471.png\\\&quot; alt=\\\&quot;q1-expenses\\\&quot; data-base62-sha1=\\\&quot;h43HwKPntdgVWrJp4ZAF3aX2bVC\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;471\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/779a704562d5b57e9d79e44bb3e0888ad75c59c0_2_690x471.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/779a704562d5b57e9d79e44bb3e0888ad75c59c0_2_1035x706.png 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/7/779a704562d5b57e9d79e44bb3e0888ad75c59c0.png 2x\\\&quot; data-dominant-color=\\\&quot;C0CCD1\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eq1-expenses\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1360×930 58 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-56991-closing-19\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-56991-closing-19\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eClosing\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ1 2025 has set a strong foundation for ENS Labs with significant achievements across all fronts: recruiting top tier talent, technical progress on Namechain development, and successful community engagement at ETH Denver and ICANN 82. Our financial management remains robust, with clear allocation of resources prioritizing talent and development as we build toward ENSv2, alongside strengthening L2 integrations.\\u003c/p\\u003e\\n\\u003cp\\u003eThis quarterly transparency report marks the beginning of more structured communication with our community. As we move into Q2 with momentum, we hope to continue delivering on our mission driven and high quality work. We deeply appreciate your ongoing support and trust as we work towards ENSv2.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:8,\&quot;updated_at\&quot;:\&quot;2025-04-11T02:09:41.950Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link
