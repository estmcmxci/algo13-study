2e725d4\\\&quot; title=\\\&quot;14_Agentic Finance Summit 2026\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5cdafc9b43341facd37b05606b40a83fb2e725d4_2_690x384.jpeg\\\&quot; alt=\\\&quot;14_Agentic Finance Summit 2026\\\&quot; data-base62-sha1=\\\&quot;dfr6sBLVQL7CqYLKHtqhAZeGAbG\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;384\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5cdafc9b43341facd37b05606b40a83fb2e725d4_2_690x384.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5cdafc9b43341facd37b05606b40a83fb2e725d4_2_1035x576.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5cdafc9b43341facd37b05606b40a83fb2e725d4_2_1380x768.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;73776F\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e14_Agentic Finance Summit 2026\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1450×808 194 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe main coordination challenge was making sure launch readiness did not move ahead of security and audit work. Rather than letting the campaign calendar drive the protocol, the team used Q2 to keep partner readiness, co-marketing plans, creative assets, and launch-day content moving in parallel, ready to launch when the new protocol lands on Mainnet.\\u003c/p\\u003e\\n\\u003cp\\u003eWhile v2 readiness was the primary objective for the Growth team, there were a few additional wins with organizations and sectors beginning to move onchain in meaningful ways. We partnered with DOMA on a primary name campaign which brought in 300+ newly set ENS primary names. Additionally, users can now use DOMA to set their tokenized DNS as their ENS name.  Türkiye’s Directorate of Communication registered `cbiletisim.eth`, \\u003ca href=\\\&quot;https://www.iletisim.gov.tr/english/duyurular/detay/press-release-digital-transformation-breakthrough-building-the-future-of-our-communication-ecosystem-via-ai-and-blockchain-technologies\\\&quot;\\u003emaking its first step\\u003c/a\\u003e in establishing an official onchain identity by choosing ENS. Read more \\u003ca\\u003ehere\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/a/ad316f8ee2b4a6ae93c2a492b7023ac198075a18.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/ad316f8ee2b4a6ae93c2a492b7023ac198075a18\\\&quot; title=\\\&quot;15_Turkiye Directorate of Communications\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ad316f8ee2b4a6ae93c2a492b7023ac198075a18_2_639x499.jpeg\\\&quot; alt=\\\&quot;15_Turkiye Directorate of Communications\\\&quot; data-base62-sha1=\\\&quot;oI8w7mDn9ZjE7iBr4H2KCQBqygM\\\&quot; width=\\\&quot;639\\\&quot; height=\\\&quot;499\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ad316f8ee2b4a6ae93c2a492b7023ac198075a18_2_639x499.jpeg, https://discuss.ens.domains/uploads/db9688/original/2X/a/ad316f8ee2b4a6ae93c2a492b7023ac198075a18.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/a/ad316f8ee2b4a6ae93c2a492b7023ac198075a18.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;204634\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e15_Turkiye Directorate of Communications\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e709×554 91 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-stewardship-required-for-launch-8\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-stewardship-required-for-launch-8\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eStewardship Required for Launch\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eAs ENS becomes more widely used, the work around the protocol expands. Code and product remain central, but ENS also depends on the surrounding layers that make infrastructure durable: legal structure, security posture, IP protection, governance support, and external partner standards.\\u003c/p\\u003e\\n\\u003cp\\u003eThis quarter, we focused on establishing that infrastructure for ENSv2 across IP, patent, cybersecurity, and commercial efforts. We filed the ENSv2 patent application in the US through USPTO Track One expedited examination, advanced protection for ENS (USSN 99179803), ENS Design / logo (USSN 99179808), and FRENSDAY (USSN 99186369).  As mentioned in the \\u003ca href=\\\&quot;https://discuss.ens.domains/t/temp-check-next-era-of-ens-dao-empowering-the-ens-foundation/22175\\\&quot;\\u003eENS Foundation Temp Check v2\\u003c/a\\u003e, the ENS Foundation is planned to \\u003ca href=\\\&quot;https://discuss.ens.domains/t/temp-check-next-era-of-ens-dao-empowering-the-ens-foundation/22175#:~:text=Foundation%20holding%20the%20trademarks\\\&quot;\\u003emanage the trademark ownership\\u003c/a\\u003e and enforcement, as well as the patents and “intangible assets” (e.g. brand, legal).\\u003c/p\\u003e\\n\\u003cp\\u003eSecurity and compliance work also continued to scale with ENS’s footprint. We strengthened access control, incident response, and threat-intelligence work through partnerships with \\u003ca href=\\\&quot;https://quad9.net/\\\&quot;\\u003eQuad9\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://www.cleandns.com/\\\&quot;\\u003eCleanerDNS\\u003c/a\\u003e\\u003cstrong\\u003e,\\u003c/strong\\u003e supported the \\u003ca href=\\\&quot;https://www.theblock.co/post/398005/easydns-accepts-responsibility-for-eth-limo-hijack-its-first-social-engineering-breach-in-28-years\\\&quot;\\u003eeth.limo incident response\\u003c/a\\u003e and abuse-desk operations, drove Immunefi bug bounty revisions, and filed a police report with the Korean National Police Agency concerning malicious activity directed toward ENS. More adoption brings more attention, and more attention means the operational security surface has to keep maturing.\\u003c/p\\u003e\\n\\u003cp\\u003eAs part of our commitment to ENS’ role in the DNS Security space, we represented at the \\u003ca href=\\\&quot;https://www.icann.org/en/contracted-parties/summit\\\&quot;\\u003e2026 ICANN Contracted Parties Summit\\u003c/a\\u003e in Manchester, \\u003ca href=\\\&quot;https://indico.dns-oarc.net/event/56/\\\&quot;\\u003eDNS OARC 46\\u003c/a\\u003e in Edinburgh, and the \\u003ca href=\\\&quot;https://gac.icann.org/agendas/icann86-seville-agenda\\\&quot;\\u003eICANN86 Policy Forum\\u003c/a\\u003e in Seville.\\u003c/p\\u003e\\n\\u003cp\\u003eOur work has strengthened relationships with registries, WIPO, and the contracted-party community, advanced our .ens gTLD preparation, and increased ENS visibility in technical, policy, and media discussions around naming systems, digital identity, and AI. Check out more in Slobo’s \\u003ca href=\\\&quot;https://icann.justslobo.com/\\\&quot;\\u003eICANN86 Seville key takeaways\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/a/a098710b361038716f025cc3abf5eaa41aacb562.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/a098710b361038716f025cc3abf5eaa41aacb562\\\&quot; title=\\\&quot;16_ICANN86 Seville 2026\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a098710b361038716f025cc3abf5eaa41aacb562_2_690x443.jpeg\\\&quot; alt=\\\&quot;16_ICANN86 Seville 2026\\\&quot; data-base62-sha1=\\\&quot;mUGZZp3eoVyNoJh1arF5TqIPwvU\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;443\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a098710b361038716f025cc3abf5eaa41aacb562_2_690x443.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a098710b361038716f025cc3abf5eaa41aacb562_2_1035x664.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/a098710b361038716f025cc3abf5eaa41aacb562_2_1380x886.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;B0B5BB\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e16_ICANN86 Seville 2026\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1384×890 243 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/26c62b499a584adcb01bd4d84b4d5b44a6f800df\\\&quot; title=\\\&quot;17_ICANN86 Seville 2026\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_690x420.jpeg\\\&quot; alt=\\\&quot;17_ICANN86 Seville 2026\\\&quot; data-base62-sha1=\\\&quot;5x0IAB4sark4Ja7HzRpgt2P7UVV\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;420\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_690x420.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_1035x630.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_1380x840.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;636E84\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e17_ICANN86 Seville 2026\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1394×850 307 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAnother Q2 significant outcome was \\u003ca href=\\\&quot;https://x.com/ensdomains/status/2065438475349041463\\\&quot;\\u003eNick’s appointment\\u003c/a\\u003e to ICANN’s new seven-member \\u003ca href=\\\&quot;https://www.icann.org/en/blogs/details/gtld-integrations-with-alternative-naming-systems-technical-study-group-underway-09-06-2026-en\\\&quot;\\u003eTechnical Study Group\\u003c/a\\u003e on gTLD integrations with alternative naming systems. A lot of projects talk about replacing old infrastructure, but the harder and more useful work is making new infrastructure compatible with the systems that already serve billions of people. ENS having a seat in these TLD and DNS spaces is how the ENS protocol becomes the established internet infrastructure for years to come.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-financial-reporting-9\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-financial-reporting-9\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eFinancial Reporting\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-62104-income-10\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-income-10\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIncome\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003ePreviously in the \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/7#p-61101-financial-reporting-25\\\&quot;\\u003eQ1 report financials\\u003c/a\\u003e, Grant Income was reported as $771,258.86, which has been corrected to $1,904,234.28 based on the accrual accounting method.\\u003c/p\\u003e\\n\\u003cp\\u003eAs of Q2 close on June 30, 2026, we have received $4,296,112.25 USDC (44.3% of the FY stream) from the ENS DAO.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-62104-expenses-11\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-expenses-11\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u0 ot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eTop Q2 Expenses:\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eEmployee Compensation \\u0026amp; Benefits\\u003c/strong\\u003e (70.1%) for payroll, benefits, and employer contributions for a team of 39.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eProfessional Services\\u003c/strong\\u003e (18.3%) included expenses for ENSv2 frontend and smart contract external auditing, legal expenses for the ENSv2 patent and .ens TLD being finalized this year.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eAdvertising \\u0026amp; Marketing\\u003c/strong\\u003e (3.6%) focused on go-to-market strategy for ENSv2 including IRL events, generative designs, and related marketing initiatives.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eTravel \\u0026amp; Expense\\u003c/strong\\u003e (2.3%) inclusive of Ethereum-focused conferences and hackathons, ICANN events, and travel related expenses for: ETHCC, ETHGlobal \\u0026amp; Pragma Cannes; ICANN Contracted Parties Summit; ETHPrague; DNS OARC 46 Scotland; ICANN86 Policy Forum Seville; and ETHGlobal \\u0026amp; ETHConf New York.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/f/fc55d1c1b42dfe788598a37962f1f63bd4e17e0a.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/fc55d1c1b42dfe788598a37962f1f63bd4e17e0a\\\&quot; title=\\\&quot;19_Q2 2026 Expenses\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/fc55d1c1b42dfe788598a37962f1f63bd4e17e0a_2_690x433.jpeg\\\&quot; alt=\\\&quot;19_Q2 2026 Expenses\\\&quot; data-base62-sha1=\\\&quot;A0gbL9Zr3V5BCJeOr9fg7HkXBzQ\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;433\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/fc55d1c1b42dfe788598a37962f1f63bd4e17e0a_2_690x433.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/fc55d1c1b42dfe788598a37962f1f63bd4e17e0a_2_1035x649.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/fc55d1c1b42dfe788598a37962f1f63bd4e17e0a_2_1380x866.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;D1D4D8\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e19_Q2 2026 Expenses\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1414×888 88.8 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-next-ensv2-beta-and-mainnet-12\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-next-ensv2-beta-and-mainnet-12\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eNext: ENSv2 Beta and Mainnet\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eAs Q2 closes, ENS Labs remains focused on one priority: shipping ENSv2 Beta and Mainnet in 2026, guided by user safety and experience.\\u003c/p\\u003e\\n\\u003cp\\u003eENSv2 is not a conventional release. It touches the protocol, the App, the Explorer, migration tooling, developer libraries, partner integrations, GTM alignment, legal considerations, and the way millions of existing name holders experience the upgrade.\\u003c/p\\u003e\\n\\u003cp\\u003eQ2 required difficult but necessary decisions. We reworked HCA architecture when the risk model was not strong enough. We hardened migration flows so existing names are treated with the care they deserve during migration from V1 to V2. We chose explicit user consent where automatic upgrade paths introduced the wrong ownership assumptions. We accepted more complexity where it better protected users, and we cut or deprioritized work where deemed necessary.\\u003c/p\\u003e\\n\\u003cp\\u003eQ3 will involve completing the remaining security and audit work and reading v2 for final deployment. After v2 launches on mainnet Ethereum, the team is looking forward to a more experimental phase of product development around specific integrations and use cases.\\u003c/p\\u003e\\n\\u003cp\\u003eTo the ENS community: our commitment is straightforward. ENS Labs is fully committed to shipping ENSv2 in 2026, and to doing it in a way that preserves the guarantees that make ENS worth trusting. ENSv2 is the most substantial upgrade to ENS since the protocol began. It changes how names are structured, how ownership and permissions can work, how users migrate, how builders integrate, and how ENS can scale as the naming layer for the next generation of the internet.\\u003c/p\\u003e\\n\\u003cp\\u003eThe ENS user comes first. That has been the north star of every hard decision in Q2, and it will remain the standard for the work ahead. ENSv2 is not just the next ENS release. It is the next foundation for ENS.\\u003c/p\\u003e\\n\\u003cp\\u003eFinally, to be clear, the \\u003ca href=\\\&quot;https://discuss.ens.domains/t/temp-check-next-era-of-ens-dao-empowering-the-ens-foundation/22175\\\&quot;\\u003eexpansion of the ENS Foundation\\u003c/a\\u003e does not change the protocol-level guarantees that make ENS valuable. Your ENS name still resolves across major web3 wallets, you can still import your own DNS domain, your name remains unruggable and immutable under ENS ownership rules, and ENS remains permissionless infrastructure for anyone to build on.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:8,\&quot;updated_at\&quot;:\&quot;2026-07-18T01:57:00.650Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:7,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:17,\&quot;reads\&quot;:44,\&quot;readers_count\&quot;:43,\&quot;score\&quot;:378.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:20565,\&quot;topic_slug\&quot;:\&quot;ens-labs-quarterly-progress-reports\&quot;,\&quot;display_username\&quot;:\&quot;Katherine Wu\&quot;,\&quot;primary_group_name\&quot;:\&quot;delegates\&quot;,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://discuss.ens.domains/t/temp-check-next-era-of-ens-dao-empowering-the-ens-foundation/22175\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;[Temp Check] Next Era of ENS DAO: Empowering the ENS Foundation\&quot;,\&quot;clicks\&quot;:2},{\&quot;url\&quot;:\&quot;https://explorer.ens.dev/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;ENS Explorer App\&quot;,\&quot;clicks\&quot;:2},{\&quot;url\&quot;:\&quot;https://app.ens.dev/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;ENS App\&quot;,\&quot;clicks\&quot;:1},{\&quot;url\&quot;:\&quot;https://icann.justslobo.com/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;ICANN86 Seville: full transcript reference\&quot;,\&quot;clicks\&quot;:1},{\&quot;url\               <h1><a name="p-62104-ens-labs-quarterly-report-q2-2026-1" class="anchor" href="#p-62104-ens-labs-quarterly-report-q2-2026-1" aria-label="Heading link"></a><strong>ENS Labs Quarterly Report-</strong> Q2 2026</h1>
<h1><a name="p-62104-abstract-2" class="anchor" href="#p-62104-abstract-2" aria-label="Heading link"></a><strong>Abstract</strong></h1>
<p>Q2 was about getting ENSv2 ready for Beta and Mainnet. ENS started with a simple problem: addresses are unreadable. But eight years later, ENS isn’t just making Ethereum addresses legible, but also serving as a human-readable reference for 60+ blockchains, offchain naming systems, content, agents, and other types of records. The protocol itself needs to be both predictable for apps and users that have been around for the last half decade, yet still needs to evolve to how blockchains are being used today.</p>
<p>That’s harder than it sounds, because ENSv2 has to satisfy audiences that require different things. Existing name holders need the upgrade to be safe and predictable. On the other hand, potential new users unfamiliar with wallets need to acquire a .eth name easily. And finally, wallets, apps, and libraries already integrated with ENS need to better resolve the many types of ENS names that now exist. With all this in mind, there were two major decision points that affected how we thought about and designed for v2.</p>
<p>The first was Hidden Contract Accounts (HCA), the smart-account model meant to let people register, renew, and manage names through the ENS App without thinking about gas or which chain they’re on. We made the tough decision to not build the HCA directly into the protocol, and instead require an explicit user opt-in (a one-time L1 transaction). We think we made the right tradeoff to maintain ownership guarantees, but it will come at some cost to the user. Advanced operations like resolver changes and transfers still require L1 ETH for users who haven’t deployed their HCA, though those who have will get a lifetime approval rather than per-transaction costs, and the architectural shift meant significant rework across the protocol design and front-end integration.</p>
<p>The second was choosing BigName, an indexer we built ourselves, over alternatives, as the production indexer for the V4 apps and Coinbase’s Base App at Mainnet. The case for it is architectural: it’s built from the ground up to index ENSv1, ENSv2, and Basenames, and better supports replay history and verified data. It’s also the harder path short-term, which is why Beta will run on the existing indexer, while BigName will go live as part of Mainnet.</p>
<p>Both technical decisions are about making sure ENSv2 is something existing users and existing integrations can rely on. The sections below cover how that played out across protocol, product, design, engineering, and the wider ENS ecosystem.</p>
<h1><a name="p-62104-re-architecting-the-hca-3" class="anchor" href="#p-62104-re-architecting-the-hca-3" aria-label="Heading link"></a><strong>Re-architecting the HCA</strong></h1>
<p>One of the most consequential decisions this quarter was the re-architecture of HCAs. The original model was designed to give users a default smart account that could support gasless, sponsored, cross-chain interactions through account abstraction standards ERC-4337 and ERC-7579. The goal reflected the kind of experience ENSv2 should make possible: users should be able to register, renew, and manage names without constantly thinking about bridging, gas fees, or which chain they are on.</p>
<p>As the implementation matured, the team identified a deeper issue with the protocol-enshrined model. It created a new risk surface where DAO-level control could become broader than it is in ENSv1, potentially affecting name ownership rights.</p>
<p>The reworked model now requires explicit user opt-in through a one-time L1 transaction rather than automatically upgrading users into a protocol-recognized smart account. That choice preserves support for cross-chain registration and renewal while materially reducing the ownership-risk assumptions that made the original design uncomfortable. The change also creates real tradeoffs: advanced actions such as resolver changes, subname issuance, and secondary transfers still require L1 ETH.</p>
<p>This is the kind of decision that can look like a delay from the outside and feel like scope expansion on the inside. The point of ENSv2 is not to make every interaction smoother at any cost; it is to make ENS more powerful while preserving the guarantees that make the system worth trusting.</p>
<p>The same principle shaped the work on migration safety. The team resolved a V1 grace-period conflict by extending all names by 62 days, building the “graveyard” daemon, and preparing a V1 contract change to clear records on expiry so that re-registration on V2 is safe. Migration is where the protocol stops being theoretical and meets existing name holders where they are, including those with names in grace or using old resolvers.</p>
<p>Both of these decisions scope and affect the launch timeline, but it ultimately were the right ones. ENSv2 cannot trade ownership guarantees for speed. The team continued coordinating with two audit firms, completed formal verification work, and worked through the remaining implementation details with Rhinestone, with the same standard in mind: the protocol has to be safe enough before it can be launch-ready.</p>
<h1><a name="p-62104-from-protocol-complexity-to-user-ready-products-4" class="anchor" href="#p-62104-from-protocol-complexity-to-user-ready-products-4" aria-label="Heading link"></a><strong>From Protocol Complexity to User-Ready Products</strong></h1>
<p>One of the more revealing parts of ENSv2 is the split between the <strong><a href="https://app.ens.dev/">ENS App</a></strong> and <strong><a href="https://explorer.ens.dev/">ENS Explorer</a></strong>.</p>
<ul>
<li>The <strong>ENS App</strong> is where most users should be able to register, renew, migrate, and manage names without needing to understand every detail <a href="https://x.com/ensdomains/status/2056766919315976553">under the hood</a>.</li>
<li>The <strong>Explorer</strong> is where builders, power users, support teams, and curious users should be able to see what is happening when a name resolves, changes, inherits permissions, or moves through the system.</li>
</ul>
<p>That split shaped much of the product and design work in Q2. The Manager and Explorer were brought to Beta release readiness, including the V1-to-V2 upgrade experience, new registration and renewal screens reflecting updated pricing and grace-period behavior, new profiles and profile editing, entity highlighting in Explorer, registry contract views, role surfaces, address views, and a series of UX improvements that together make the system easier to navigate.</p>

<p>These product and protocol upgrades were a culmination of work across product, design, frontend, and QA over more than six two-week sprints, supported by weekly check-ins, and a design-one-sprint-ahead model. This new team process matters for a launch with this many dependencies.</p>
<p>Finally, Design and Marketing collaborated on a planned redesign of the ENS Domains website. An early review established what the site needs to communicate in the ENSv2 era and how to make the site feel less like a brochure and more like an explanation of how ENS benefits both individual users and organizations.</p>
<h1><a name="p-62104-building-reliable-infrastructure-5" class="anchor" href="#p-62104-building-reliable-infrastructure-5" aria-label="Heading link"></a><strong>Building Reliable Infrastructure</strong></h1>
<p>Q2 Web Engineering work focused on the parts of ENSv2 that users should not have to think about but absolutely depend on: indexing, signing, payment paths, metadata, profile rendering, migration state, and resolver visibility. These are the details that determine whether ENSv2 feels reliable when a user registers, renews, migrates, edits, or shares a name.</p>
<p>Indexing is one of the clearest examples of the invisible work users depend on without ever seeing. In June, the team selected BigName, an internally built indexer, as the single production indexer for the V4 apps and Coinbase’s Base App at Mainnet launch. ENSv2 needs an indexing layer that can understand ENSv1, ENSv2, and Basenames together, replay changes cleanly, reconstruct historical name state, support verified-mode and provenance as first-class concepts, and remain extensible as the protocol keeps evolving.</p>
<p>BigName gives us the strongest path because it was built around that model from the start.</p>
<p>Its Command Query Responsibility Segregation (CQRS) / event-sourced architecture separates immutable raw facts from rebuildable current-state projections, so most changes can be replayed from the event log instead of re-indexing the chain. That gives us cleaner reorg handling, reconstructable name state at past blocks, and one indexing model across ENSv1, ENSv2, and Basenames.</p>
<p>The team did assess other options, but each had tradeoffs that made them less suitable for Mainnet. One internal option remains useful as a conformance reference, but it was V2-only, based on an ENSv1-shaped schema, and did not have the event log needed to cover ENSv1 plus Basenames or replay reorgs cleanly. One external option was more production-ready and Subgraph-compatible, but our ideal solution for indexing requires granular replay, historical reconstruction, and per-call verified-mode guarantees. Additionally its current-state model does not provide the same granular replay, historical reconstruction, or per-call verified-mode guarantees that BigName does.</p>
<p>For Beta, the existing indexer will stay in place while BigName moves toward ENSv2 Mainnet readiness.</p>
<p>Other key infrastructure decisions &amp; progress during Q2:</p>
<ul>
<li><strong>Apps V2-Readiness:</strong> ENS Manager &amp; Explorer running against the V2 Sepolia deployment, with the hi-fi redesign, and V2 functionality close to feature-completion.</li>
<li><strong>Service Integrations:</strong> Work included an MVP of the Metadata service, an investigation into gas-sponsorship, Rhinestone integration, and cross-chain settlement for ETH and USDC swapping for name payment.</li>
<li><strong>Wallet Login:</strong> We continue to assess wallet login and credit card payment options against our key requirements, including headless integration, control over Wagmi, and ease of use. This work will continue post v2 as we work to expand the types of users that we can onboard into ENS.</li>
<li><strong>Maintenance &amp; Policy:</strong> Work included fixes across Manager/Explorer (records display, My Names owner/manager fields) and CSP/gateway handling.</li>
</ul>
<p>This work also required close coordination with external partners, including Rhinestone on payments and HCA, Crossmint on card checkout, Coinbase on indexer requirements such as batch indexing and Base support, and Rainbow plus others on CSP and gateway resolution issues.</p>
<p>The team also worked through several blockers, including HCA/account-abstraction architecture impacting frontend PRs, troubleshooting the App and Explorer environments, and working through an ownership-display issue caused by the V1 subgraph not cleaning up WrappedDomain entities after expired wrapped names were re-registered. Fortunately, the team was able to fix it through the ENS subgraph indexer, reinforcing how much launch readiness depends on the underlying infrastructure behaving reliably before users encounter it.</p>
<h1><a name="p-62104-ensv2-ecosystem-upgrade-6" class="anchor" href="#p-62104-ensv2-ecosystem-upgrade-6" aria-label="Heading link"></a><strong>ENSv2: Ecosystem Upgrade</strong></h1>
<p>ENSv2 launches everywhere that ENS already exists: wallets, apps, exchanges, libraries, developer tools, and the interfaces people use without thinking about the naming infrastructure underneath.</p>
<p>To prepare the developer ecosystem this quarter, we focused on that readiness through a structured partner-readiness program, triaging partner support, ensuring they are ready for ENSv2, and unblocking library integrations across <a href="https://github.com/ethers-io/ethers.js/blob/main/CHANGELOG.md#ethersv6170-2026-06-17-2350">Ethers.js v6</a>, <a href="https://github.com/ApeWorX/web3.py/pull/3822">web3.py</a>, <a href="https://github.com/LFDT-web3j/web3j">web3j</a>, and <a href="https://github.com/wealdtech/go-ens">go-ens</a>. The work included direct readiness support with teams including MetaMask, Uniswap App, Ledger, Kraken Wallet, OpenSea, Safe, and Aave. On the longer tail, we were able to increase the number of ENSv2 ready repositories on Github from 21% to 38%. Follow <a href="https://docs.ens.domains/web/ensv2-readiness/">this guide</a> to make your application ENSv2 ready and reach out in the <a href="https://t.me/+8kpICHHvSS81Mzkx">ENS Developer Telegram group</a> for tailored support and potential co-marketing.</p>
<p>Documentation and tooling formed another part of the readiness effort. <a href="https://github.com/ensdomains/docs/pull/543">ENSv2 documentation</a> was prepared ahead of Beta launch, the <a href="https://github.com/ensdomains/ens-cli">ENS CLI</a> was released as a developer preview for agentic workflows, and ENSIP-26 continued to progress alongside the collaboration with GoDaddy on Agent Name Service. The growing need for AI agent identity infrastructure remains a priority as ENS works to maintain a leading role in this emerging space.</p>
<p>On the hackathon front, we were able to stress test the builder and developer experience. Across <a href="https://ethglobal.com/events/cannes2026/prizes/ens">ETHGlobal Cannes</a>, <a href="https://x.com/ensdomains/status/2054548835884814356">ETHPrague</a>, ETHCC[9], <a href="https://x.com/ethconf/status/2064832798696104210">ETHConf</a>, and <a href="https://x.com/ETHGlobal/status/2066173573874778289">ETHGlobal New York</a>, we were able to see where builders got excited, where they got stuck, and what needed to become clearer before Mainnet.</p>
<p>At <a href="https://x.com/ETHGlobal/status/2065585161031262313">ETHGlobal New York</a>, 44% of teams built on ENS, the highest rate for any Tier 1 in-person hackathon, while the ENS Developers Telegram grew from 600 to 700+ members.</p>
<p>Winning hackathon projects worth highlighting of this quarter: <a href="https://ethglobal.com/showcase/veil-vpn-c643n">Veil VPN</a> (Cannes), <a href="https://devfolio.co/projects/ethesis-b242">ETHesis</a> (Prague), <a href="https://ethglobal.com/showcase/ghost-in-the-machine-x21o8">Ghost in the Machine</a> (Cannes), <a href="https://ethglobal.com/showcase/kondor-4bvt5">Kondor</a> (Cannes), <a href="https://x.com/ethswarm/status/2054557020859072704">Phare</a> (Prague).</p>

<p>Our work on ecosystem growth and strategic partnerships connected directly to this readiness effort. We focused on securing commitments from leading wallets and apps that are V2-ready and willing to support a coordinated co-marketing campaign around launch. That coordination only works if the technical work is real, and the technical work lands better when partners are also empowered on how to explain ENSv2 to their own users.</p>

<p>The quarter reinforced that ENSv2 readiness is both <em>technical</em> and <em>social</em>. Partners need <a href="https://docs.ens.domains/resolvers/universal/">Universal Resolver</a> support, but they also need launch calendars, approved messaging, integration confidence, and enough clarity to know what the upgrade unlocks for their users. Getting those pieces to move at the same pace is crucial.</p>
<h1><a name="p-62104-setting-the-migration-path-for-success-7" class="anchor" href="#p-62104-setting-the-migration-path-for-success-7" aria-label="Heading link"></a><strong>Setting the Migration Path for Success</strong></h1>
<p>A protocol upgrade can be technically sound and still fail to land with users if people do not understand what changed or why it matters. Across all teams, Q2 focused on developing the narrative, creative direction, and campaign readiness around ENSv2 so that launch feels like a major protocol milestone, not simply a maintenance notice with new branding.</p>
<p>To begin building awareness, we released the <strong><a href="https://x.com/ensdomains/status/2047318067139764693">ENSv2 explainer video</a></strong> and published deep dives into the <strong><a href="https://ens.domains/blog/post/ens-app-deep-dive">ENS App</a></strong> and <strong><a href="https://ens.domains/blog/post/ens-explorer-deep-dive">ENS Explorer</a></strong>, giving users and developers a substantive preview of the product philosophy behind the two new applications.</p>
<ul>
<li><strong>ENS App’s</strong> (<a href="https://app.ens.dev/">https://app.ens.dev/</a>) story is about designing through subtraction: hiding complexity where users do not need it and turning registration and management into flows the system can orchestrate.</li>
<li><strong>ENS Explorer’s</strong> (<a href="https://explorer.ens.dev/">https://explorer.ens.dev/</a>) story is about legibility: surfacing the full state of a name so that the protocol becomes easier to understand, rather than more opaque, as it becomes more powerful.</li>
</ul>
<p>Growth and marketing efforts continued developing the broader ENS narrative in preparation for Beta launch. Including published pieces on <a href="https://ens.domains/blog/post/names-are-no-longer-single-objects">hierarchical naming</a>, practical <a href="https://ens.domains/blog/post/7-ways-to-use-your-ens-name-onchain">onchain use cases</a>, <a href="https://ens.domains/blog/post/onchain-identity-is-becoming-public-infrastructure">onchain identity as public infrastructure</a>, and how ENS is the extension into the digital world for <a href="https://ens.domains/blog/post/why-humans-name-everything">why humans name everything</a>. These pieces help explain why ENSv2 is not only about a new set of contracts, but about making ENS more capable as the coordination layer for identity across the internet.</p>
<p>We also prioritized IRL events this quarter to continue building the hype for ENSv2.</p>
<p>We were the title sponsor of <a href="https://globalpizza.party/partners/ens">PizzaDAO’s Global Pizza Day</a>, with 32,000+ RSVPs and more than 370 official events worldwide, over 1 million impressions, and 6,400 wallets submitted to receive ENS subnames.</p>
<p>We also showed up at the Agentic Finance Summit, ETHConf, and <a href="https://x.com/irl_energy/status/2064729828251873315">Refraction’s IRL Tour</a>, with a mix of cultural reach, technical partner work, and institution-facing conversations. Check out Katherine’s talk at ETHConf in June on the <a href="https://www.youtube.com/watch?v=yaGEt40NWN4">Next Era of ENS</a>.</p>

<p>The main coordination challenge was making sure launch readiness did not move ahead of security and audit work. Rather than letting the campaign calendar drive the protocol, the team used Q2 to keep partner readiness, co-marketing plans, creative assets, and launch-day content moving in parallel, ready to launch when the new protocol lands on Mainnet.</p>
<p>While v2 readiness was the primary objective for the Growth team, there were a few additional wins with organizations and sectors beginning to move onchain in meaningful ways. We partnered with DOMA on a primary name campaign which brought in 300+ newly set ENS primary names. Additionally, users can now use DOMA to set their tokenized DNS as their ENS name.  Türkiye’s Directorate of Communication registered `cbiletisim.eth`, <a href="https://www.iletisim.gov.tr/english/duyurular/detay/press-release-digital-transformation-breakthrough-building-the-future-of-our-communication-ecosystem-via-ai-and-blockchain-technologies">making its first step</a> in establishing an official onchain identity by choosing ENS. Read more <a>here</a>.</p>

<h1><a name="p-62104-stewardship-required-for-launch-8" class="anchor" href="#p-62104-stewardship-required-for-launch-8" aria-label="Heading link"></a><strong>Stewardship Required for Launch</strong></h1>
<p>As ENS becomes more widely used, the work around the protocol expands. Code and product remain central, but ENS also depends on the surrounding layers that make infrastructure durable: legal structure, security posture, IP protection, governance support, and external partner standards.</p>
<p>This quarter, we focused on establishing that infrastructure for ENSv2 across IP, patent, cybersecurity, and commercial efforts. We filed the ENSv2 patent application in the US through USPTO Track One expedited examination, advanced protection for ENS (USSN 99179803), ENS Design / logo (USSN 99179808), and FRENSDAY (USSN 99186369).  As mentioned in the <a href="https://discuss.ens.domains/t/temp-check-next-era-of-ens-dao-empowering-the-ens-foundation/22175">ENS Foundation Temp Check v2</a>, the ENS Foundation is planned to <a href="https://discuss.ens.domains/t/temp-check-next-era-of-ens-dao-empowering-the-ens-foundation/22175#:~:text=Foundation%20holding%20the%20trademarks">manage the trademark ownership</a> and enforcement, as well as the patents and “intangible assets” (e.g. brand, legal).</p>
<p>Security and compliance work also continued to scale with ENS’s footprint. We strengthened access control, incident response, and threat-intelligence work through partnerships with <a href="https://quad9.net/">Quad9</a> and <a href="https://www.cleandns.com/">CleanerDNS</a><strong>,</strong> supported the <a href="https://www.theblock.co/post/398005/easydns-accepts-responsibility-for-eth-limo-hijack-its-first-social-engineering-breach-in-28-years">eth.limo incident response</a> and abuse-desk operations, drove Immunefi bug bounty revisions, and filed a police report with the Korean National Police Agency concerning malicious activity directed toward ENS. More adoption brings more attention, and more attention means the operational security surface has to keep maturing.</p>
<p>As part of our commitment to ENS’ role in the DNS Security space, we represented at the <a href="https://www.icann.org/en/contracted-parties/summit">2026 ICANN Contracted Parties Summit</a> in Manchester, <a href="https://indico.dns-oarc.net/event/56/">DNS OARC 46</a> in Edinburgh, and the <a href="https://gac.icann.org/agendas/icann86-seville-agenda">ICANN86 Policy Forum</a> in Seville.</p>
<p>Our work has strengthened relationships with registries, WIPO, and the contracted-party community, advanced our .ens gTLD preparation, and increased ENS visibility in technical, policy, and media discussions around naming systems, digital identity, and AI. Check out more in Slobo’s <a href="https://icann.justslobo.com/">ICANN86 Seville key takeaways</a>.</p>

<p><div class="lightbox-wrapper"><a class="lightbox" href="https://discuss.ens.domains/uploads/db9688/original/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df.jpeg" data-download-href="https://discuss.ens.domains/uploads/db9688/26c62b499a584adcb01bd4d84b4d5b44a6f800df" title="17_ICANN86 Seville 2026"><img src="https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_690x420.jpeg" alt="17_ICANN86 Seville 2026" data-base62-sha1="5x0IAB4sark4Ja7HzRpgt2P7UVV" width="690" height="420" srcset="https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_690x420.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_1035x630.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/26c62b499a584adcb01bd4d84b4d5b44a6f800df_2_1380x840.jpeg 2x" data-dominant-color="636E84"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">17_ICANN86 Seville 2026</span><span class="informations">1394×850 307 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>Another Q2 significant outcome was <a href="https://x.com/ensdomains/status/2065438475349041463">Nick’s appointment</a> to ICANN’s new seven-member <a href="https://www.icann.org/en/blogs/details/gtld-integrations-with-alternative-naming-systems-technical-study-group-underway-09-06-2026-en">Technical Study Group</a> on gTLD integrations with alternative naming systems. A lot of projects talk about replacing old infrastructure, but the harder and more useful work is making new infrastructure compatible with the systems that already serve billions of people. ENS having a seat in these TLD and DNS spaces is how the ENS protocol becomes the established internet infrastructure for years to come.</p>
<h1><a name="p-62104-financial-reporting-9" class="anchor" href="#p-62104-financial-reporting-9" aria-label="Heading link"></a><strong>Financial Reporting</strong></h1>

<p>Previously in the <a href="https://discuss.ens.domains/t/ens-labs-quarterly-progress-reports/20565/7#p-61101-financial-reporting-25">Q1 report financials</a>, Grant Income was reported as $771,258.86, which has been corrected to $1,904,234.28 based on the accrual accounting method.</p>

<h2><a name="p-62104-expenses-11" class="anchor" href="#p-62104-expenses-11" aria-label="Heading link"></a><strong>Expenses</strong></h2>
<p>Q2 2026 expenses totaled $2,557,283.37, resulting in a Net Income of $(165,405.40) for Q2.</p>

<p><strong>Top Q2 Expenses:</strong></p>
<ul>

<h1><a name="p-62104-next-ensv2-beta-and-mainnet-12" class="anchor" href="#p-62104-next-ensv2-beta-and-mainnet-12" aria-label="Heading link"></a><strong>Next: ENSv2 Beta and Mainnet</strong></h1>
<p>As Q2 closes, ENS Labs remains focused on one priority: shipping ENSv2 Beta and Mainnet in 2026, guided by user safety and experience.</p>
<p>ENSv2 is not a conventional release. It touches the protocol, the App, the Explorer, migration tooling, developer libraries, partner integrations, GTM alignment, legal considerations, and the way millions of existing name holders experience the upgrade.</p>
<p>Q2 required difficult but necessary decisions. We reworked HCA architecture when the risk model was not strong enough. We hardened migration flows so existing names are treated with the care they deserve during migration from V1 to V2. We chose explicit user consent where automatic upgrade paths introduced the wrong ownership assumptions. We accepted more complexity where it better protected users, and we cut or deprioritized work where deemed necessary.</p>
<p>Q3 will involve completing the remaining security and audit work and reading v2 for final deployment. After v2 launches on mainnet Ethereum, the team is looking forward to a more experimental phase of product development around specific integrations and use cases.</p>
<p>To the ENS community: our commitment is straightforward. ENS Labs is fully committed to shipping ENSv2 in 2026, and to doing it in a way that preserves the guarantees that make ENS worth trusting. ENSv2 is the most substantial upgrade to ENS since the protocol began. It changes how names are structured, how ownership and permissions can work, how users migrate, how builders integrate, and how ENS can scale as the naming layer for the next generation of the internet.</p>
<p>The ENS user comes first. That has been the north star of every hard decision in Q2, and it will remain the standard for the work ahead. ENSv2 is not just the next ENS release. It is the next foundation for ENS.</p>
<p>Finally, to be clear, the <a href="https://discuss.ens.domains/t/temp-check-next-era-of-ens-dao-empowering-the-ens-foundation/22175">expansion of the ENS Foundation</a> does not change the protocol-level guarantees that make ENS valuable. Your ENS name still resolves across major web3 wallets, you can still import your own DNS domain, your name remains unruggable and immutable under ENS ownership rules, and ENS remains permissionless infrastructure for anyone to build on.</p>
