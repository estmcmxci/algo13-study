e5a1462a\\u0026amp;show_winners=true\\\&quot;\\u003eOPM\\u003c/a\\u003e (onchain security layer for npm), \\u003ca href=\\\&quot;https://devfolio.co/projects/bumpay-f426\\\&quot;\\u003eBumpWallet\\u003c/a\\u003e (tap to pay NFC wallet), and \\u003ca href=\\\&quot;https://devfolio.co/projects/dploy-fb72\\\&quot;\\u003eD3ploy\\u003c/a\\u003e (censorship-resistant deployment platform).\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/d/d5743768b8ad79ca7784171dfbdf95e77072a370.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/d5743768b8ad79ca7784171dfbdf95e77072a370\\\&quot; title=\\\&quot;17_ETHMumbai 2026_1\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/d/d5743768b8ad79ca7784171dfbdf95e77072a370_2_690x393.jpeg\\\&quot; alt=\\\&quot;17_ETHMumbai 2026_1\\\&quot; data-base62-sha1=\\\&quot;usiH0U3pG6rYPgItWrr2oJst0di\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;393\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/d/d5743768b8ad79ca7784171dfbdf95e77072a370_2_690x393.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/d/d5743768b8ad79ca7784171dfbdf95e77072a370_2_1035x589.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/d/d5743768b8ad79ca7784171dfbdf95e77072a370_2_1380x786.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;DD9492\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e17_ETHMumbai 2026_1\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1658×946 176 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/a/ad8a3250b772341763b43271aae9255a4c28a276.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/ad8a3250b772341763b43271aae9255a4c28a276\\\&quot; title=\\\&quot;18_ETHMumbai 2026_2\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ad8a3250b772341763b43271aae9255a4c28a276_2_690x448.jpeg\\\&quot; alt=\\\&quot;18_ETHMumbai 2026_2\\\&quot; data-base62-sha1=\\\&quot;oLcGBhs1UdXSVFpJiewf7Co025U\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;448\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ad8a3250b772341763b43271aae9255a4c28a276_2_690x448.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ad8a3250b772341763b43271aae9255a4c28a276_2_1035x672.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ad8a3250b772341763b43271aae9255a4c28a276_2_1380x896.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;AD7864\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e18_ETHMumbai 2026_2\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1646×1070 395 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-new-surfaces-for-ens-16\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-new-surfaces-for-ens-16\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eNew Surfaces for ENS\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eEven while all teams across ENS remain focused on v2 delivery, we are also deeply aware the work does not end there. ENS is the universal pointer for all emerging digital primitives, and we spent Q1 working on increasing the surface area for ENS.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-oneth-interoperable-names-17\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-oneth-interoperable-names-17\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eon.eth: Interoperable Names\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eIn partnership with Unruggable, Wonderland, and the Ethereum Foundation, we launched \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/on-eth-chain-registry\\\&quot;\\u003eon.eth: Names For Chains and Interoperable Names\\u003c/a\\u003e.\\u003c/strong\\u003e A \\u003ca href=\\\&quot;https://agora.ensdao.org/proposals/103727552069485114370289118760519929157657207659236887832122369454255184795333\\\&quot;\\u003eDAO approved\\u003c/a\\u003e canonical chain registry enabling interoperable names (for example, vitalik.eth@base) via \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://eips.ethereum.org/EIPS/eip-7828\\\&quot;\\u003eERC-7828\\u003c/a\\u003e\\u003c/strong\\u003e, replacing fragmented off-chain mappings with verifiable onchain resolution.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/8/82385685af11ff03f693a86ec566fc9f89554bdd.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/82385685af11ff03f693a86ec566fc9f89554bdd\\\&quot; title=\\\&quot;19_on.eth Interoperable Names\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82385685af11ff03f693a86ec566fc9f89554bdd_2_443x500.jpeg\\\&quot; alt=\\\&quot;19_on.eth Interoperable Names\\\&quot; data-base62-sha1=\\\&quot;izYM2127czVe9wiq0OktUYU1uJ7\\\&quot; width=\\\&quot;443\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82385685af11ff03f693a86ec566fc9f89554bdd_2_443x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82385685af11ff03f693a86ec566fc9f89554bdd_2_664x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/8/82385685af11ff03f693a86ec566fc9f89554bdd_2_886x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;353A32\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e19_on.eth Interoperable Names\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1094×1232 150 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/0/03a179afedb9bb1420157b304d8d669471a1c682.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/03a179afedb9bb1420157b304d8d669471a1c682\\\&quot; title=\\\&quot;20_Interoperable Addresses\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/03a179afedb9bb1420157b304d8d669471a1c682_2_690x251.png\\\&quot; alt=\\\&quot;20_Interoperable Addresses\\\&quot; data-base62-sha1=\\\&quot;w7ohP0mmaTNdAdLHbH1SPJ8AMy\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;251\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/03a179afedb9bb1420157b304d8d669471a1c682_2_690x251.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/03a179afedb9bb1420157b304d8d669471a1c682_2_1035x376.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/03a179afedb9bb1420157b304d8d669471a1c682_2_1380x502.png 2x\\\&quot; data-dominant-color=\\\&quot;F0F4F7\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e20_Interoperable Addresses\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1512×552 91.7 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-ens-x-ai-18\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-ens-x-ai-18\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS x AI\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eIn Q1, we kept pushing on ENS as the identity layer for AI agents. Our \\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-ai-agent-erc8004\\\&quot;\\u003eERC-8004 companion blog\\u003c/a\\u003e laid out why ENS is the naming layer for AI agent commerce. We followed up by contributing to \\u003ca href=\\\&quot;https://ens.domains/blog/post/ensip-25\\\&quot;\\u003eENSIP-25\\u003c/a\\u003e, a minimal standard for verifiable bidirectional attestation between ENS names and onchain AI agent registries.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/6/6d7ca249d1541988b34e6905d664aac86d0c4d84.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/6d7ca249d1541988b34e6905d664aac86d0c4d84\\\&quot; title=\\\&quot;21_ENSIP-25\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6d7ca249d1541988b34e6905d664aac86d0c4d84_2_690x385.jpeg\\\&quot; alt=\\\&quot;21_ENSIP-25\\\&quot; data-base62-sha1=\\\&quot;fCz4pVBeMXyrRRGi1AEG5YmSpMg\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;385\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6d7ca249d1541988b34e6905d664aac86d0c4d84_2_690x385.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6d7ca249d1541988b34e6905d664aac86d0c4d84_2_1035x577.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6d7ca249d1541988b34e6905d664aac86d0c4d84_2_1380x770.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F9F5F7\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e21_ENSIP-25\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1456×814 79 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eENS is positioned as the naming and discovery layer for AI agents, an open and standard namespace the ecosystem can build on, ensuring onchain agents are consistently and verifiably identifiable as the space evolves.\\u003c/p\\u003e\\n\\u003cp\\u003eRead more about how to use ENS to \\u003ca href=\\\&quot;https://docs.ens.domains/building-with-ai/\\\&quot;\\u003ebuild with LLMs and AI assistants\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-integrations-partnerships-19\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-integrations-partnerships-19\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIntegrations \\u0026amp; Partnerships\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eWe’re continuing to build integration partnerships, with a focus on FinTech companies bringing consumers onchain. A key learning from Q1: pitching ENS to institutions takes data-driven arguments. Framing ENS as a solution to address-poisoning scams (which targeted 1.3 million users in 2024 with confirmed losses of at least $79.3 million) lands with institutional buyers in a way that abstract decentralization arguments don’t.\\u003c/p\\u003e\\n\\u003cp\\u003eStrategic meetings were held with leading payments and domain infrastructure companies to explore ENS integration across name resolution and subnames as a username system. Internally we rallied together to define the highest priority integration partners and ensure readiness to integrate into partner company’s tech stacks.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also launched an authoritative \\u003ca href=\\\&quot;https://ens.domains/blog/post/google-bigquery-community-dataset\\\&quot;\\u003eENS community dataset on Google Cloud BigQuery\\u003c/a\\u003e. Researchers and builders now have SQL-queryable access to ENS activity with daily updates.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-ens-gtld-dns-engagement-20\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-ens-gtld-dns-engagement-20\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003e.ens gTLD \\u0026amp; DNS Engagement\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eENS’ DNS policy and ICANN engagement efforts continued to accelerate forward in Q1. Ahead of ICANN’s 2026 gTLD round, we advanced preparations for .ens as the application window opens in Q2 2026. Extending off that work and deepening our presence in the DNS space, Alex Urbelis (GC \\u0026amp; CISO) submitted \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://www.icann.org/en/public-comment/proceeding/name-collision-procedure-documentation-29-01-2026/submissions/urbelis-alexander-16-03-2026\\\&quot;\\u003ePublic Comments\\u003c/a\\u003e\\u003c/strong\\u003e on the Name Collision Procedure Documentation for the 2026 New gTLD Round.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/f/f3635f2ff9676f87616ced3837617db55fa5bdc0.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/f3635f2ff9676f87616ced3837617db55fa5bdc0\\\&quot; title=\\\&quot;22_ENS Name Collision Public Comments\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f3635f2ff9676f87616ced3837617db55fa5bdc0_2_690x372.jpeg\\\&quot; alt=\\\&quot;22_ENS Name Collision Public Comments\\\&quot; data-base62-sha1=\\\&quot;yJ6Vz3l52sZWmuHa7dI1u8wdWGk\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;372\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f3635f2ff9676f87616ced3837617db55fa5bdc0_2_690x372.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f3635f2ff9676f87616ced3837617db55fa5bdc0_2_1035x558.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/f/f3635f2ff9676f87616ced3837617db55fa5bdc0.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F2F5F6\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e22_ENS Name Collision Public Comments\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1316×710 103 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWe showed up across key industry forums this quarter, presenting on public-private partnerships with the National Cyber Forensics Training Alliance, joining the Coalition to Change Crypto Freezes and Recovery where we contributed the UDRP model as a framework for industry collaboration, and participating in DNS focused discussions.\\u003c/p\\u003e\\n\\u003cp\\u003eLooking ahead, we remain committed to stewarding ENS’ presence in the DNS space and will have more to share on .ens in Q2.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-growth-ecosystem-21\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-growth-ecosystem-21\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eGrowth \\u0026amp; Ecosystem\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-narrative-content-22\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-narrative-content-22\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eNarrative \\u0026amp; Content\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ1 was the most productive quarter ever for ENS Labs content output, with \\u003ca href=\\\&quot;https://ens.domains/blog\\\&quot;\\u003e10 blog posts\\u003c/a\\u003e published on ens.domains, a new record quarter.\\u003c/p\\u003e\\n\\u003cp\\u003eWe published a \\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-was-here-first\\\&quot;\\u003ecompetitive positioning piece\\u003c/a\\u003e articulating why siloed namespaces don’t constitute infrastructure, and a \\u003ca href=\\\&quot;https://ens.domains/blog/post/identity-as-infrastructure\\\&quot;\\u003estrategic essay framing ENS as the coordination layer of the internet\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/0/0288e16a11933238ef17ddf1c8696bcf974d0b55.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/0288e16a11933238ef17ddf1c8696bcf974d0b55\\\&quot; title=\\\&quot;23_ENS Coordination Layer\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0288e16a11933238ef17ddf1c8696bcf974d0b55_2_690x456.jpeg\\\&quot; alt=\\\&quot;23_ENS Coordination Layer\\\&quot; data-base62-sha1=\\\&quot;mqdE6ZP2tnosg4rguABkfyVkt7\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;456\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0288e16a11933238ef17ddf1c8696bcf974d0b55_2_690x456.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0288e16a11933238ef17ddf1c8696bcf974d0b55_2_1035x684.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/0/0288e16a11933238ef17ddf1c8696bcf974d0b55.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;D6EEF7\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e23_ENS Coordination Layer\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1286×850 158 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAdditionally, came the newly launched \\u003ca href=\\\&quot;https://x.com/saniyamore/article/2027392181418500458\\\&quot;\\u003eThe Reverse Record\\u003c/a\\u003e newsletter in Q1. A strategic publication designed to distill everything happening across the ENS ecosystem into something thoughtful, readable, and most importantly useful.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/928b9ae659c9ff2ba2b060b43d882ddc36b62f59.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/928b9ae659c9ff2ba2b060b43d882ddc36b62f59\\\&quot; title=\\\&quot;24_The Reverse Record\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/928b9ae659c9ff2ba2b060b43d882ddc36b62f59_2_466x500.jpeg\\\&quot; alt=\\\&quot;24_The Reverse Record\\\&quot; data-base62-sha1=\\\&quot;kUoOpSBKsmQmpzPXVurmt2ZzGoF\\\&quot; width=\\\&quot;466\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/928b9ae659c9ff2ba2b060b43d882ddc36b62f59_2_466x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/928b9ae659c9ff2ba2b060b43d882ddc36b62f59_2_699x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/928b9ae659c9ff2ba2b060b43d882ddc36b62f59_2_932x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;4E4D4D\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e24_The Reverse Record\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1072×1150 117 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAcross Q1, we continued to deliver against three strategic pillars: making ENSv2 tangible for users and developers, establishing ENS as the neutral identity layer for the emerging AI agent economy, and reinforcing our role as foundational internet infrastructure.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-ens-subname-ecosystem-23\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-ens-subname-ecosystem-23\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS Subname Ecosystem\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ1 brought continued momentum across the ENS subname ecosystem, especially with Basenames which grew to 2.7 million names. Key partners include:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eWorld App (world.id):\\u003c/strong\\u003e 17.5M+ names\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eCaldera (calderans.eth):\\u003c/strong\\u003e 9.6M+ names\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eBase (base.eth):\\u003c/strong\\u003e 2.7M names\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eUniswap (uni.eth):\\u003c/strong\\u003e 2M names\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eLinea (linea.eth):\\u003c/strong\\u003e 530K names\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-social-media-24\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-social-media-24\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eSocial \\u0026amp; Media\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eOn X, \\u003ca href=\\\&quot;https://x.com/ensdomains\\\&quot;\\u003eensdomains\\u003c/a\\u003e saw 1.3M impressions (up 7.3% QoQ), with our engagement rate up 21% to 4.2%, reposts up 104%, bookmarks up 121%, and shares up 178%.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/4/4c63f0014b7c438e3929686b45f73efe4372da64.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/4c63f0014b7c438e3929686b45f73efe4372da64\\\&quot; title=\\\&quot;25_ENS Domains Q1 X Social Impressions\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/4c63f0014b7c438e3929686b45f73efe4372da64_2_570x500.jpeg\\\&quot; alt=\\\&quot;25_ENS Domains Q1 X Social Impressions\\\&quot; data-base62-sha1=\\\&quot;aTMoYKZZ0p0jZqTIIXjKqPkRxFW\\\&quot; width=\\\&quot;570\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/4c63f0014b7c438e3929686b45f73efe4372da64_2_570x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/4c63f0014b7c438e3929686b45f73efe4372da64_2_855x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/4c63f0014b7c438e3929686b45f73efe4372da64_2_1140x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F4F7F7\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e25_ENS Domains Q1 X Social Impressions\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1476×1294 144 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-61101-financial-reporting-25\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-financial-reporting-25\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eFinancial Reporting\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-income-26\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-income-26\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIncome\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eAs of Q1 2026 close on March 31, 2026, we have received 771,258.86 USDC (32% of the Q1 stream) from the ENS DAO.\\u003c/p\\u003e\\n\\u003cp\\u003eAt the time of this report being posted, ENS Labs is still awaiting 2,391,164.00 USDC (68% of the Q1 stream) from the DAO for 2026 thus far that has been delayed due to an insufficient balance of USDC in the DAO wallet. We are hopeful that the new funds flow operation as outlined in \\u003ca href=\\\&quot;https://vote.ensdao.org/#/onchain/103727552069485114370289118760519929157657207659236887832122369454255184795333\\\&quot;\\u003e[EP 6.39] [Executable] Treasury Flow Automation\\u003c/a\\u003e will minimize delays like this in the future.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-61101-expenses-27\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-61101-expenses-27\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eExpenses\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ1 2026 expenses totaled $2,433,827.16 USD, resulting in a Net Income of \\u003cstrong\\u003e$(1,662,568.30)\\u003c/strong\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/6/6bcda703f3ec10bf7fbca5db97a6340f4169bc62.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/6bcda703f3ec10bf7fbca5db97a6340f4169bc62\\\&quot; title=\\\&quot;26_ENS Labs Q1 2026 Income Statement\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6bcda703f3ec10bf7fbca5db97a6340f4169bc62_2_690x348.png\\\&quot; alt=\\\&quot;26_ENS Labs Q1 2026 Income Statement\\\&quot; data-base62-sha1=\\\&quot;fnFHfvfvQAvgyOQ3yTFGQQmGrPc\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;348\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6bcda703f3ec10bf7fbca5db97a6340f4169bc62_2_690x348.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6bcda703f3ec10bf7fbca5db97a6340f4169bc62_2_1035x522.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/6bcda703f3ec10bf7fbca5db97a6340f4169bc62_2_1380x696.png 2x\\\&quot; data-dominant-color=\\\&quot;F0F0F0\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e26_ENS Labs Q1 2026 Income Statement\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1692×854 227 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eTop Q1 expense categories were:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eEmployee Compensation \\u0026amp; Benefits\\u003c/strong\\u003e (70.7%) for payroll, benefits, and employer contributions for our team of 39 headcount.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eProfessional Services\\u003c/strong\\u003e (12.8%) included ENSv2 infrastructure and audit teams, as well as regular expenses to our operational external agencies and firms (e.g. Legal, Recruiting, PR).\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eTravel \\u0026amp; Expense\\u003c/strong\\u003e (8.3%) inclusive of our company wide in-person offsite, plus conference and hackathon travel related expenses.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/2/220339c0b1c3371c8cb3f5ecfbf3e5f1a29e62b2.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/220339c0b1c3371c8cb3f5ecfbf3e5f1a29e62b2\\\&quot; title=\\\&quot;27_ENS Labs Q1 2026 Expenses\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/220339c0b1c3371c8cb3f5ecfbf3e5f1a29e62b2_2_690x436.jpeg\\\&quot; alt=\\\&quot;27_ENS Labs Q1 2026 Expenses\\\&quot; data-base62-sha1=\\\&quot;4QT8YCQ4J4mWnXvVZBJxf9Nd3Zo\\\&quot; width=\\\& ce for existing .eth holders\\u003c/li\\u003e\\n\\u003cli\\u003eFinalize ENSv2 developer documentation, migration guides, and SDKs ahead of launch\\u003c/li\\u003e\\n\\u003cli\\u003eExecute co-marketing and partner activation campaigns to make launch day feel ecosystem wide\\u003c/li\\u003e\\n\\u003cli\\u003eDrive ENSv2 ecosystem readiness to 100% across wallets, libraries, and dApps\\u003c/li\\u003e\\n\\u003cli\\u003eContinue advancing the .ens gTLD application with ICANN, including attendance at key DNS aligned and ICANN events\\u003c/li\\u003e\\n\\u003cli\\u003eDeepen ENS x AI positioning as foundational identity infrastructure for agents\\u003c/li\\u003e\\n\\u003cli\\u003eExpand hackathon presence at ETHPrague and beyond\\u003c/li\\u003e\\n\\u003cli\\u003eExplore growth use cases including payments, verified credentials, AI agents, and real world registries\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eENSv2 is the most significant upgrade in ENS’ history. What we built in Q1 (public alphas, ecosystem readiness tooling, architectural clarity, a team now fully resourced for delivery), puts us in the position to ship.\\u003c/p\\u003e\\n\\u003cp\\u003eWe appreciate the ENS DAO’s continued support and look forward to sharing ENSv2 launch milestones soon.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:8,\&quot;updated_at\&quot;:\&quot;2026-04-17T21:16:34.938Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:6,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:56,\&quot;reads\&quot;:48,\&quot;readers_count\&quot;:47,\&quot;score\&quot;:639.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:20565,\&quot;topic_slug\&quot;:\&quot;ens-labs-quarterly-progress-reports\&quot;,\&quot;display_username\&quot;:\&quot;Katherine Wu\&quot;,\&quot;primary_group_name\&quot;:\&quot;delegates\&quot;,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null, &quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:62104,\&quot;name\&quot;:\&quot;Katherine Wu\&quot;,\&quot;username\&quot;:\&quot;katherine.eth\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discuss.ens.domains/katherine.eth/{size}/7729_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2026-07-18T01:57:00.650Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-ens-labs-quarterly-report-q2-2026-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-ens-labs-quarterly-report-q2-2026-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS Labs Quarterly Report-\\u003c/strong\\u003e Q2 2026\\u003c/h1\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-abstract-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-abstract-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eAbstract\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eQ2 was about getting ENSv2 ready for Beta and Mainnet. ENS started with a simple problem: addresses are unreadable. But eight years later, ENS isn’t just making Ethereum addresses legible, but also serving as a human-readable reference for 60+ blockchains, offchain naming systems, content, agents, and other types of records. The protocol itself needs to be both predictable for apps and users that have been around for the last half decade, yet still needs to evolve to how blockchains are being used today.\\u003c/p\\u003e\\n\\u003cp\\u003eThat’s harder than it sounds, because ENSv2 has to satisfy audiences that require different things. Existing name holders need the upgrade to be safe and predictable. On the other hand, potential new users unfamiliar with wallets need to acquire a .eth name easily. And finally, wallets, apps, and libraries already integrated with ENS need to better resolve the many types of ENS names that now exist. With all this in mind, there were two major decision points that affected how we thought about and designed for v2.\\u003c/p\\u003e\\n\\u003cp\\u003eThe first was Hidden Contract Accounts (HCA), the smart-account model meant to let people register, renew, and manage names through the ENS App without thinking about gas or which chain they’re on. We made the tough decision to not build the HCA directly into the protocol, and instead require an explicit user opt-in (a one-time L1 transaction). We think we made the right tradeoff to maintain ownership guarantees, but it will come at some cost to the user. Advanced operations like resolver changes and transfers still require L1 ETH for users who haven’t deployed their HCA, though those who have will get a lifetime approval rather than per-transaction costs, and the architectural shift meant significant rework across the protocol design and front-end integration.\\u003c/p\\u003e\\n\\u003cp\\u003eThe second was choosing BigName, an indexer we built ourselves, over alternatives, as the production indexer for the V4 apps and Coinbase’s Base App at Mainnet. The case for it is architectural: it’s built from the ground up to index ENSv1, ENSv2, and Basenames, and better supports replay history and verified data. It’s also the harder path short-term, which is why Beta will run on the existing indexer, while BigName will go live as part of Mainnet.\\u003c/p\\u003e\\n\\u003cp\\u003eBoth technical decisions are about making sure ENSv2 is something existing users and existing integrations can rely on. The sections below cover how that played out across protocol, product, design, engineering, and the wider ENS ecosystem.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-re-architecting-the-hca-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-re-architecting-the-hca-3\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eRe-architecting the HCA\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eOne of the most consequential decisions this quarter was the re-architecture of HCAs. The original model was designed to give users a default smart account that could support gasless, sponsored, cross-chain interactions through account abstraction standards ERC-4337 and ERC-7579. The goal reflected the kind of experience ENSv2 should make possible: users should be able to register, renew, and manage names without constantly thinking about bridging, gas fees, or which chain they are on.\\u003c/p\\u003e\\n\\u003cp\\u003eAs the implementation matured, the team identified a deeper issue with the protocol-enshrined model. It created a new risk surface where DAO-level control could become broader than it is in ENSv1, potentially affecting name ownership rights.\\u003c/p\\u003e\\n\\u003cp\\u003eThe reworked model now requires explicit user opt-in through a one-time L1 transaction rather than automatically upgrading users into a protocol-recognized smart account. That choice preserves support for cross-chain registration and renewal while materially reducing the ownership-risk assumptions that made the original design uncomfortable. The change also creates real tradeoffs: advanced actions such as resolver changes, subname issuance, and secondary transfers still require L1 ETH.\\u003c/p\\u003e\\n\\u003cp\\u003eThis is the kind of decision that can look like a delay from the outside and feel like scope expansion on the inside. The point of ENSv2 is not to make every interaction smoother at any cost; it is to make ENS more powerful while preserving the guarantees that make the system worth trusting.\\u003c/p\\u003e\\n\\u003cp\\u003eThe same principle shaped the work on migration safety. The team resolved a V1 grace-period conflict by extending all names by 62 days, building the “graveyard” daemon, and preparing a V1 contract change to clear records on expiry so that re-registration on V2 is safe. Migration is where the protocol stops being theoretical and meets existing name holders where they are, including those with names in grace or using old resolvers.\\u003c/p\\u003e\\n\\u003cp\\u003eBoth of these decisions scope and affect the launch timeline, but it ultimately were the right ones. ENSv2 cannot trade ownership guarantees for speed. The team continued coordinating with two audit firms, completed formal verification work, and worked through the remaining implementation details with Rhinestone, with the same standard in mind: the protocol has to be safe enough before it can be launch-ready.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-from-protocol-complexity-to-user-ready-products-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-from-protocol-complexity-to-user-ready-products-4\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eFrom Protocol Complexity to User-Ready Products\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eOne of the more revealing parts of ENSv2 is the split between the \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://app.ens.dev/\\\&quot;\\u003eENS App\\u003c/a\\u003e\\u003c/strong\\u003e and \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://explorer.ens.dev/\\\&quot;\\u003eENS Explorer\\u003c/a\\u003e\\u003c/strong\\u003e.\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eThe \\u003cstrong\\u003eENS App\\u003c/strong\\u003e is where most users should be able to register, renew, migrate, and manage names without needing to understand every detail \\u003ca href=\\\&quot;https://x.com/ensdomains/status/2056766919315976553\\\&quot;\\u003eunder the hood\\u003c/a\\u003e.\\u003c/li\\u003e\\n\\u003cli\\u003eThe \\u003cstrong\\u003eExplorer\\u003c/strong\\u003e is where builders, power users, support teams, and curious users should be able to see what is happening when a name resolves, changes, inherits permissions, or moves through the system.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eThat split shaped much of the product and design work in Q2. The Manager and Explorer were brought to Beta release readiness, including the V1-to-V2 upgrade experience, new registration and renewal screens reflecting updated pricing and grace-period behavior, new profiles and profile editing, entity highlighting in Explorer, registry contract views, role surfaces, address views, and a series of UX improvements that together make the system easier to navigate.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/7/7669466149101a15a4ef0f8ff091f98a6bd12131.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/7669466149101a15a4ef0f8ff091f98a6bd12131\\\&quot; title=\\\&quot;1_ENS App\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7669466149101a15a4ef0f8ff091f98a6bd12131_2_683x500.jpeg\\\&quot; alt=\\\&quot;1_ENS App\\\&quot; data-base62-sha1=\\\&quot;gTvTiOV51LzENPYCwhZQLbR1rpf\\\&quot; width=\\\&quot;683\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7669466149101a15a4ef0f8ff091f98a6bd12131_2_683x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7669466149101a15a4ef0f8ff091f98a6bd12131_2_1024x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7669466149101a15a4ef0f8ff091f98a6bd12131_2_1366x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;EEE8EC\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e1_ENS App\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1520×1112 265 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/6/65f4b33e5081ad78d8f6ea57249845991c746402.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/65f4b33e5081ad78d8f6ea57249845991c746402\\\&quot; title=\\\&quot;2_ENS Explorer\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/65f4b33e5081ad78d8f6ea57249845991c746402_2_690x452.jpeg\\\&quot; alt=\\\&quot;2_ENS Explorer\\\&quot; data-base62-sha1=\\\&quot;exWuw3CkSHKDCOFMA54jBan4DiW\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;452\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/65f4b33e5081ad78d8f6ea57249845991c746402_2_690x452.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/65f4b33e5081ad78d8f6ea57249845991c746402_2_1035x678.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/65f4b33e5081ad78d8f6ea57249845991c746402_2_1380x904.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F3F1EF\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e2_ENS Explorer\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1560×1022 178 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe upgrade flow is a good example of the kind of work that looks simple only when it has been designed well. It needed to handle locked names, locked resolvers, names that could not be upgraded to V2, eligibility checks, gas estimation, and record history without turning the experience into a checklist of protocol edge cases.\\u003c/p\\u003e\\n\\u003cp\\u003ePricing and grace-period work followed the same pattern. In April, we \\u003ca href=\\\&quot;https://snapshot.org/#/s:ens.eth/proposal/0xeba629f6c1600cceff07e01e922e4e61c7b19f9e04e03e89ec30500878cb6783\\\&quot;\\u003eproposed two changes\\u003c/a\\u003e to .eth registration pricing to take effect with the ENSv2 launch: a multi-year registration discount and an increase in the annual registration fee for names with five or more characters from $5 to $8 per year.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/1/1e62c6436c728e3776c5ac0f371555fbf1a69fbb.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/1e62c6436c728e3776c5ac0f371555fbf1a69fbb\\\&quot; title=\\\&quot;3_Registration Pricing Tiers\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/1/1e62c6436c728e3776c5ac0f371555fbf1a69fbb_2_653x500.jpeg\\\&quot; alt=\\\&quot;3_Registration Pricing Tiers\\\&quot; data-base62-sha1=\\\&quot;4kNWJVsBVDr6HQy45m8U1KkU2fh\\\&quot; width=\\\&quot;653\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/1/1e62c6436c728e3776c5ac0f371555fbf1a69fbb_2_653x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/1/1e62c6436c728e3776c5ac0f371555fbf1a69fbb_2_979x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/1/1e62c6436c728e3776c5ac0f371555fbf1a69fbb_2_1306x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F6F6F6\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e3_Registration Pricing Tiers\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1470×1124 181 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/1/196cbc9232c4a207ba6ba7a4a6820ebab24d5639.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/196cbc9232c4a207ba6ba7a4a6820ebab24d5639\\\&quot; title=\\\&quot;4_Registration Annual Fees\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/1/196cbc9232c4a207ba6ba7a4a6820ebab24d5639_2_690x365.jpeg\\\&quot; alt=\\\&quot;4_Registration Annual Fees\\\&quot; data-base62-sha1=\\\&quot;3CUU2sh5PNOUx04nX8MxTRg8sGZ\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;365\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/1/196cbc9232c4a207ba6ba7a4a6820ebab24d5639_2_690x365.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/1/196cbc9232c4a207ba6ba7a4a6820ebab24d5639_2_1035x547.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/1/196cbc9232c4a207ba6ba7a4a6820ebab24d5639_2_1380x730.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F5F6F6\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e4_Registration Annual Fees\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1446×766 120 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe Product and Design teams translated the DAO-approved pricing changes into registration screens, pricing tiers, grace-period messaging, reminder communications, and the new “price cooldown” experience. The design work around the multi-year discount curve and tier structure also fed directly into the registration contracts, showing how research, governance feedback, product design, and protocol implementation came together.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/1/195271680564c9ec680644fe3aa04808848b3ccd.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/195271680564c9ec680644fe3aa04808848b3ccd\\\&quot; title=\\\&quot;5_Pricing Cooldown\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/1/195271680564c9ec680644fe3aa04808848b3ccd_2_690x478.jpeg\\\&quot; alt=\\\&quot;5_Pricing Cooldown\\\&quot; data-base62-sha1=\\\&quot;3C0zljif7TBs8TrjuXi8suR11OB\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;478\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/1/195271680564c9ec680644fe3aa04808848b3ccd_2_690x478.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/1/195271680564c9ec680644fe3aa04808848b3ccd_2_1035x717.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/1/195271680564c9ec680644fe3aa04808848b3ccd_2_1380x956.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F2F5F7\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e5_Pricing Cooldown\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1502×1042 131 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/e/e25d7a8df7753d5c8c9ccfcf767edca11de032c2.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/e25d7a8df7753d5c8c9ccfcf767edca11de032c2\\\&quot; title=\\\&quot;6_Pricing Cooldown Pricing Curve\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e25d7a8df7753d5c8c9ccfcf767edca11de032c2_2_690x251.jpeg\\\&quot; alt=\\\&quot;6_Pricing Cooldown Pricing Curve\\\&quot; data-base62-sha1=\\\&quot;wiwbvlvQFudAXMm41nN2gDue8W6\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;251\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e25d7a8df7753d5c8c9ccfcf767edca11de032c2_2_690x251.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e25d7a8df7753d5c8c9ccfcf767edca11de032c2_2_1035x376.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e25d7a8df7753d5c8c9ccfcf767edca11de032c2_2_1380x502.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;EEF4F7\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e6_Pricing Cooldown Pricing Curve\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1546×564 107 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eENS Explorer\\u003c/strong\\u003e work addressed the other side of the same trust equation. As ENSv2 makes names more dynamic, the system naturally becomes more complex: \\u003ca href=\\\&quot;https://x.com/ensdomains/status/2056729157065965852\\\&quot;\\u003erole-based permissions\\u003c/a\\u003e can be assigned, registries can operate independently, names can be nested, and historical context becomes more important. The team’s prioritization helped us deliver on several features planned for the Beta launch, including the migration flow, pricing and grace period updates, Explorer entity highlighting, and the registry contract interface.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/5/5806fda975cec9a1f78db216ce828144a1a70333.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/5806fda975cec9a1f78db216ce828144a1a70333\\\&quot; title=\\\&quot;7_ENS Explorer Registry\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5806fda975cec9a1f78db216ce828144a1a70333_2_690x475.jpeg\\\&quot; alt=\\\&quot;7_ENS Explorer Registry\\\&quot; data-base62-sha1=\\\&quot;cyIZHN2x47MeQ0yAo4qaq0nQB1h\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;475\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5806fda975cec9a1f78db216ce828144a1a70333_2_690x475.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5806fda975cec9a1f78db216ce828144a1a70333_2_1035x712.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5806fda975cec9a1f78db216ce828144a1a70333_2_1380x950.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F9FAFA\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e7_ENS Explorer Registry\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1466×1010 110 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/0/0add011a1cb9b5b95caad5fee0ece2c778bda008.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/0add011a1cb9b5b95caad5fee0ece2c778bda008\\\&quot; title=\\\&quot;8_ENS Registry Contract Coding\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0add011a1cb9b5b95caad5fee0ece2c778bda008_2_690x392.jpeg\\\&quot; alt=\\\&quot;8_ENS Registry Contract Coding\\\&quot; data-base62-sha1=\\\&quot;1y6h0bUBlSGfWJtCzfdbHIwRFX2\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;392\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0add011a1cb9b5b95caad5fee0ece2c778bda008_2_690x392.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0add011a1cb9b5b95caad5fee0ece2c778bda008_2_1035x588.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/0add011a1cb9b5b95caad5fee0ece2c778bda008_2_1380x784.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F3F3F2\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e8_ENS Registry Contract Coding\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×1092 126 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThese product and protocol upgrades were a culmination of work across product, design, frontend, and QA over more than six two-week sprints, supported by weekly check-ins, and a design-one-sprint-ahead model. This new team process matters for a launch with this many dependencies.\\u003c/p\\u003e\\n\\u003cp\\u003eFinally, Design and Marketing collaborated on a planned redesign of the ENS Domains website. An early review established what the site needs to communicate in the ENSv2 era and how to make the site feel less like a brochure and more like an explanation of how ENS benefits both individual users and organizations.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-building-reliable-infrastructure-5\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-building-reliable-infrastructure-5\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eBuilding Reliable Infrastructure\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eQ2 Web Engineering work focused on the parts of ENSv2 that users should not have to think about but absolutely depend on: indexing, signing, payment paths, metadata, profile rendering, migration state, and resolver visibility. These are the details that determine whether ENSv2 feels reliable when a user registers, renews, migrates, edits, or shares a name.\\u003c/p\\u003e\\n\\u003cp\\u003eIndexing is one of the clearest examples of the invisible work users depend on without ever seeing. In June, the team selected BigName, an internally built indexer, as the single production indexer for the V4 apps and Coinbase’s Base App at Mainnet launch. ENSv2 needs an indexing layer that can understand ENSv1, ENSv2, and Basenames together, replay changes cleanly, reconstruct historical name state, support verified-mode and provenance as first-class concepts, and remain extensible as the protocol keeps evolving.\\u003c/p\\u003e\\n\\u003cp\\u003eBigName gives us the strongest path because it was built around that model from the start.\\u003c/p\\u003e\\n\\u003cp\\u003eIts Command Query Responsibility Segregation (CQRS) / event-sourced architecture separates immutable raw facts from rebuildable current-state projections, so most changes can be replayed from the event log instead of re-indexing the chain. That gives us cleaner reorg handling, reconstructable name state at past blocks, and one indexing model across ENSv1, ENSv2, and Basenames.\\u003c/p\\u003e\\n\\u003cp\\u003eThe team did assess other options, but each had tradeoffs that made them less suitable for Mainnet. One internal option remains useful as a conformance reference, but it was V2-only, based on an ENSv1-shaped schema, and did not have the event log needed to cover ENSv1 plus Basenames or replay reorgs cleanly. One external option was more production-ready and Subgraph-compatible, but our ideal solution for indexing requires granular replay, historical reconstruction, and per-call verified-mode guarantees. Additionally its current-state model does not provide the same granular replay, historical reconstruction, or per-call verified-mode guarantees that BigName does.\\u003c/p\\u003e\\n\\u003cp\\u003eFor Beta, the existing indexer will stay in place while BigName moves toward ENSv2 Mainnet readiness.\\u003c/p\\u003e\\n\\u003cp\\u003eOther key infrastructure decisions \\u0026amp; progress during Q2:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eApps V2-Readiness:\\u003c/strong\\u003e ENS Manager \\u0026amp; Explorer running against the V2 Sepolia deployment, with the hi-fi redesign, and V2 functionality close to feature-completion.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eService Integrations:\\u003c/strong\\u003e Work included an MVP of the Metadata service, an investigation into gas-sponsorship, Rhinestone integration, and cross-chain settlement for ETH and USDC swapping for name payment.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eWallet Login:\\u003c/strong\\u003e We continue to assess wallet login and credit card payment options against our key requirements, including headless integration, control over Wagmi, and ease of use. This work will continue post v2 as we work to expand the types of users that we can onboard into ENS.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eMaintenance \\u0026amp; Policy:\\u003c/strong\\u003e Work included fixes across Manager/Explorer (records display, My Names owner/manager fields) and CSP/gateway handling.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eThis work also required close coordination with external partners, including Rhinestone on payments and HCA, Crossmint on card checkout, Coinbase on indexer requirements such as batch indexing and Base support, and Rainbow plus others on CSP and gateway resolution issues.\\u003c/p\\u003e\\n\\u003cp\\u003eThe team also worked through several blockers, including HCA/account-abstraction architecture impacting frontend PRs, troubleshooting the App and Explorer environments, and working through an ownership-display issue caused by the V1 subgraph not cleaning up WrappedDomain entities after expired wrapped names were re-registered. Fortunately, the team was able to fix it through the ENS subgraph indexer, reinforcing how much launch readiness depends on the underlying infrastructure behaving reliably before users encounter it.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-ensv2-ecosystem-upgrade-6\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-ensv2-ecosystem-upgrade-6\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENSv2: Ecosystem Upgrade\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eENSv2 launches everywhere that ENS already exists: wallets, apps, exchanges, libraries, developer tools, and the interfaces people use without thinking about the naming infrastructure underneath.\\u003c/p\\u003e\\n\\u003cp\\u003eTo prepare the developer ecosystem this quarter, we focused on that readiness through a structured partner-readiness program, triaging partner support, ensuring they are ready for ENSv2, and unblocking library integrations across \\u003ca href=\\\&quot;https://github.com/ethers-io/ethers.js/blob/main/CHANGELOG.md#ethersv6170-2026-06-17-2350\\\&quot;\\u003eEthers.js v6\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://github.com/ApeWorX/web3.py/pull/3822\\\&quot;\\u003eweb3.py\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://github.com/LFDT-web3j/web3j\\\&quot;\\u003eweb3j\\u003c/a\\u003e, and \\u003ca href=\\\&quot;https://github.com/wealdtech/go-ens\\\&quot;\\u003ego-ens\\u003c/a\\u003e. The work included direct readiness support with teams including MetaMask, Uniswap App, Ledger, Kraken Wallet, OpenSea, Safe, and Aave. On the longer tail, we were able to increase the number of ENSv2 ready repositories on Github from 21% to 38%. Follow \\u003ca href=\\\&quot;https://docs.ens.domains/web/ensv2-readiness/\\\&quot;\\u003ethis guide\\u003c/a\\u003e to make your application ENSv2 ready and reach out in the \\u003ca href=\\\&quot;https://t.me/+8kpICHHvSS81Mzkx\\\&quot;\\u003eENS Developer Telegram group\\u003c/a\\u003e for tailored support and potential co-marketing.\\u003c/p\\u003e\\n\\u003cp\\u003eDocumentation and tooling formed another part of the readiness effort. \\u003ca href=\\\&quot;https://github.com/ensdomains/docs/pull/543\\\&quot;\\u003eENSv2 documentation\\u003c/a\\u003e was prepared ahead of Beta launch, the \\u003ca href=\\\&quot;https://github.com/ensdomains/ens-cli\\\&quot;\\u003eENS CLI\\u003c/a\\u003e was released as a developer preview for agentic workflows, and ENSIP-26 continued to progress alongside the collaboration with GoDaddy on Agent Name Service. The growing need for AI agent identity infrastructure remains a priority as ENS works to maintain a leading role in this emerging space.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the hackathon front, we were able to stress test the builder and developer experience. Across \\u003ca href=\\\&quot;https://ethglobal.com/events/cannes2026/prizes/ens\\\&quot;\\u003eETHGlobal Cannes\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://x.com/ensdomains/status/2054548835884814356\\\&quot;\\u003eETHPrague\\u003c/a\\u003e, ETHCC[9], \\u003ca href=\\\&quot;https://x.com/ethconf/status/2064832798696104210\\\&quot;\\u003eETHConf\\u003c/a\\u003e, and \\u003ca href=\\\&quot;https://x.com/ETHGlobal/status/2066173573874778289\\\&quot;\\u003eETHGlobal New York\\u003c/a\\u003e, we were able to see where builders got excited, where they got stuck, and what needed to become clearer before Mainnet.\\u003c/p\\u003e\\n\\u003cp\\u003eAt \\u003ca href=\\\&quot;https://x.com/ETHGlobal/status/2065585161031262313\\\&quot;\\u003eETHGlobal New York\\u003c/a\\u003e, 44% of teams built on ENS, the highest rate for any Tier 1 in-person hackathon, while the ENS Developers Telegram grew from 600 to 700+ members.\\u003c/p\\u003e\\n\\u003cp\\u003eWinning hackathon projects worth highlighting of this quarter: \\u003ca href=\\\&quot;https://ethglobal.com/showcase/veil-vpn-c643n\\\&quot;\\u003eVeil VPN\\u003c/a\\u003e (Cannes), \\u003ca href=\\\&quot;https://devfolio.co/projects/ethesis-b242\\\&quot;\\u003eETHesis\\u003c/a\\u003e (Prague), \\u003ca href=\\\&quot;https://ethglobal.com/showcase/ghost-in-the-machine-x21o8\\\&quot;\\u003eGhost in the Machine\\u003c/a\\u003e (Cannes), \\u003ca href=\\\&quot;https://ethglobal.com/showcase/kondor-4bvt5\\\&quot;\\u003eKondor\\u003c/a\\u003e (Cannes), \\u003ca href=\\\&quot;https://x.com/ethswarm/status/2054557020859072704\\\&quot;\\u003ePhare\\u003c/a\\u003e (Prague).\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/4/443405052092cb1d96e55ee40cde892a80539d86.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/443405052092cb1d96e55ee40cde892a80539d86\\\&quot; title=\\\&quot;9_ETHGlobal NY 2026\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/443405052092cb1d96e55ee40cde892a80539d86_2_690x385.jpeg\\\&quot; alt=\\\&quot;9_ETHGlobal NY 2026\\\&quot; data-base62-sha1=\\\&quot;9JlV0waXK7OWM3bd81wXQsam5XU\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;385\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/443405052092cb1d96e55ee40cde892a80539d86_2_690x385.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/443405052092cb1d96e55ee40cde892a80539d86_2_1035x577.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/443405052092cb1d96e55ee40cde892a80539d86_2_1380x770.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;B6B1AC\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e9_ETHGlobal NY 2026\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1416×792 256 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/4/45c9d00d355ed40c9eaae7df78dd548db87b9634.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/45c9d00d355ed40c9eaae7df78dd548db87b9634\\\&quot; title=\\\&quot;10_ETHPrague 2026\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/45c9d00d355ed40c9eaae7df78dd548db87b9634_2_690x439.jpeg\\\&quot; alt=\\\&quot;10_ETHPrague 2026\\\&quot; data-base62-sha1=\\\&quot;9XnkhG8t0Nqajslwg8niTqrRcHi\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;439\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/45c9d00d355ed40c9eaae7df78dd548db87b9634_2_690x439.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/45c9d00d355ed40c9eaae7df78dd548db87b9634_2_1035x658.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/45c9d00d355ed40c9eaae7df78dd548db87b9634_2_1380x878.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;5B7470\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e10_ETHPrague 2026\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1408×896 224 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eOur work on ecosystem growth and strategic partnerships connected directly to this readiness effort. We focused on securing commitments from leading wallets and apps that are V2-ready and willing to support a coordinated co-marketing campaign around launch. That coordination only works if the technical work is real, and the technical work lands better when partners are also empowered on how to explain ENSv2 to their own users.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/9d4ee262dbd0391f2b2f3466bb28f85e77a7bd68.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/9d4ee262dbd0391f2b2f3466bb28f85e77a7bd68\\\&quot; title=\\\&quot;11_ETHPrague 2026\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9d4ee262dbd0391f2b2f3466bb28f85e77a7bd68_2_690x457.jpeg\\\&quot; alt=\\\&quot;11_ETHPrague 2026\\\&quot; data-base62-sha1=\\\&quot;mrBYfmxBfGQyxZGTcTUOtAkM6wg\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;457\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9d4ee262dbd0391f2b2f3466bb28f85e77a7bd68_2_690x457.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9d4ee262dbd0391f2b2f3466bb28f85e77a7bd68_2_1035x685.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9d4ee262dbd0391f2b2f3466bb28f85e77a7bd68_2_1380x914.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;1C2B48\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e11_ETHPrague 2026\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1406×932 293 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe quarter reinforced that ENSv2 readiness is both \\u003cem\\u003etechnical\\u003c/em\\u003e and \\u003cem\\u003esocial\\u003c/em\\u003e. Partners need \\u003ca href=\\\&quot;https://docs.ens.domains/resolvers/universal/\\\&quot;\\u003eUniversal Resolver\\u003c/a\\u003e support, but they also need launch calendars, approved messaging, integration confidence, and enough clarity to know what the upgrade unlocks for their users. Getting those pieces to move at the same pace is crucial.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-62104-setting-the-migration-path-for-success-7\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-62104-setting-the-migration-path-for-success-7\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eSetting the Migration Path for Success\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eA protocol upgrade can be technically sound and still fail to land with users if people do not understand what changed or why it matters. Across all teams, Q2 focused on developing the narrative, creative direction, and campaign readiness around ENSv2 so that launch feels like a major protocol milestone, not simply a maintenance notice with new branding.\\u003c/p\\u003e\\n\\u003cp\\u003eTo begin building awareness, we released the \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://x.com/ensdomains/status/2047318067139764693\\\&quot;\\u003eENSv2 explainer video\\u003c/a\\u003e\\u003c/strong\\u003e and published deep dives into the \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-app-deep-dive\\\&quot;\\u003eENS App\\u003c/a\\u003e\\u003c/strong\\u003e and \\u003cstrong\\u003e\\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-explorer-deep-dive\\\&quot;\\u003eENS Explorer\\u003c/a\\u003e\\u003c/strong\\u003e, giving users and developers a substantive preview of the product philosophy behind the two new applications.\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eENS App’s\\u003c/strong\\u003e (\\u003ca href=\\\&quot;https://app.ens.dev/\\\&quot;\\u003ehttps://app.ens.dev/\\u003c/a\\u003e) story is about designing through subtraction: hiding complexity where users do not need it and turning registration and management into flows the system can orchestrate.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eENS Explorer’s\\u003c/strong\\u003e (\\u003ca href=\\\&quot;https://explorer.ens.dev/\\\&quot;\\u003ehttps://explorer.ens.dev/\\u003c/a\\u003e) story is about legibility: surfacing the full state of a name so that the protocol becomes easier to understand, rather than more opaque, as it becomes more powerful.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eGrowth and marketing efforts continued developing the broader ENS narrative in preparation for Beta launch. Including published pieces on \\u003ca href=\\\&quot;https://ens.domains/blog/post/names-are-no-longer-single-objects\\\&quot;\\u003ehierarchical naming\\u003c/a\\u003e, practical \\u003ca href=\\\&quot;https://ens.domains/blog/post/7-ways-to-use-your-ens-name-onchain\\\&quot;\\u003eonchain use cases\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://ens.domains/blog/post/onchain-identity-is-becoming-public-infrastructure\\\&quot;\\u003eonchain identity as public infrastructure\\u003c/a\\u003e, and how ENS is the extension into the digital world for \\u003ca href=\\\&quot;https://ens.domains/blog/post/why-humans-name-everything\\\&quot;\\u003ewhy humans name everything\\u003c/a\\u003e. These pieces help explain why ENSv2 is not only about a new set of contracts, but about making ENS more capable as the coordination layer for identity across the internet.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also prioritized IRL events this quarter to continue building the hype for ENSv2.\\u003c/p\\u003e\\n\\u003cp\\u003eWe were the title sponsor of \\u003ca href=\\\&quot;https://globalpizza.party/partners/ens\\\&quot;\\u003ePizzaDAO’s Global Pizza Day\\u003c/a\\u003e, with 32,000+ RSVPs and more than 370 official events worldwide, over 1 million impressions, and 6,400 wallets submitted to receive ENS subnames.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also showed up at the Agentic Finance Summit, ETHConf, and \\u003ca href=\\\&quot;https://x.com/irl_energy/status/2064729828251873315\\\&quot;\\u003eRefraction’s IRL Tour\\u003c/a\\u003e, with a mix of cultural reach, technical partner work, and institution-facing conversations. Check out Katherine’s talk at ETHConf in June on the \\u003ca href=\\\&quot;https://www.youtube.com/watch?v=yaGEt40NWN4\\\&quot;\\u003eNext Era of ENS\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca c
