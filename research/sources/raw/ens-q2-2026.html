er\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:58065,\&quot;name\&quot;:\&quot;Katherine Wu\&quot;,\&quot;username\&quot;:\&quot;katherine.eth\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discuss.ens.domains/katherine.eth/{size}/7729_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-07-11T14:58:30.831Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003ch1\\u003e\\u003ca name=\\\&quot;p-58065-ens-labs-quarterly-report-q2-2025-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-ens-labs-quarterly-report-q2-2025-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS Labs\\u003c/strong\\u003e \\u003cstrong\\u003eQuarterly Report - Q2 2025\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-abstract-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-abstract-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eAbstract\\u003c/h2\\u003e\\n\\u003cp\\u003eQ2 2025 marked a steady shift from planning to execution. With the core ENSv2 contracts now complete and key infrastructure like the Universal Resolver and ENSv2 SDK shipped, the foundation for Namechain is solidifying. Work is now underway to prepare for audits, finalize cross-chain functionality, and build developer tools that make the transition from ENSv1 to ENSv2 seamless.\\u003c/p\\u003e\\n\\u003cp\\u003eIn parallel, the Product and Design teams kicked off two new apps that will define the ENSv2 user experience; these will be launched with the mainnet release of ENSv2. In Q2, we also built the ENSv2 Hub, the new L2 Primary Names app, and our first fully wireframed Manager interface, signaling clear movement from concept to implementation.\\u003c/p\\u003e\\n\\u003cp\\u003eBeyond the code, we are continuing to deepen our presence in the ecosystem—from our integration with dSheets, to participation at ETHGlobal Taipei, ETHPrague, and ICANN83. Community engagement, education, and real-world use cases remain a key focus as we lay the groundwork for ENSv2 adoption later this year.\\u003c/p\\u003e\\n\\u003cp\\u003eQ3 will be about tightening the path to launch: finalizing audits, preparing migration tools, and expanding integration support. The work continues, and we are excited heading into H2 of 2025 with so much momentum.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-team-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-team-3\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eTeam\\u003c/h2\\u003e\\n\\u003cp\\u003eAs of Q2 end, the ENS Labs team sits at 31 full-time hires. We made critical hires this quarter across DevRel, Product, and Engineering. We are continuously hiring for the team, and if you are excited about ENS and the work that we are doing here at Labs, please consider \\u003ca href=\\\&quot;https://www.enslabs.org/jobs\\\&quot;\\u003ejoining us\\u003c/a\\u003e!\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-growth-ecosystem-community-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-growth-ecosystem-community-4\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eGrowth, Ecosystem \\u0026amp; Community\\u003c/h2\\u003e\\n\\u003cp\\u003eWhile engineering efforts are fully-focused on building ENSv2, our growth, ecosystem, and community efforts were to 1) create more compelling visual tutorial content to help solve existing user pain-points; 2) create integration case studies to support our efforts to expand ENS integrations with fintech and web3 apps; 3) create a new ENSv2 hub to help answer users questions around migration to Namechain and build excitement for an all new ENS app experiences; 4) double-down on our ICANN strategy ahead of the 2026 gTLD round.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eGrowth Indicators\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eIn Q2 2025, renewals overtook registrations as the primary source of revenue (ETH), which remains stable over Q1 2025.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/f/f3310cd7361f538fcb3c5d0ff57303892c83753d.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/f3310cd7361f538fcb3c5d0ff57303892c83753d\\\&quot; title=\\\&quot;ETH registrations numbers\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f3310cd7361f538fcb3c5d0ff57303892c83753d_2_666x500.png\\\&quot; alt=\\\&quot;ETH registrations numbers\\\&quot; data-base62-sha1=\\\&quot;yHn77i0JWBem7YPql7TOC1bK6zb\\\&quot; width=\\\&quot;666\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f3310cd7361f538fcb3c5d0ff57303892c83753d_2_666x500.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f3310cd7361f538fcb3c5d0ff57303892c83753d_2_999x750.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f3310cd7361f538fcb3c5d0ff57303892c83753d_2_1332x1000.png 2x\\\&quot; data-dominant-color=\\\&quot;EBF5F0\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eETH registrations numbers\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e2400×1800 167 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cem\\u003e(Source: \\u003ca href=\\\&quot;https://dune.com/ethereumnameservice/ens\\\&quot;\\u003ehttps://dune.com/ethereumnameservice/ens\\u003c/a\\u003e)\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eSubnames continue to be a key driver of ENS name proliferation across the ecosystem, and we’re actively working to onboard additional subname adoption partners in the coming quarters.\\u003c/p\\u003e\\n\\u003cp\\u003eLooking ahead, the proposed new .eth registrar controller introduces support for a referrer field on registration and renewal transactions. (More on this under “Protocol Updates”). This lays the groundwork for potential referral programs and may influence registration and renewal activity in the quarters to come. We’ll be monitoring closely and welcome any new integration partners to take advantage of this feature.\\u003c/p\\u003e\\n\\u003ch4\\u003e\\u003ca name=\\\&quot;p-58065-events-community-highlight-5\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-events-community-highlight-5\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eEvents \\u0026amp; Community Highlight\\u003c/strong\\u003e\\u003c/h4\\u003e\\n\\u003cp\\u003eENS integrated with Fileverse’s new product, \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1935005091842637931\\\&quot;\\u003edSheets\\u003c/a\\u003e—a decentralized spreadsheet built for the open internet. ENS names can now be used to read, write, and collaborate on onchain data directly from a spreadsheet interface. From querying smart contracts to pulling transaction history for names like vitalik.eth, dSheets brings onchain data to life using familiar spreadsheet functions—all while respecting privacy, permissioning, and user ownership.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/2/2b6137504a4e2684e3ea39e6cb36193ee7e80a5f.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/2b6137504a4e2684e3ea39e6cb36193ee7e80a5f\\\&quot; title=\\\&quot;fileverse\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2b6137504a4e2684e3ea39e6cb36193ee7e80a5f_2_396x500.jpeg\\\&quot; alt=\\\&quot;fileverse\\\&quot; data-base62-sha1=\\\&quot;6bKOzxgtwYWD1vZeX7a6z2kiz2D\\\&quot; width=\\\&quot;396\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2b6137504a4e2684e3ea39e6cb36193ee7e80a5f_2_396x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2b6137504a4e2684e3ea39e6cb36193ee7e80a5f_2_594x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2b6137504a4e2684e3ea39e6cb36193ee7e80a5f_2_792x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;9E9E9D\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003efileverse\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1186×1496 140 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eOn the IRL events front, jefflau.eth took the stage at ETHGlobal Taipei / Pragma Taipei to share the future vision for ENS in a 20- min talk titled “\\u003ca href=\\\&quot;https://www.youtube.com/watch?v=ZxlSkxCmB2o\\\&quot;\\u003eThe Future of ENS- What Namechain Unlocks\\u003c/a\\u003e”. At the subsequent ETHGlobal Taipei Hackathon, 11.5% of all 244 submitted hackathon projects integrated ENS. In May, mely.eth attended ETHPrague and gave a talk titled “\\u003ca href=\\\&quot;https://www.youtube.com/watch?v=MHtROWyI-oo\\\&quot;\\u003eFrom Domains to Usernames\\u003c/a\\u003e,” exploring how ENS is evolving as a user identity layer.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/2/2e8f8b96778588cc42588caaba0c02fa3353de92.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/2e8f8b96778588cc42588caaba0c02fa3353de92\\\&quot; title=\\\&quot;jeff\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2e8f8b96778588cc42588caaba0c02fa3353de92_2_690x374.jpeg\\\&quot; alt=\\\&quot;jeff\\\&quot; data-base62-sha1=\\\&quot;6DTvuz9F2H0jYhumqQbfnMctSDM\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;374\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2e8f8b96778588cc42588caaba0c02fa3353de92_2_690x374.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2e8f8b96778588cc42588caaba0c02fa3353de92_2_1035x561.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/2e8f8b96778588cc42588caaba0c02fa3353de92_2_1380x748.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;B1A7A2\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003ejeff\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×1042 84.4 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/2/258dc08a3073d3e5cd243d5bb4b4a7da364ee80e.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/258dc08a3073d3e5cd243d5bb4b4a7da364ee80e\\\&quot; title=\\\&quot;mely talk\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/258dc08a3073d3e5cd243d5bb4b4a7da364ee80e_2_690x460.jpeg\\\&quot; alt=\\\&quot;mely talk\\\&quot; data-base62-sha1=\\\&quot;5mdmS2S7YSubZ6Lu32TWeETdmKa\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;460\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/2/258dc08a3073d3e5cd243d5bb4b4a7da364ee80e_2_690x460.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/258dc08a3073d3e5cd243d5bb4b4a7da364ee80e_2_1035x690.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/2/258dc08a3073d3e5cd243d5bb4b4a7da364ee80e_2_1380x920.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;33323F\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003emely talk\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×1280 133 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eLooking ahead to Q3, we hope to continue to expand our IRL presence—attending EthCC, EthGlobal New Delhi, EthAccura, and a few others. We are also cooking up plans for DevConnect in Buenos Aries at the end of this year. There’ll be more to come, and we hope to see you all IRL in the meantime!\\u003c/p\\u003e\\n\\u003ch4\\u003e\\u003ca name=\\\&quot;p-58065-ens-at-icann-in-prague-6\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-ens-at-icann-in-prague-6\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS at ICANN in Prague\\u003c/strong\\u003e\\u003c/h4\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/6/64983bb83a8273695d2f09826baa88993a1a4051.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/64983bb83a8273695d2f09826baa88993a1a4051\\\&quot; title=\\\&quot;icann prague\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/64983bb83a8273695d2f09826baa88993a1a4051_2_666x500.jpeg\\\&quot; alt=\\\&quot;icann prague\\\&quot; data-base62-sha1=\\\&quot;elTU88wVTcxqgAA47e5SpmmEu0V\\\&quot; width=\\\&quot;666\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/6/64983bb83a8273695d2f09826baa88993a1a4051_2_666x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/64983bb83a8273695d2f09826baa88993a1a4051_2_999x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/6/64983bb83a8273695d2f09826baa88993a1a4051_2_1332x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;93ABC1\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eicann prague\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×1440 212 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eENS Labs had the chance to attend the \\u003ca href=\\\&quot;https://meetings.icann.org/en/meetings/icann83/\\\&quot;\\u003eICANN Policy Forum in Prague\\u003c/a\\u003e this June. These meetings bring together registries, registrars, Registry Service Providers(“RSP”), and ICANN groups like the Governmental Advisory Committee (“GAC”) to talk policy. Throughout the week, the team held productive conversations with dozens of current and prospective partners across the domain name ecosystem, including registries, registrars, policy organizations, and root server operators.\\u003c/p\\u003e\\n\\u003cp\\u003eOn a macro note, market activity is clearly picking up with the next round of gTLDs just around the corner in April 2026. The US caused a bit of a \\u003ca href=\\\&quot;https://domainincite.com/31117-us-government-opposes-most-new-gtlds\\\&quot;\\u003estir\\u003c/a\\u003e by urging caution on new gTLDs, pointing to the rise in global phishing. Overall sentiment toward crypto remains skeptical, but many were optimistic and saw it as a path to business growth. Those familiar with ENS respected our approach to engaging with ICANN, but the idea of full self-sovereignty is still a tough sell for some, especially those coming from a traditional IP mindset.\\u003c/p\\u003e\\n\\u003cp\\u003eThat being said, our consistent adherence to DNS norms and ICANN policies, including early and proactive engagement on name collision issues, has built meaningful credibility within the community. We are particularly encouraged by the forthcoming new gTLD program, which represents a unique opportunity to embrace the traditional DNS within the context. We believe that, with the right alignment, this initiative will lay the foundation for a single, unified internet.\\u003c/p\\u003e\\n\\u003cp\\u003eENS Labs remains committed to engaging constructively within the ICANN ecosystem. We look forward to continued collaboration and helping to shape a global naming infrastructure that is inclusive, resilient, and onchain. This is a multi-year effort that does not stop in April 2026, and we will continue to work with registries, registrars, and RSPs to find ways to integrate with ENS into the full DNS stack.\\u003c/p\\u003e\\n\\u003ch4\\u003e\\u003ca name=\\\&quot;p-58065-ens-at-the-united-nations-7\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-ens-at-the-united-nations-7\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS at the United Nations\\u003c/strong\\u003e\\u003c/h4\\u003e\\n\\u003cp\\u003eIn April, Alex Urbelis spoke at the \\u003ca href=\\\&quot;https://www.wipo.int/amc/en/events/workshops/2025/domainname/#:~:text=In%20celebration%20of%20the%2025th%20anniversary%20of%20the,Headquarters%20in%20Geneva%2C%20Switzerland%20on%20April%2023%2C%202025.\\\&quot;\\u003e25th Anniversary\\u003c/a\\u003e of the Uniform Domain-Name Dispute-Resolution Policy \\u003ca href=\\\&quot;https://www.icann.org/en/contracted-parties/consensus-policies/uniform-domain-name-dispute-resolution-policy/uniform-domain-name-dispute-resolution-policy-01-01-2020-en\\\&quot;\\u003e(UDRP\\u003c/a\\u003e) hosted by World Intellectual Property Organization (\\u003ca href=\\\&quot;https://www.wipo.int/amc/en/domains/guide/\\\&quot;\\u003eWIPO\\u003c/a\\u003e) in Geneva, Switzerland. As we prepare to apply for several strings in ICANN’s upcoming new gTLD program, ENS Labs is ready to fully comply with UDRP in all of its ICANN-authorized TLDs. However, we also believe that future rights protection mechanisms in Web3 should reflect the people, processes, and philosophy of Web3 systems. That is, rights protection mechanisms should evolve to be onchain, community-driven, and openly discussed within organizations like the ENS DAO. For a deeper dive on the topic, check out the \\u003ca href=\\\&quot;https://ens.domains/blog/post/how-ens-is-rethinking-brands-and-ip-in-web3\\\&quot;\\u003eblog post\\u003c/a\\u003e authored by Alex.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/e/e07d5363ce0a21a9eb9c111d41476c10c5595009.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/e07d5363ce0a21a9eb9c111d41476c10c5595009\\\&quot; title=\\\&quot;urbelis\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e07d5363ce0a21a9eb9c111d41476c10c5595009_2_690x388.jpeg\\\&quot; alt=\\\&quot;urbelis\\\&quot; data-base62-sha1=\\\&quot;w1VsG17tYURSdi79QogWpBYf5gJ\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;388\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e07d5363ce0a21a9eb9c111d41476c10c5595009_2_690x388.jpeg, https://discuss.ens.domains/uploads/db9688/original/2X/e/e07d5363ce0a21a9eb9c111d41476c10c5595009.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/e/e07d5363ce0a21a9eb9c111d41476c10c5595009.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;735F4A\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eurbelis\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e800×450 82.6 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch4\\u003e\\u003ca name=\\\&quot;p-58065-social-8\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-social-8\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eSocial\\u003c/strong\\u003e\\u003c/h4\\u003e\\n\\u003cp\\u003eOur social strategy this quarter included daily tutorials to help existing users understand all the features of ENS, as well as to motivate new users to register a name for the first time. In reviewing customer support tickets over the last 6 months, we noticed a significant trend: nearly half of all tickets were from users wanting “guidance”, “how-to”, or “general” guides on certain actions—like registering a name, sending a name, changing owners, importing DNS, and so on. For this reason, we emphasized posts that visually show how to do things in the ENS app, as well as use ENS in other apps like PayPal or Venmo.\\u003c/p\\u003e\\n\\u003cp\\u003eSo far, data on X supports that visual tutorials are having a positive impact:\\u003c/p\\u003e\\n\\u003cp\\u003eVideo views: 26.1K—up 67%\\u003c/p\\u003e\\n\\u003cp\\u003eMedia views: 32.3K—up 61%\\u003c/p\\u003e\\n\\u003cp\\u003eReposts: 2.3K—up 3%\\u003c/p\\u003e\\n\\u003cp\\u003eBookmarks: 677—up 63%\\u003c/p\\u003e\\n\\u003cp\\u003eShares: 77—up 54%\\u003c/p\\u003e\\n\\u003cp\\u003eOur videos are getting significantly more attention, helping audiences who prefer to learn through visual aids. People are sharing our content more, trying to help their own audiences, and interestingly, people are bookmarking our content more as well, presumably to reference it in the future when they want to take a particular ENS action. All of this points to signs that audience engagement with our media content is up, meaning we’re reaching a more engaged audience with higher quality content.\\u003c/p\\u003e\\n\\u003ch4\\u003e\\u003ca name=\\\&quot;p-58065-content-9\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-content-9\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eContent\\u003c/strong\\u003e\\u003c/h4\\u003e\\n\\u003cp\\u003eThis quarter, we updated the Ecosystem page on \\u003ca href=\\\&quot;https://ens.domains/\\\&quot;\\u003eens.domains\\u003c/a\\u003e to help surface real integration examples with some of our biggest partners. While the page previously showcased partner logos, it lacked direct links to case studies that walk through specific implementations. We recognized the need to make these examples more discoverable, especially for teams exploring how to integrate ENS based on their use case.\\u003c/p\\u003e\\n\\u003cp\\u003eTo kick things off, we published our first official case study with \\u003ca href=\\\&quot;https://ens.domains/ecosystem/uniswap\\\&quot;\\u003eUniswap\\u003c/a\\u003e—a strong example of what ENS can enable at scale. In the coming weeks, we’ll be adding several more case studies to the page, each highlighting different categories of integration: search/identity, domain registrars, payments, and crypto wallets. This will give both partners and the broader ecosystem clearer reference points for how ENS is being used in the wild. We plan to release more case studies in the weeks to come, and hope that these case studies can showcase the full power of ENS names across our integration partners.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/7/7d32109bb27bd685ece04e8d411a73e36688a45a.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/7d32109bb27bd685ece04e8d411a73e36688a45a\\\&quot; title=\\\&quot;uniswap case study\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7d32109bb27bd685ece04e8d411a73e36688a45a_2_530x499.jpeg\\\&quot; alt=\\\&quot;uniswap case study\\\&quot; data-base62-sha1=\\\&quot;hRwWJrXmOsDNEOdyjz1vZaExkp4\\\&quot; width=\\\&quot;530\\\&quot; height=\\\&quot;499\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7d32109bb27bd685ece04e8d411a73e36688a45a_2_530x499.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7d32109bb27bd685ece04e8d411a73e36688a45a_2_795x748.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/7d32109bb27bd685ece04e8d411a73e36688a45a_2_1060x998.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;83536B\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003euniswap case study\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1176×1108 166 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eENSv2 Hub\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWe also announced the updated \\u003ca href=\\\&quot;https://ens.domains/ensv2\\\&quot;\\u003eENSv2 Hub\\u003c/a\\u003e on ens.domains, the first major step in surfacing what’s coming in ENSv2 beyond Namechain. Until now, most of the conversation around v2 has been limited or abstract. This hub marks the beginning of a more public, concrete narrative around the protocol’s next evolution.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/9fbbb4884cd4b03c64377756b134048074128a40.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/9fbbb4884cd4b03c64377756b134048074128a40\\\&quot; title=\\\&quot;brand v2\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9fbbb4884cd4b03c64377756b134048074128a40_2_666x500.jpeg\\\&quot; alt=\\\&quot;brand v2\\\&quot; data-base62-sha1=\\\&quot;mN44BNbBcmv77SjLiwnWUUFXCko\\\&quot; width=\\\&quot;666\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9fbbb4884cd4b03c64377756b134048074128a40_2_666x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9fbbb4884cd4b03c64377756b134048074128a40_2_999x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9fbbb4884cd4b03c64377756b134048074128a40_2_1332x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;94BFD5\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003ebrand v2\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×1440 265 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe ENSv2 Hub is designed to be a living resource. It outlines what ENSv2 is, why it matters, and what’s changing—including a high-level roadmap, early product previews, and technical context for developers and users. It’s also the first time we’ve publicly teased the upcoming manager and portal apps, giving the community a first glimpse of the new interfaces in development.\\u003c/p\\u003e\\n\\u003cp\\u003eAs more of the product moves from design into build, the hub will continue to grow and serve as a central, up-to-date destination for everything related to ENSv2. This is a foundational moment to reintroduce the broader goals of v2, and the hub helps position us to share updates more transparently as we build in the open.\\u003c/p\\u003e\\n\\u003ch4\\u003e\\u003ca name=\\\&quot;p-58065-press-10\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-press-10\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003ePress\\u003c/strong\\u003e\\u003c/h4\\u003e\\n\\u003cp\\u003eIn Q2 2025, ENS was featured in 6 pieces of earned coverage with an estimated 54.9K views. Highlights include:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eNick guest featured on \\u003ca href=\\\&quot;https://www.youtube.com/watch?v=LW4fPfoQeAo\\u0026amp;themeRefresh=1\\\&quot;\\u003eThe Epicenter Podcast\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003eNick’s commentary on the ETH Pectra upgrade was included in \\u003ca href=\\\&quot;https://thedefiant.io/news/blockchains/ethereum-rebound-is-thanks-to-pectra\\\&quot;\\u003eThe Defiant\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003eAlex Urbelis had interviews with Fortune and CoinDesk on the Virgil Griffith release\\u003c/li\\u003e\\n\\u003cli\\u003eJames Beck’s interview on L2s was featured in \\u003ca href=\\\&quot;https://cointelegraph.com/news/layer-2s-good-for-ethereum-or-extractive\\\&quot;\\u003eCointelegraph\\u003c/a\\u003e and he guest featured on an X spaces with WenALTSeason (Pt 2)\\u003c/li\\u003e\\n\\u003cli\\u003eMakoto’s interview on Namechain was featured in \\u003ca href=\\\&quot;https://www.eblockmedia.com/news/articleView.html?idxno=18013#google_vignette\\\&quot;\\u003eBlockmedia\\u003c/a\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eAs always, we are open to feedback on what other educational topics you’d like to see from us on anything ENS-related!\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-product-design-updates-11\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-product-design-updates-11\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eProduct \\u0026amp; Design Updates\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ2 began with a weeklong product and engineering offsite in Taiwan, where the team kicked off work on two new apps. Design shared research on audience needs and what was achievable by year-end, aligning with Product and Engineering to define a shared roadmap and timelines.\\u003c/p\\u003e\\n\\u003cp\\u003eFor the Manager app, we restructured navigation around user tasks (e.g., “Edit Profile” before “Choose Name”), creating a more intuitive experience aligned with user mental models. For the Portal app, we trimmed scope to focus on core functionality that complements the Manager.\\u003c/p\\u003e\\n\\u003cp\\u003eWorking closely with Engineering, we defined the Hidden Contract Account (HCA) strategy for seamless cross-chain interactions and mapped out how HCAs will function in-app. With IAs (Information Architecture) and HCAs in place, we built full wireframes for the Manager and made strong progress on key Portal flows.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also launched the ENSv2 Hub (mentioned in Content section), completed the new L2 Primary Names app (releasing imminently—more on this in the Protocol section), and welcomed a dedicated brand designer who has been elevating our visual identity across all assets, including animations, UI patterns, and branding visible in the new Hub.\\u003c/p\\u003e\\n\\u003cp\\u003eIn Q2, we continued exploring the ENS rebrand, focusing on creating a more robust and flexible visual system that can adapt to different audiences and contexts. This work lays the groundwork for future brand expressions (especially in physical spaces) and opens the door for more creative executions of how to extend the ENS Brand moving forward. To celebrate ENS’s 8th birthday, we released a 3D animation that pushed the boundaries of our current branding system and offered a glimpse into what more immersive brand work could look like. \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1919080188803264795\\\&quot;\\u003eWatch it here\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/a/aac6f422ff096e7625fa03809c5ad5530056ced7.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/aac6f422ff096e7625fa03809c5ad5530056ced7\\\&quot; title=\\\&quot;Screenshot 2025-07-11 at 10.46.33 AM\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/aac6f422ff096e7625fa03809c5ad5530056ced7_2_690x494.jpeg\\\&quot; alt=\\\&quot;Screenshot 2025-07-11 at 10.46.33 AM\\\&quot; data-base62-sha1=\\\&quot;omLqqpjX4ZX6KhdZcMW0Yivkhev\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;494\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/aac6f422ff096e7625fa03809c5ad5530056ced7_2_690x494.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/aac6f422ff096e7625fa03809c5ad5530056ced7_2_1035x741.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/a/aac6f422ff096e7625fa03809c5ad5530056ced7.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;C4A9AE\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eScreenshot 2025-07-11 at 10.46.33 AM\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1272×912 126 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-engineering-updates-web-12\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-engineering-updates-web-12\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eEngineering Updates- Web\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ2 saw substantial progress on both ENSv1 and ENSv2, with new infrastructure, tooling, and frontend improvements shipping across the board.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the ENSv2 side, we’ve implemented an uptime monitor for CCIP-Read gateways, including automated email alerts—critical infrastructure, as these gateways will be core to future ENS resolution. Work is also well underway on the next version of \\u003ca href=\\\&quot;https://github.com/ensdomains/ensjs/pull/230\\\&quot;\\u003eENSjs\\u003c/a\\u003e, our developer library for interacting with the protocol, as well as early-stage prototyping and finalizing of tech stack decisions for upcoming apps.\\u003c/p\\u003e\\n\\u003cp\\u003eBehind the scenes, we’ve completed a local devnet environment with deployed Namechain contracts and mocked cross-chain interactions, giving us a strong foundation for testing. We also now publish a Docker image of Namechain on every main branch merge, making it easier for external developers to spin up ENSv2 contracts locally.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the ENSv1 side, we’ve been working on a standalone app for managing L2 primary names, expected to launch next quarter. Frontend work included cleaned-up animations on ens.domains, and better automated testing support for Safe wallets. We also extracted our test environment into a standalone project, helping streamline usage across internal apps and making it easier for external contributors to build against. Our test infra has now moved from relying on The Graph to using Namehash Labs’ ENS Node, which lays the groundwork for migrating the live Manager app (and eventually the new v2 apps) to this more performant backend.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also migrated RPCs used in our apps from Infura to dRPC, for improved reliability and performance.\\u003c/p\\u003e\\n\\u003cp\\u003eA number of frontend bugs were also addressed this quarter, including:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eThe “Extend” modal not loading properly when logged out\\u003c/li\\u003e\\n\\u003cli\\u003eCross-device login issues with Para’s “Connect” button on mobile\\u003c/li\\u003e\\n\\u003cli\\u003eA bug where entering a name in the search box would append an extra “.eth”\\u003c/li\\u003e\\n\\u003cli\\u003eFixes for toast interactivity and styling, dropdowns, and injected wallet support in Safari\\u003c/li\\u003e\\n\\u003cli\\u003eSeveral Safe Wallet issues related to gas estimation and transaction labeling\\u003c/li\\u003e\\n\\u003cli\\u003eMoonpay credit card modals not loading correctly\\u003c/li\\u003e\\n\\u003cli\\u003eA glitch with the premium graph UI on hover\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eFinally, we made a few important security upgrades, including improvements to our automated CSP monitoring and enhanced DNS configuration across ENS-owned domains to strengthen email security.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-engineering-updates-protocol-13\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-engineering-updates-protocol-13\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eEngineering Updates- Protocol\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eENSv2\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAll core ENSv2 contracts are now complete! These new contracts would cover everything needed to support standalone deployments on both L1 and L2. There is still some remaining work we will focus on completing in the coming weeks, including real cross-chain messaging for Linea (currently mocked in dev environments) and migration contracts to facilitate the transition from V1 to V2. As we head into Q3, we will also look to secure a reputable auditor to begin the audit process so that the full audit may be completed by year-end.\\u003c/p\\u003e\\n\\u003cp\\u003eAdditionally: the \\u003ca href=\\\&quot;https://github.com/ensdomains/namechain/\\\&quot;\\u003eENSv2 SDK\\u003c/a\\u003e is out! The devnet script will allow for developers to run L1 and L2 testnets with a single command, providing a stable development and testing environment for those who wish to build on ENSv2.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eENS Core Development\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eA new version of the Universal Resolver was released this quarter, with a stable interface guaranteed across the V1 to V2 transition. This means developers and integrators can safely update to the latest version now, and once V2 launches, migrating will be as simple as updating the contract address. See the implementation contract \\u003ca href=\\\&quot;https://github.com/ensdomains/ens-contracts/blob/staging/contracts/universalResolver/UniversalResolver.sol\\\&quot;\\u003ehere\\u003c/a\\u003e and the proxy \\u003ca href=\\\&quot;https://github.com/ensdomains/namechain/blob/main/contracts/src/universalResolver/UpgradableUniversalResolverProxy.sol\\\&quot;\\u003ehere\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also put up an \\u003ca href=\\\&quot;https://discuss.ens.domains/t/executable-enable-l2-reverse-registrars-and-new-eth-registrar-controller/20969\\\&quot;\\u003eexecutable proposal\\u003c/a\\u003e this quarter that will enable a new .eth register controller. This will allow for a few key features, namely:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eSetting a default primary name across all chains at registration time (L2 Primary Name support). ENS primary names are currently only officially supported on Ethereum Mainnet. With this launch, primary names will be supported on multiple L2s, which would make it possible for developers and users to have an end-to-end experience with ENS on L2 networks. The five chains we are launching L2 primary names are Arbitrum, Base, Linea, OP Mainnet and Scroll.\\n\\u003cul\\u003e\\n\\u003cli\\u003eA referer field in registrations and renewals, enabling the potential for DAO referer programs in the future.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eWe believe that this proposal will serve as a major step towards better UX in cross-chain interoperability, and hope to have your support in the upcoming executable vote. Upon a successful result in the vote, we will launch the new app for L2 primary names and look forward to hearing feedback and sharing learnings next quarter!\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-financial-reporting-14\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-financial-reporting-14\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eFinancial Reporting\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/5/5132fe786d20b19c02cea473c265c334fe6262b5.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/5132fe786d20b19c02cea473c265c334fe6262b5\\\&quot; title=\\\&quot;Screenshot 2025-07-11 at 10.52.51 AM\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5132fe786d20b19c02cea473c265c334fe6262b5_2_690x336.jpeg\\\&quot; alt=\\\&quot;Screenshot 2025-07-11 at 10.52.51 AM\\\&quot; data-base62-sha1=\\\&quot;bAjVCeuARm4FnVDv1TRdpsZIFTf\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;336\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5132fe786d20b19c02cea473c265c334fe6262b5_2_690x336.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5132fe786d20b19c02cea473c265c334fe6262b5_2_1035x504.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5132fe786d20b19c02cea473c265c334fe6262b5_2_1380x672.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;F0F0F0\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eScreenshot 2025-07-11 at 10.52.51 AM\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1808×882 179 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-58065-income-15\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-income-15\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIncome\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eAs of Q2 close, we have received $4,810,136.98 USDC from the ENS DAO.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-58065-expenses-16\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-expenses-16\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eExpenses\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eOur total expenses for Q2 2025 totaled $1,491,055.06. The top three expense categories were:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eEmployee Compensation \\u0026amp; Benefits\\u003c/strong\\u003e (67.9%) which reflects our exciting +21% (+6) growth in headcount (full-time, contractors, intern) in Q2.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eProfessional Services\\u003c/strong\\u003e (17.0%) includes our third-party providers supporting our Accounting, Legal \\u0026amp; Compliance, and Recruiting \\u0026amp; Hiring services.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eIT \\u0026amp; Software Hosting\\u003c/strong\\u003e (4.7%) spanning across our Operational and Engineering software service providers.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eTo date, we have been running operations and runway as conservative as possible as we do expect an uptick in Q3 and Q4 as infrastructure costs ramp up with ENSV2 development (including third party vendors across the chain stack, audits, etc).\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/9ec9a6464a1d23a1911ea1743e59076f920e3cbc.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/9ec9a6464a1d23a1911ea1743e59076f920e3cbc\\\&quot; title=\\\&quot;Screenshot 2025-07-11 at 10.53.03 AM\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9ec9a6464a1d23a1911ea1743e59076f920e3cbc_2_690x433.jpeg\\\&quot; alt=\\\&quot;Screenshot 2025-07-11 at 10.53.03 AM\\\&quot; data-base62-sha1=\\\&quot;mEHthXpl51p1RQIp4jbprLnOSrq\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;433\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9ec9a6464a1d23a1911ea1743e59076f920e3cbc_2_690x433.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9ec9a6464a1d23a1911ea1743e59076f920e3cbc_2_1035x649.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9ec9a6464a1d23a1911ea1743e59076f920e3cbc_2_1380x866.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;C9CED2\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eScreenshot 2025-07-11 at 10.53.03 AM\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1822×1146 129 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-58065-closing-17\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-58065-closing-17\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eClosing\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eQ2 was a quarter of real momentum. We finalized core ENSv2 contracts (including a local devnet environment with deployed Namechain contracts), launched the Universal Resolver and cross-chain reverse resolution, and laid the groundwork for ENSv2 audits and migration. On the product side, we kicked off two new apps, completed the L2 Primary Names app, and launched the ENSv2 Hub to begin telling the story of what’s coming.\\u003c/p\\u003e\\n\\u003cp\\u003eBrand, content, and community efforts also ramped up—highlighted by new integrations, case studies, stronger performance across social, and continued presence at global events like ETHGlobal and ICANN.\\u003c/p\\u003e\\n\\u003cp\\u003eAs we head into Q3, our focus is clear: wrap remaining ENSv2 engineering work, initiate audits, support partners and devs building on v2, and continue to educate users on what’s ahead. As always, we deeply appreciate your ongoing support and trust as we work towards ENSv2.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:8,\&quot;updated_at\&quot;:\&quot;2025-07-11T14:58:30.831Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:233,\&quot;reads\&quot;:70,\&quot;readers_count\&quot;:69,\&quot;score\&quot;:1514.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:20565,\&quot;topic_slug\&quot;:\&quot;ens-labs-quarterly-progress-reports\&quot;,\&quot;display_username\&quot;:\&quot;Katherine Wu\&quot;,\&quot;primary_group_name\&quot;:\&quot;delegates\&quot;,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://www.enslabs.org/jobs\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Careers | ENS Labs\&quot;,\&quot;clicks\&quot;:9},{\&quot;url\&quot;:\&quot;https://dune.com/ethereumnameservice/ens\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:8},{\&quot;url\&quot;:\&quot;https://ens.domains/ensv2\&quot;,\&quot;internal\&quot;:false,\&quot;reflectio -15-25/21046\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;ENS DAO Newsletter #91 — 07/15/25\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Delegate\&quot;,\&quot;title_is_group\&quot;:true,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:18}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:7836,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/ens-labs-quarterly-progress-reports/20565/4\&quot;,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:9},{\&quot;id\&quot;:\&quot;fire\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:7},{\&quot;id\&quot;:\&quot;+1\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:1},{\&quot;id\&quot;:\&quot;rocket\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:1}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:18,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:59259,\&quot;name\&quot;:\&quot;Katherine Wu\&quot;,\&quot;username\&quot;:\&quot;katherine.eth\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discuss.ens.domains/katherine.eth/{size}/7729_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-10-16T20:33:31.951Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003ch1\\u003e\\u003ca name=\\\&quot;p-59259-ens-labs-quarterly-report-q3-2025-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-ens-labs-quarterly-report-q3-2025-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eENS Labs Quarterly Report - Q3 2025\\u003c/h1\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-abstract-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-abstract-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eAbstract\\u003c/h2\\u003e\\n\\u003cp\\u003eQ3 continues to build on the momentum from 1H2025 and was marked by strong execution and significant cross-team alignment. Across Product, DevRel, Design, and Engineering, we made tangible progress on the core mission that has guided ENS from the beginning: building a human-readable, decentralized identity system for Ethereum. Legal, Operations, and Growth worked in lockstep to prepare for the next phase of maturity for ENS Labs, while our ecosystem of developers and partnerships expanded faster than any previous quarters this year.\\u003c/p\\u003e\\n\\u003cp\\u003eENSv2 moved from concept to coordination: contracts, interfaces, and infrastructure all began to take shape in unison. We launched the first production-ready L2 Primary App, completed the majority of core ENSv2 contracts, and are bringing the next generation of the Manager and Explorer interfaces into testing.\\u003c/p\\u003e\\n\\u003cp\\u003eLooking ahead, Q4 will be a pivotal bridge between development and delivery across every team in order to hit year-end goals. Q3 has built upon the momentum from H1 of 2025 and the next 3 months will be a push to close out a transformative 2025 while tightening operational excellence within the organization.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-team-updates-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-team-updates-3\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eTeam Updates\\u003c/h2\\u003e\\n\\u003cp\\u003eAs of Q3 end, the ENS Labs team remains at 30 full-time hires. Our team growth continues to be a priority—if you are passionate about ENS, check our \\u003ca href=\\\&quot;https://jobs.ashbyhq.com/ens-labs\\\&quot;\\u003eopen roles\\u003c/a\\u003e. We’re hiring across Engineering, DevRel, Growth \\u0026amp; Operations!\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-59259-building-ensv2-from-code-to-coordination-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-building-ensv2-from-code-to-coordination-4\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eBuilding ENSv2: From Code to Coordination\\u003c/h1\\u003e\\n\\u003cp\\u003eProtocol engineering made decisive progress this quarter. The core contract suite is now roughly 80% complete, with migration coverage nearing full readiness. This work establishes the baseline architecture that will power ENS for the next decade, a modular system built for flexibility, auditability, and L2 interoperability.\\u003c/p\\u003e\\n\\u003cp\\u003eENSv2 \\u003ca href=\\\&quot;https://www.notion.so/enslabs/ENSv2-Migration-Plan-23b7a8b1f0ed80ee832df953abc80810\\\&quot;\\u003emigration strategy\\u003c/a\\u003e progressed significantly in Q3. The upcoming launch is currently planned for early 2026, and will enable seamless migration of existing ENSv1 names to new contracts supported on either Ethereum L1 or Namechain L2. We have intentionally designed it so that there is no end date for the migration process and that ENS names that remain on the L1 may be supported indefinitely. This ensures that all existing names will transition smoothly, maintaining resolution compatibility while enabling the richer data structures introduced in ENSv2. That being said, migrating will allow users to take advantage of new V2 functionality, including gas cost savings if they choose to migrate to Namechain, and we will strongly encourage users to consider migrating.\\u003c/p\\u003e\\n\\u003cp\\u003eThe overall migration sequence begins with ENSv2 contract deployment on Ethereum Mainnet and Namechain for launch, then migration of all existing ENSv1 .eth 2LD registration data to the corresponding Namechain contract. However, the exact process and requirements may vary based on audit and formal verification, with external partners scheduled to begin review in early Q4. As we look forward to ENSv2 and migration preparation, we would welcome any commentary or questions you may have \\u003ca href=\\\&quot;https://discuss.ens.domains/t/announcing-the-detailed-migration-plan-for-ensv2/21354/1\\\&quot;\\u003ehere\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the Namechain development side: the rapid evolution of the L2 space continues to make Namechain a complicated and ambitious undertaking. Our focus is to pursue the best innovations in the space and to remain committed to building out Namechain’s technical infrastructure to be as decentralized as technically possible. We have always believed that a based sequencer model is the right design for Namechain, as it is the best design for a rollup to inherit both the liveness and decentralization of the Ethereum L1. This remains a goal that we are committed to and look forward to sharing more detailed chain design updates in Q4.\\u003c/p\\u003e\\n\\u003cp\\u003eAs the ENSv2 codebase grows in size and complexity, we continue to identify new areas for optimization (including existing infrastructure of ENS) and mitigate unforeseen complications. Though this may consume significant time, we believe it is necessary to ensure the best end result.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-apps-l2-primary-name-app-manager-explorer-5\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-apps-l2-primary-name-app-manager-explorer-5\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eApps: L2 Primary Name App + Manager + Explorer\\u003c/h2\\u003e\\n\\u003cp\\u003eWhile the Protocol team focused on the technical foundations of ENSv2, Product and Design teams orchestrated the next layer, focused on the front-end and UX that make ENS accessible to everyone.\\u003c/p\\u003e\\n\\u003cp\\u003eQ3 marked the successful launch of the \\u003ca href=\\\&quot;https://primary.ens.domains/\\\&quot;\\u003eL2 Primary Name App\\u003c/a\\u003e following a \\u003ca href=\\\&quot;https://www.tally.xyz/gov/ens/proposal/42524979896803285837776370636134389407867034021879791462477783237030656381157\\\&quot;\\u003esuccessful vote\\u003c/a\\u003e by the ENS DAO to enable \\u003ca href=\\\&quot;https://docs.ens.domains/ensip/19/\\\&quot;\\u003eENSIP-19\\u003c/a\\u003e. This allowed us to ship the L2 Primary Name app, our first production interface that empowers users to set and manage primary names on their chosen Layer 2 without paying L1 gas fees.  The L2 Primary Name App was launched with initial support on Base, Arbitrum, Optimism, Linea, and Scroll (and hopefully more to come!). Users can also designate a default primary name that applications will reference automatically when no L2-specific name is set, thereby extending the idea of an ENS name as a universal “web3 username” across all major Ethereum L2s.\\u003c/p\\u003e\\n\\u003cp\\u003eFor step-by-step instructions on how to Set Default \\u0026amp; L2 Primary Names, follow the \\u003ca href=\\\&quot;https://support.ens.domains/en/articles/11739517-how-to-set-default-l2-primary-names-primary-ens-domains?utm_source=PNApp\\u0026amp;utm_medium=topbanner\\u0026amp;utm_campaign=DefaultPNGuideSep25\\\&quot;\\u003elink\\u003c/a\\u003e here. Our friends over at Base also wrote about supporting L2 Primary Names \\u003ca href=\\\&quot;https://blog.base.dev/basenames-ensip-19\\\&quot;\\u003ehere\\u003c/a\\u003e and details what it means for Basenames. We also have a video \\u003ca href=\\\&quot;https://www.youtube.com/watch?v=3Uvkqb2bl1Y\\\&quot;\\u003etutorial\\u003c/a\\u003e on how to set an L2 Primary Name to manage where it’s active across chains, with optionality to assign unique names per chain or a default address.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/a/ac15cf94c59635fe36845011274303e36d4a34d6.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/ac15cf94c59635fe36845011274303e36d4a34d6\\\&quot; title=\\\&quot;1_L2 Primary Name\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ac15cf94c59635fe36845011274303e36d4a34d6_2_665x500.jpeg\\\&quot; alt=\\\&quot;1_L2 Primary Name\\\&quot; data-base62-sha1=\\\&quot;oykQYBUg1QZ87b2gnXVI0LMeQOW\\\&quot; width=\\\&quot;665\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ac15cf94c59635fe36845011274303e36d4a34d6_2_665x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/ac15cf94c59635fe36845011274303e36d4a34d6_2_997x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/a/ac15cf94c59635fe36845011274303e36d4a34d6.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;EBEBEC\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e1_L2 Primary Name\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1118×840 105 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eBeyond the user-facing app, this launch required substantial backend coordination. The team alongside Unruggable had implemented CCIP-Read gateways for each supported L2, a critical piece of infrastructure that enables cross-chain data resolution. The successful deployment of these systems marks an important technical achievement for ENS and validates the approach we are taking toward scalable, multi-chain name resolution.\\u003c/p\\u003e\\n\\u003cp\\u003eThe new Manager and Explorer Apps also advanced substantially. The Manager will streamline onboarding for new users with simpler flows, credit-card payments, and auto-renewal management. While Explorer will cater to developers and power users, emphasizing transparency and decentralization. Together, these two apps will replace the legacy Manager and give the ENS ecosystem a modern, resilient interface stack.\\u003c/p\\u003e\\n\\u003cp\\u003eIn addition to these new apps, updates and improvements are continually made to existing services. The Frontend team expanded the Namechain DevNet and test environment, building edge-optimized metadata services to improve response times and began implementing a new notification system. This infrastructure will power real-time expiry reminders and cross-account monitoring in future releases.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-59259-strengthening-the-ens-ecosystem-6\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-strengthening-the-ens-ecosystem-6\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eStrengthening the ENS Ecosystem\\u003c/h1\\u003e\\n\\u003cp\\u003eWhile Engineering remains deeply committed to advancing ENSv2, Growth and DevRel initiatives drove forward ENSv2 visibility, rolling out new ENS supporting content, and clarifying the migration and features of Namechain.\\u003c/p\\u003e\\n\\u003cp\\u003eIn Q3, our DevRel team strengthened ENS in the Ethereum ecosystem through sponsoring almost a dozen conferences and hackathons. From EthCC and ETHGlobal Cannes in July, ETHGlobal New York in August, to ETHAccra and ETHTokyo in September, and finally ETHGlobal New Delhi to round out Q3.\\u003c/p\\u003e\\n\\u003cp\\u003eWe also focused on driving our Universal Resolver Migration strategy, developing supporting documentation for L2 primary names, and driving AI tooling for developers. Here’s some highlights:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eUpgraded \\u003ca href=\\\&quot;https://docs.ens.domains/resolvers/universal/#universal-resolver\\\&quot;\\u003eUniversal Resolver Guide\\u003c/a\\u003e to simplify the process of resolving ENS names and make the transition to \\u003ca href=\\\&quot;https://ens.domains/ensv2\\\&quot;\\u003eENSv2\\u003c/a\\u003e seamless.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eUpgraded \\u003ca href=\\\&quot;https://docs.ens.domains/web/reverse/#l2-primary-names\\\&quot;\\u003eL2 Primary Names\\u003c/a\\u003e documentation to include the latest on ENS protocol.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eReleased the Ethereum MCP: \\u003ca href=\\\&quot;https://github.com/gskril/ethereum-mcp\\\&quot;\\u003eethereum-mcp\\u003c/a\\u003e, added ENS to \\u003ca href=\\\&quot;https://context7.com/\\\&quot;\\u003econtext7\\u003c/a\\u003e, and added an AI chatbot to the docs.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-growth-indicators-7\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-growth-indicators-7\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eGrowth Indicators\\u003c/h2\\u003e\\n\\u003cp\\u003eQ3 was a standout quarter for ENS, with 90K+ .eth renewals (up 45% from Q2) fueled by strong momentum in July and August. The ecosystem hit new milestones, with over 1.6M active names, 978K+ primary names, and 728K unique participants.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/3/3b05271f79393d1e023f5c0247d9faec9d556721.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/3b05271f79393d1e023f5c0247d9faec9d556721\\\&quot; title=\\\&quot;2_Growth Indicators Chart\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/3/3b05271f79393d1e023f5c0247d9faec9d556721_2_690x463.png\\\&quot; alt=\\\&quot;2_Growth Indicators Chart\\\&quot; data-base62-sha1=\\\&quot;8q7d3FglnB7QWA1V8ewTmAP0wF3\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;463\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/3/3b05271f79393d1e023f5c0247d9faec9d556721_2_690x463.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/3/3b05271f79393d1e023f5c0247d9faec9d556721_2_1035x694.png 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/3/3b05271f79393d1e023f5c0247d9faec9d556721.png 2x\\\&quot; data-dominant-color=\\\&quot;EBF2ED\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e2_Growth Indicators Chart\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1342×902 62.8 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e(Source: \\u003ca href=\\\&quot;https://dune.com/ethereumnameservice/ens\\\&quot;\\u003ehttps://dune.com/ethereumnameservice/ens\\u003c/a\\u003e)\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-ecosystem-developer-growth-8\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-ecosystem-developer-growth-8\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eEcosystem \\u0026amp; Developer Growth\\u003c/h2\\u003e\\n\\u003cp\\u003eIn Q3, ENS representation and attendance was prevalent across global conferences and hackathons including \\u003ca href=\\\&quot;https://ethglobal.com/events/cannes/prizes/ens\\\&quot;\\u003eETHGlobal Cannes\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://www.youtube.com/watch?v=Xq1jqAweoFg\\\&quot;\\u003eETHGlobal NYC\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://x.com/ETHAccra/status/1947935135308902869\\\&quot;\\u003eETH Accra\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://x.com/Ethereum_JP/status/1966211986653335928\\\&quot;\\u003eETH Tokyo\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://ethglobal.com/events/newdelhi/prizes/ens\\\&quot;\\u003eETH New Delhi\\u003c/a\\u003e and a few others.\\u003c/p\\u003e\\n\\u003cp\\u003eWe’re also excited to sponsor DevConnect in Buenos Aires this November. You can find us in the \\u003ca href=\\\&quot;https://x.com/EFDevcon/status/1975968893937254570\\\&quot;\\u003eSocial District\\u003c/a\\u003e where we’ll be hosting live demos and UX sessions. We’ll also be hosting a quest at our booth focused on subname integrations, which you can mint a POAP for!\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-59259-ethglobal-cannes-2025-9\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-ethglobal-cannes-2025-9\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eETHGlobal Cannes 2025\\u003c/h3\\u003e\\n\\u003cp\\u003eShout out to the participants in Cannes this year, including 26 projects with 7.8% built on ENS, with 60+ participants and $10K awarded in bounties.\\u003c/p\\u003e\\n\\u003cp\\u003eThe hackathon kicked off with Greg’s \\u003ca href=\\\&quot;https://www.youtube.com/live/0DkKjnVFQ3M\\\&quot;\\u003eIdentity in Your Apps workshop\\u003c/a\\u003e on ENS, new L2 primary names, and an overview of bounties. Then with Erin Beaudoin (Snr Product Designer \\u0026amp; Researcher) presenting on the \\u003ca href=\\\&quot;https://drive.google.com/file/d/1Bg5aJD-qobNy9l4OcHvcFs6KMaloZqqt/view?usp=sharing\\\&quot;\\u003eproduct strategy for ENSv2\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eWinning projects were awarded to \\u003ca href=\\\&quot;https://ethglobal.com/showcase/gitvault-zau5m\\\&quot;\\u003eGitVault\\u003c/a\\u003e (code censorship) for the Best Use of ENS, and a tie between \\u003ca href=\\\&quot;https://ethglobal.com/showcase/substream-msjk1\\\&quot;\\u003eSubstream\\u003c/a\\u003e (get paid to your Substream ENS) and \\u003ca href=\\\&quot;https://ethglobal.com/showcase/elara-cvb2y\\\&quot;\\u003eElara\\u003c/a\\u003e (one-click decentralized AI agents) for Most Creative Use Cases.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/9123a92ca4bda904f35b122e300f92ce870693d5.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/9123a92ca4bda904f35b122e300f92ce870693d5\\\&quot; title=\\\&quot;3_ETHGlobal Cannes 1\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9123a92ca4bda904f35b122e300f92ce870693d5_2_517x370.jpeg\\\&quot; alt=\\\&quot;3_ETHGlobal Cannes 1\\\&quot; data-base62-sha1=\\\&quot;kHXDrzWkrzrlvPgg2s0fl1Qh8i1\\\&quot; width=\\\&quot;517\\\&quot; height=\\\&quot;370\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9123a92ca4bda904f35b122e300f92ce870693d5_2_517x370.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9123a92ca4bda904f35b122e300f92ce870693d5_2_775x555.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/9123a92ca4bda904f35b122e300f92ce870693d5_2_1034x740.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;6F777E\\\&quot;\\u003e\\u003cdiv 3e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-59259-ethglobal-nyc-2025-10\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-ethglobal-nyc-2025-10\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eETHGlobal NYC 2025\\u003c/h3\\u003e\\n\\u003cp\\u003eAt ETHGlobal NYC this year, we had an impressive 36 projects with 11.6% built on ENS, with 47 participants and $10K awarded in bounties.\\u003c/p\\u003e\\n\\u003cp\\u003eSome of the winning projects included \\u003ca href=\\\&quot;https://ethglobal.com/showcase/ease-swvf9\\\&quot;\\u003eEase\\u003c/a\\u003e (biometric ENS checkout) awarded Best Use of ENS, with \\u003ca href=\\\&quot;https://ethglobal.com/showcase/bribehacks-okn90\\\&quot;\\u003eBribeHacks\\u003c/a\\u003e (hackathon marketplace) coming in next, and \\u003ca href=\\\&quot;https://ethglobal.com/showcase/real-world-access-zoyaw\\\&quot;\\u003eReal-World Access\\u003c/a\\u003e (decentralized access control for RWAs), \\u003ca href=\\\&quot;https://ethglobal.com/showcase/startupchain-0fyf5\\\&quot;\\u003eStartup Chain\\u003c/a\\u003e (startup bootstrapping dApp), and \\u003ca href=\\\&quot;https://ethglobal.com/showcase/code-quill-n2a0i\\\&quot;\\u003eCode Quill\\u003c/a\\u003e (authorship layer for devs) tied for third.\\u003c/p\\u003e\\n\\u003cp\\u003eFinally Simon (Head of DevRel) connected with the Gemini team in NYC. Check out our \\u003ca href=\\\&quot;https://x.com/schmid_si/status/1956019302697439509\\\&quot;\\u003eGemini subname launch stream\\u003c/a\\u003e, one of our first implementations of ERC-7579 modular smart account framework with passkeys!\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/c/cca8a1ed5d6db45beb3db96b1e3789b55a103da6.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/cca8a1ed5d6db45beb3db96b1e3789b55a103da6\\\&quot; title=\\\&quot;5_ETHGlobal NYC 1\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/c/cca8a1ed5d6db45beb3db96b1e3789b55a103da6_2_279x374.jpeg\\\&quot; alt=\\\&quot;5_ETHGlobal NYC 1\\\&quot; data-base62-sha1=\\\&quot;tcuHfb2C59yG3Dz2XeMe3Mu2AmO\\\&quot; width=\\\&quot;279\\\&quot; height=\\\&quot;374\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/c/cca8a1ed5d6db45beb3db96b1e3789b55a103da6_2_279x374.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/c/cca8a1ed5d6db45beb3db96b1e3789b55a103da6_2_418x561.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/c/cca8a1ed5d6db45beb3db96b1e3789b55a103da6_2_558x748.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;7A7874\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e5_ETHGlobal NYC 1\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e792×1062 67.6 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\n\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/5/574dfce69a6c390a67895a4adc3264d48494b47f.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/574dfce69a6c390a67895a4adc3264d48494b47f\\\&quot; title=\\\&quot;6_ETHGlobal NYC 2\\\&quot;\\u003e\\u00 ings off, a 3-day unconference hosted by \\u003ca href=\\\&quot;https://x.com/yosephayele\\\&quot;\\u003eYoseph Ayele\\u003c/a\\u003e of \\u003ca href=\\\&quot;https://x.com/lavavc_\\\&quot;\\u003eLava VC\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://x.com/borderlessaf\\\&quot;\\u003eBorderless Africa\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eETHAccra Builders Day drew 100+ attendees for talks and workshops from Celo, Gnosis, Base, and ENS, followed by ETHGlobal Happy Hour, where hackers and builders were able to connect.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eSheFi Africa Summit brought together 50+ attendees for panels, dinner, and a shefi.eth subname minting session, highlighting women leading Africa’s Web3 movement.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eFinally, the main event ETHAccra saw 400+ attendees and 250+ builders. ENS as a Gold sponsor, saw success in 70% of submissions integrating ENS and 80+ new hacker connections. Winning projects included \\u003ca href=\\\&quot;https://taikai.network/ethaccra/hackathons/Hackathon2025/projects/cmf7xazxq00rugq91f9itski0\\\&quot;\\u003eFusionENS\\u003c/a\\u003e (iOS keyboard + browser extension and \\u003ca href=\\\&quot;https://taikai.network/ethaccra/hackathons/Hackathon2025/projects/cmf81qcfm00zdpo3l9bxkcye1\\\&quot;\\u003eEnRouteApp\\u003c/a\\u003e (subname payment routers).\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eOverall ENS’s presence at ETHAccra reinforced our commitment to empowering builders and supporting Africa’s growing on-chain ecosystem. For more details, check out our \\u003ca href=\\\&quot;https://www.notion.so/enslabs/Public-ETHAccra-Accra-Blockchain-Week-2025-Recap-26b7a8b1f0ed806ea1f0fc31f6068db7\\\&quot;\\u003eETHAccra recap\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&
