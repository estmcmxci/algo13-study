https://discuss.ens.domains/uploads/db9688/f5e9bf32ff315064a5392df3440acc558809c40d\\\&quot; title=\\\&quot;8_ETHAccra 2\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f5e9bf32ff315064a5392df3440acc558809c40d_2_345x229.jpeg\\\&quot; alt=\\\&quot;8_ETHAccra 2\\\&quot; data-base62-sha1=\\\&quot;z5rMoIpBQwMo2N2wyAEkQ8JmR8F\\\&quot; width=\\\&quot;345\\\&quot; height=\\\&quot;229\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f5e9bf32ff315064a5392df3440acc558809c40d_2_345x229.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f5e9bf32ff315064a5392df3440acc558809c40d_2_517x343.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f5e9bf32ff315064a5392df3440acc558809c40d_2_690x458.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;8E918B\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e8_ETHAccra 2\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1514×1008 116 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-59259-ethtokyo-12\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-ethtokyo-12\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eETHTokyo\\u003c/h3\\u003e\\n\\u003cp\\u003eFor three days in September in Tokyo, Japan, the ENS team pursued the program’s goals of “Technology for Humanity” and “Allies for Freedom.” ENS’ presence at ETHTokyo was a joint effort between Labs and the DAO’s Public Goods Working Group (“PG WG”).\\u003c/p\\u003e\\n\\u003cp\\u003eKey highlights included exploring different ways to integrate ENS ahead of the 1K+ participant hackathon, included ENS use cases spanning across: primary names \\u0026amp; multichain resolution, using DNS domains as ENS names via DNSSEC, smart contract naming, decentralized websites (e.g. eth.limo), ENS profiles and records, and subnames.\\u003c/p\\u003e\\n\\u003cp\\u003eThe winning $1K prize awarded to the \\u003ca href=\\\&quot;https://www.ethtokyo.org/#tracks\\\&quot;\\u003ehackathon winners\\u003c/a\\u003e sponsored by the PG WG, was split between four winners that built on ENS:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://taikai.network/ethtokyo/hackathons/hackathon-2025/projects/cmfkaaz3d04kppo3lvjyj4hln/idea\\\&quot;\\u003eWorld Context Machine\\u003c/a\\u003e Ethereum == World State Machine for Human == World Context Machine for AI\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://taikai.network/ethtokyo/hackathons/hackathon-2025/projects/cmfjagbr104fr9gzu8sau6etz/idea\\\&quot;\\u003ezk-IoT\\u003c/a\\u003e a framework to enable IoT devices to prove compliance with rules or thresholds without revealing raw sensor data.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://www.mizupass.com/\\\&quot;\\u003eMizuPass\\u003c/a\\u003e a universal privacy first ticketing platform: ENS DID + ZKPassport verification + stealth JPYM payments + offline ZK proofs for seamless cross-border event access.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://testflight.apple.com/join/X1bwDXqD\\\&quot;\\u003eLuft Deck\\u003c/a\\u003e a privacy-preserving, proximity-based business card sharing app built with zero-knowledge proofs and P2P networking.\\u003c/p\\u003e\\n\\u003 mains/uploads/db9688/original/2X/f/f362ce6d706c3a56d7281dba023a7500cbac5cd1.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/f362ce6d706c3a56d7281dba023a7500cbac5cd1\\\&quot; title=\\\&quot;13_SEAL Safe 1\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f362ce6d706c3a56d7281dba023a7500cbac5cd1_2_345x192.jpeg\\\&quot; alt=\\\&quot;13_SEAL Safe 1\\\&quot; data-base62-sha1=\\\&quot;yJ5Is0upZw5QWosv2lDOgbZmYxz\\\&quot; width=\\\&quot;345\\\&quot; height=\\\&quot;192\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f362ce6d706c3a56d7281dba023a7500cbac5cd1_2_345x192.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f362ce6d706c3a56d7281dba023a7500cbac5cd1_2_517x288.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/f/f362ce6d706c3a56d7281dba023a7500cbac5cd1_2_690x384.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;525F93\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e13_SEAL Safe 1\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1150×642 63.8 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eEarlier in June, Nick Johnson and Alex Urbelis met with SEAL leadership and volunteers about enhancing Web3 security and intel sharing across the ecosystem. Followed by on September 10th, \\u003ca href=\\\&quot;https://x.com/_SEAL_Org/status/1965762683673981035\\\&quot;\\u003eENS Labs officially adopted the SEAL Whitehat Safe Harbor Agreement\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eThe SEAL Whitehat \\u003ca href=\\\&quot;https://www.securityalliance.org/safe-harbor\\\&quot;\\u003eSafe Harbor\\u003c/a\\u003e is an on-chain legal agreement, which protocols can adopt so that security researchers can rescue a protocol during an ongoing attack. By adopting the whitehat safe harbor agreement, whitehats can rescue your protocol correctly, without worrying about any legal repercussions.\\u003c/p\\u003e\\n\\u003cp\\u003eThe agreement creates a trusted legal framework that empowers whitehat hackers to safely and transparently intervene during an active exploit. Meaning if a vulnerability is ever discovered or exploited, ethical security researchers can step in to protect user funds and ENS infrastructure without fear of legal persecution.\\u003c/p\\u003e\\n\\u003cp\\u003eTo date, the Safe Harbor protects $10.9B+ in on-chain assets, covering $59B of DeFi’s TVL, and is deployed on ten blockchains with 18 protocol adoptions.\\u003c/p\\u003e\\n\\u003cp\\u003eBy joining SEAL’s Safe Harbor initiative, ENS Labs furthered our commitment to security, collaboration, and protecting the broader Web3 ecosystem through transparent and responsible vulnerability response.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-59259-icann-new-2026-gtld-applications-14\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-icann-new-2026-gtld-applications-14\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eICANN + New 2026 gTLD Applications\\u003c/h3\\u003e\\n\\u003cp\\u003eBuilding on our participation at the ICANN Policy Forum in Prague last quarter, we have continued to establish our engagement in the ICANN ecosystem.\\u003c/p\\u003e\\n\\u003cp\\u003eThe recently closed Guidebook public comment period for the next round of new gTLDs (slated for 2025), \\u003ca href=\\\&quot;https://domainincite.com/tag/alt-roots\\\&quot;\\u003ebrought renewed attention\\u003c/a\\u003e to the overlap between blockchain-based naming systems and traditional DNS – where ENS continues to lead. Earlier in July, Alex Urbelis submitted \\u003ca href=\\\&quot;https://www.icann.org/en/public-comment/proceeding/final-proceeding-for-proposed-language-for-the-draft-next-round-applicant-guidebook-agb-30-05-2025/submissions/urbelis-alexander-23-07-2025\\\&quot;\\u003ePublic Comments\\u003c/a\\u003e on behalf of ENS in response to ICANN’s \\u003ca href=\\\&quot;https://www.icann.org/en/public-comment/proceeding/final-proceeding-for-proposed-language-for-the-draft-next-round-applicant-guidebook-agb-30-05-2025\\\&quot;\\u003eFinal Proceeding for Proposed Language for the Draft Next Round Applicant Guidebook (AGB)\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eHighlights on ENS’ public comments included:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eMany operators of blockchain-based naming systems are expected to apply for their matching DNS strings in the upcoming ICANN gTLD round.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWe believe that if a new gTLD matches an existing blockchain-based TLD, it should be treated as a compromised asset, since delegating it could expose ICANN and applicants to legal, technical, and security risks.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWhile we support recognition of alternative namespaces, we do not believe alt-TLD operators should receive preferential treatment in the ICANN process for operating outside existing governance structures.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWe’ve recommended that ICANN expand its String Similarity Evaluation to consider blockchain-based namespaces, helping to reduce name collisions and maintain DNS stability.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eOur efforts have not gone unnoticed by the ICANN community. As ENS’s standing rose, we were invited to present at \\u003ca href=\\\&quot;https://indico.dns-oarc.net/event/55/\\\&quot;\\u003eDNS-OARC 45\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://regiops.net/registration-operations-workshop-row\\\&quot;\\u003eICANN’s Registration Operations Workshop\\u003c/a\\u003e, marking the first time a decentralized protocol will participate in those discussions as a peer. Building on our presence at the Prague Policy Forum, we quickly executed on the .locker \\u003ca href=\\\&quot;https://ens.domains/blog/post/locker-domains\\\&quot;\\u003eintegration\\u003c/a\\u003e with Orange Domains, reinforcing how ENS and traditional DNS can work productively together.\\u003c/p\\u003e\\n\\u003cp\\u003eLooking ahead to ICANN Dublin, ENS is just about ready to reveal a new partnership that further cements our leadership at the intersection of DNS and Web3.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-partnerships-15\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-partnerships-15\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003ePartnerships\\u003c/h2\\u003e\\n\\u003cp\\u003eWe continued to further our commitment to strengthening ENS’ ecosystem through strategic partnerships with DNS partners, protocols, decentralized and centralized exchanges, crypto-native communities, and FinTech players.\\u003c/p\\u003e\\n\\u003cp\\u003eKey highlights this quarter included: \\u003ca href=\\\&quot;https://x.com/Uniswap/status/1959250084123619493\\\&quot;\\u003eUni.eth\\u003c/a\\u003e surpassing 2M+ subname registrations, new subname launches with \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1945875202082288042\\\&quot;\\u003eBase\\u003c/a\\u003e currently with 917K+ subnames, Gemini Exchange integrated with ENS with \\u003ca href=\\\&quot;https://x.com/ensdomains/status/1956028817526677632\\\&quot;\\u003eGemini Wallet\\u003c/a\\u003e subnames at launch already with 15K+ registrations, and SheFi during ETHAccra (as of Sep 30).\\u003c/p\\u003e\\n\\u003cp\\u003eThe Gemini Wallet integration was featured in \\u003ca href=\\\&quot;https://www.theblock.co/post/367019/crypto-exchange-gemini-wallet-onchain-dashboard-trading-investing\\\&quot;\\u003eThe Block\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://blockworks.co/news/gemini-wallet-review\\\&quot;\\u003eBlockworks\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://www.coindesk.com/business/2025/08/14/billionaire-winklevoss-twins-backed-gemini-launches-self-custodial-smart-wallet\\\&quot;\\u003eCoinDesk\\u003c/a\\u003e. We also introduced ENS Quests to the latest \\u003ca href=\\\&quot;https://x.com/shefiorg/status/1966154831061782584\\\&quot;\\u003eSheFi cohort\\u003c/a\\u003e and integrated ENS names with \\u003ca href=\\\&quot;https://x.com/mely_jpg/status/1950280040438255999\\\&quot;\\u003eOpenSea profiles\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/9/99ab2494df3c804a07ec82c9f9e32cdf5d4eb232.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/99ab2494df3c804a07ec82c9f9e32cdf5d4eb232\\\&quot; title=\\\&quot;15_Partnerships (Gemini)\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/99ab2494df3c804a07ec82c9f9e32cdf5d4eb232_2_517x373.jpeg\\\&quot; alt=\\\&quot;15_Partnerships (Gemini)\\\&quot; data-base62-sha1=\\\&quot;lVpIWGmoiulCjPcLysM5M1wtu9k\\\&quot; width=\\\&quot;517\\\&quot; height=\\\&quot;373\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/9/99ab2494df3c804a07ec82c9f9e32cdf5d4eb232_2_517x373.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/9/99ab2494df3c804a07ec82c9f9e32cdf5d4eb232_2_775x559.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/original/2X/9/99ab2494df3c804a07ec82c9f9e32cdf5d4eb232.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;5E5550\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e15_Partnerships (Gemini)\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e960×694 42.7 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eSimon, Head of DevRel, with the Gemini team.\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eOn the identity front, ENS partnered with \\u003ca href=\\\&quot;https://ens.domains/blog/post/locker-domains\\\&quot;\\u003eOrange Domains\\u003c/a\\u003e, an ICANN-accredited registry operator, to enable the .locker TLD and launched a Creator Score integration with \\u003ca href=\\\&quot;https://x.com/mely_jpg/status/1948147372082577797\\\&quot;\\u003eTalent Protocol\\u003c/a\\u003e, bridging on-chain identity and reputation.\\u003c/p\\u003e\\n\\u003cp\\u003eTo expand awareness and education, we published 15 tutorials on ENS features, introduced a new blog tagging system with Intercom search, and released five integrations case studies featuring \\u003ca href=\\\&quot;https://ens.domains/ecosystem/uniswap\\\&quot;\\u003eUniswap\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://ens.domains/ecosystem/base\\\&quot;\\u003eBase\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://ens.domains/ecosystem/godaddy\\\&quot;\\u003eGoDaddy\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://ens.domains/ecosystem/paypal\\\&quot;\\u003ePayPal\\u003c/a\\u003e, and World ID that drove 8K+ visits to our \\u003ca href=\\\&quot;https://ens.domains/ecosystem\\\&quot;\\u003eENS Ecosystem page\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eHeading into Q4, ENS Labs will build on this momentum by deepening partnerships and expanding integrations across exchanges, wallets, dApps, protocols, and DNS partners to advance a unified, on-chain identity ecosystem.\\u003c/p\\u003e\\n\\u003cp\\u003eIn the Media\\u003c/p\\u003e\\n\\u003cp\\u003eIn Q3 2025, ENS was featured in 12 published pieces across The Block, CoinDesk, and The Defiant. Impressively, earned coverage reached an audience of 20.8M, with 149K total views, and almost 400 social engagements.\\u003c/p\\u003e\\n\\u003cp\\u003eHighlights include:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eNick’s interview on Ethereum’s 10 Year Anniversary, featured on \\u003ca href=\\\&quot;https://x.com/CoinDesk/status/1950572399537103334\\\&quot;\\u003eCoinDesk TV\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eNick authored and defined Tokenized Domains for \\u003ca href=\\\&quot;https://coinmarketcap.com/academy/glossary/tokenized-domain\\\&quot;\\u003eCoinMarketCap\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eKatherine’s commentary on the new era of ETH ETFs covered in \\u003ca href=\\\&quot;https://cryptorank.io/news/feed/d719a-one-year-of-us-spot-ethereum-etfs-how-far-have-they-come-and-whats-next\\\&quot;\\u003eCrypto Rank\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eJames’ interview with the \\u003ca href=\\\&quot;https://x.com/i/broadcasts/1YpKkkbXmwMKj\\\&quot;\\u003eEnterprise Ethereum Alliance.\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eJames’ discussion with Domain Name Wire on the \\u003ca href=\\\&quot;https://domainnamewire.com/2025/09/22/the-future-of-ethereum-name-service-dnw-podcast-553/\\\&quot;\\u003eFuture of ENS.\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eAlex’s comments on the Tornado Cash verdict, published in \\u003ca href=\\\&quot;https://www.coindesk.com/policy/2025/08/06/roman-storm-guilty-of-unlicensed-money-transmitting-conspiracy-in-partial-verdict\\\&quot;\\u003eCoinDesk\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eAlex’s op-ed on the current state of \\u003ca href=\\\&quot;https://unchainedcrypto.com/america-is-becoming-the-crypto-capital-of-cefi-heres-why-that-must-change/\\\&quot;\\u003eUS crypto policy, the GENIUS Act, and where CeFi comes in\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eAlex’s comments on \\u003ca href=\\\&quot;https://unchainedcrypto.com/america-is-becoming-the-crypto-capital-of-cefi-heres-why-that-must-change/\\\&quot;\\u003eAmerica Is Becoming The Crypto Capital of CeFi\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eInto Q4, we’ll continue expansion of new tutorials and stories that make ENS easier to use and integrate. As always, we’re open to suggestions on what content and topics you’d like to see on anything ENS-related.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-59259-financial-reporting-16\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-financial-reporting-16\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eFinancial Reporting\\u003c/h1\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/5/5b495083ffa19a1ef024a0f7078f06cefd25d03b.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/5b495083ffa19a1ef024a0f7078f06cefd25d03b\\\&quot; title=\\\&quot;16_Financials IncomeStatement\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5b495083ffa19a1ef024a0f7078f06cefd25d03b_2_690x335.png\\\&quot; alt=\\\&quot;16_Financials IncomeStatement\\\&quot; data-base62-sha1=\\\&quot;d1ywzLofRH0LAJciSiXrbH2Ga9R\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;335\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5b495083ffa19a1ef024a0f7078f06cefd25d03b_2_690x335.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5b495083ffa19a1ef024a0f7078f06cefd25d03b_2_1035x502.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/5/5b495083ffa19a1ef024a0f7078f06cefd25d03b_2_1380x670.png 2x\\\&quot; data-dominant-color=\\\&quot;EDEDED\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e16_Financials IncomeStatement\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1964×954 148 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-income-17\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-income-17\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eIncome\\u003c/h2\\u003e\\n\\u003cp\\u003eAs of Q3 close, we have received $7,255,068.49 USDC from the ENSDAO.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-59259-expenses-18\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-expenses-18\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eExpenses\\u003c/h2\\u003e\\n\\u003cp\\u003eOur expenses for Q3 2025 totaled $2,098,586.86 USD (40.7% increase from Q2) with total YTD expenses at $4,885,089.67. The top three expense categories were:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eEmployee Compensation \\u0026amp; Benefits (59.9%) for payroll, benefits, and employer contributions for our 30 full-time employees and two contractors.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eProfessional Services (19.5%) August’s increase in expenses was attributed to prepayment towards two audit firms. Additionally, expenses include our regular third-party providers supporting our Accounting, Legal \\u0026amp; Compliance, and Recruiting \\u0026amp; Hiring efforts.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eIT \\u0026amp; Software Hosting (4.2%) spanning across our Operational and Engineering software and IT service providers (e.g. Google Cloud, Cloudflare).\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/a/adec0043a116142b185ff3cf20574df49c69ee3f.png\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/adec0043a116142b185ff3cf20574df49c69ee3f\\\&quot; title=\\\&quot;17_Q3 Expense Pie Chart\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/adec0043a116142b185ff3cf20574df49c69ee3f_2_690x418.png\\\&quot; alt=\\\&quot;17_Q3 Expense Pie Chart\\\&quot; data-base62-sha1=\\\&quot;oOAeoPEtQkFipqPQ10o9HrLyYY7\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;418\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/a/adec0043a116142b185ff3cf20574df49c69ee3f_2_690x418.png, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/adec0043a116142b185ff3cf20574df49c69ee3f_2_1035x627.png 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/a/adec0043a116142b185ff3cf20574df49c69ee3f_2_1380x836.png 2x\\\&quot; data-dominant-color=\\\&quot;D4D7DA\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e17_Q3 Expense Pie Chart\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1524×924 63.5 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAs anticipated, Q3 expenses experienced an uptick due to infrastructure and audit costs related to ENSv2 and Namechain. In Q4, we expect remaining expenses for 2025 to rise as well as we prepare for both launches between now and into 2026. We continue to operate as financially conservative as possible and as always appreciate the ENS DAO’s financial support.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-59259-closing-looking-ahead-19\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-59259-closing-looking-ahead-19\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eClosing \\u0026amp; Looking Ahead\\u003c/h1\\u003e\\n\\u003cp\\u003eThe immediate technical priority for Q4 is ENSv2 readiness. Protocol and Web Engineering will complete audit cycles, expand testing on Namechain DevNet, and begin closed-group trials of the new Manager and Explorer. Feedback from these sessions will guide final refinements before the public rollout planned for early 2026.\\u003c/p\\u003e\\n\\u003cp\\u003eAs part of that, DevRel will coordinate a Universal Resolver Migration Campaign, helping wallets, dApps, and infrastructure partners update integrations ahead of launch. This proactive approach ensures that when ENSv2 goes live, the ecosystem is already compatible, supporting a crucial step toward a seamless transition.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the public-facing side, Q4 will showcase ENS at DevConnect Buenos Aires and ETHGlobal BA. These events will serve as the first external demonstrations of the new Manager and the Namechain environment. While Growth and Design are collaborating on new materials, workshops, and visual assets that tell a coherent story about ENSv2’s role in Ethereum’s identity stack.\\u003c/p\\u003e\\n\\u003cp\\u003e2025 is already shaping up to be a year to be proud of, and we look forward to closing out the year strong going into the final quarter of 2025. As always, we deeply appreciate your ongoing support and trust as we work towards ENSv2.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:8,\&quot;updated_at\&quot;:\&quot;2025-10-17T01:47:41.091Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:170,\&quot;reads\&quot;:61,\&quot;readers_count\&quot;:60,\&quot;score\&quot;:1237.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:20565,\&quot;topic_slug\&quot;:\&quot;ens-labs-quarterly-progress-reports\&quot;,\&quot;display_username\&quot;:\&quot;Katherine Wu\&quot;,\&quot;primary_group_name\&quot;:\&quot;delegates\&quot;,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://jobs.ashbyhq.com/  Quarterly Report - Q4 2025\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-abstract-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-abstract-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eAbstract\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eQ4 closed out 2025 as a delivery-focused quarter for ENS Labs. Across the organization, work converged around a single objective: moving ENSv2 from architectural vision into working systems that developers, partners, and users can interact with seamlessly. By year end, ENSv2 core contracts reached engineering completion, a full testnet implementation was live, and the next-generation of ENS interfaces entered private alpha.\\u003c/p\\u003e\\n\\u003cp\\u003eAlongside technical delivery, we focused on strengthening our ecosystem foundations. Developer readiness accelerated through documentation, workshops, and real-world deployments. While on the DNS front, we focused on deepening ENS Labs’ engagement in the DNS ecosystem in preparation for ICANN’s upcoming 2026 gTLD round.\\u003c/p\\u003e\\n\\u003cp\\u003eAcross all of ENS Labs, these efforts closed out a strong year in 2025 with exciting momentum into 2026.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-team-updates-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-team-updates-3\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eTeam Updates\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003e2025 was an exceptional year of growth as we scaled our talented team to support our delivery goals. We started the year with 16 employees and finished by doubling our company size to a powerful team of 33! We had new teammates join us across every team at Labs and are so excited to have the density of talent here going into 2026.\\u003c/p\\u003e\\n\\u003cp\\u003eLooking ahead, we plan to round out the team with +7 more key hires in the first half of 2026 and will cap total headcount at 40 employees with several key hires across Engineering, DevRel, Growth, and Design.\\u003c/p\\u003e\\n\\u003cp\\u003eExpanding the team’s resourcing and capacity across key roles remains a priority to set us up for success into 2026. If you are passionate about ENS, check our \\u003ca href=\\\&quot;https://jobs.ashbyhq.com/ens-labs\\\&quot;\\u003eopen roles\\u003c/a\\u003e!\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-ensv2-architecture-to-alpha-release-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-ensv2-architecture-to-alpha-release-4\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENSv2: Architecture to Alpha Release\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eWe were excited to share our \\u003ca href=\\\&quot;https://discuss.ens.domains/t/ens-labs-development-proposal-ensv2-and-native-l2-support/19232\\\&quot;\\u003evision\\u003c/a\\u003e for the next iteration of the ENS protocol, ENSv2. The goal of introducing ENSv2 was to make ENS more flexible, scalable, and easier to adopt for ecosystem developers, power users, and newcomers alike.\\u003c/p\\u003e\\n\\u003cp\\u003eQ4 represented a major milestone for ENSv2. With the bulk of contract engineering completed, the focus shifted to refinement and validation in preparation for ENSv2 public alpha readiness (coming early 2026!). Core ENSv2 contracts are now 100% complete with 97% test coverage, and a full testnet implementation released.\\u003c/p\\u003e\\n\\u003cp\\u003eKey improvements included revisions to the Enhanced Access Control system to support a cleaner permission model, refinements to bridging and migration workflows to reduce user and implementation overhead, and finally the development of metadata and introspection standards to enable discovery of cross-chain ENSv2 names. These changes reflect lessons learned from assembling the full system and stress-testing assumptions made earlier in the design process.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the growth side, Q4 2025 stayed focused on the “\\u003ca href=\\\&quot;https://ens.domains/ensv2\\\&quot;\\u003ebuilding awareness\\u003c/a\\u003e” phase of ENSv2 and answering the key questions of our end users. \\u003cem\\u003eWhy should users want to upgrade? How can users find out answers to their questions about how ENSv2 is different?\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWe have also emphasized \\u003ca href=\\\&quot;https://docs.ens.domains/web/ensv2-readiness/\\\&quot;\\u003eENSv2 readiness\\u003c/a\\u003e with integration partners. As we look ahead in the new year, we will soon roll out campaigns around testing the ENS App and ENS Explorer alphas, as well as fun activations to get people aware and excited about upgrading to ENSv2.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-60249-introducing-private-alpha-ens-app-ens-explorer-5\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-introducing-private-alpha-ens-app-ens-explorer-5\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIntroducing Private Alpha: ENS App \\u0026amp; ENS Explorer\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eIn October 2025, we announced the \\u003ca href=\\\&quot;https://ens.domains/blog/post/ens-app-explorer-introduction\\\&quot;\\u003edecision\\u003c/a\\u003e to split the ENS app into two products:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eENS App:\\u003c/strong\\u003e Consumer-focused for seamless name registration and identity management.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eENS Explorer:\\u003c/strong\\u003e Developer-centric featuring advanced ownership capabilities, custom resolvers, and detailed record management.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eA priority goal for ENS Labs in Q4 was to complete and ship private alphas for reach, ahead of gathering feedback for our public release coming early 2026.\\u003c/p\\u003e\\n\\u003cp\\u003eThe focus was to get the apps to a place where we could enable end-to-end flows such as registering ENS names on the Sepolia testnet using ENSv2 contracts, then inspecting those names in depth through the Explorer. These apps serve not only as user-facing products, but also as reference implementations for \\u003ca href=\\\&quot;https://docs.ens.domains/web/ensv2-readiness/\\\&quot;\\u003eENSv2 preparation\\u003c/a\\u003e itself.\\u003c/p\\u003e\\n\\u003cp\\u003eThe private alpha release was a huge milestone for us and something that consumed most of our efforts in Q4. This initial version was shared mainly with ENS ecosystem developers. We had been working hard on many of the elements that we needed to make ENSv2 a reality, and in Q4 we were finally able to pull many of these pieces together.\\u003c/p\\u003e\\n\\u003cp\\u003eBased on the initial feedback, we are looking forward to improving and releasing the public Alpha versions of these apps with the broader community very soon!\\u003c/p\\u003e\\n\\u003cp\\u003eFor the upcoming \\u003cstrong\\u003epublic alpha releases\\u003c/strong\\u003e, we are currently focused on testing:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eNotification Service:\\u003c/strong\\u003e Our new notification service that will power things like renewal reminders and the new dashboard, as well as user accounts.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eNew Contract Data Indexing:\\u003c/strong\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eIndexing of data from the new contracts. This is more tricky now due to the more flexible nature of ENS v2.\\u003c/li\\u003e\\n\\u003cli\\u003eCertain functionality, such as listing all the names a user owns or what text records they’ve set, requires an indexer to work as that information isn’t readily available on-chain.\\u003c/li\\u003e\\n\\u003cli\\u003eIt’s more complicated for v2 because of the complex architecture, for example we’ve moved from having one registry to having a hierarchical system of multiple registries.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eAccount Abstraction Infrastructure:\\u003c/strong\\u003e Featuring smart sessions and our unique and patented Hidden Contract Accounts (HCAs). These together allow the user to interact with ENSv2 with smoother UX and less clicks.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eDeeper Para Integration:\\u003c/strong\\u003e Allowing users who sign in with socials to also take advantage of account abstraction, all without needing a wallet.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-60249-ens-app-6\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-ens-app-6\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS App\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eThe (new) ENS App will emphasize simplicity and onboarding, showcase streamlined registration flows, stablecoin payments, dashboards for managing names and primary names, role-based permissions, and configurable notifications.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/7/717c07b06c7ba60d33f16bbffd099cb232a6e4ff.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/717c07b06c7ba60d33f16bbffd099cb232a6e4ff\\\&quot; title=\\\&quot;2_ENS App\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/717c07b06c7ba60d33f16bbffd099cb232a6e4ff_2_683x500.jpeg\\\&quot; alt=\\\&quot;2_ENS App\\\&quot; data-base62-sha1=\\\&quot;gbVGBVGW9bKWJzAE3lqJhYhf30r\\\&quot; width=\\\&quot;683\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/7/717c07b06c7ba60d33f16bbffd099cb232a6e4ff_2_683x500.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/717c07b06c7ba60d33f16bbffd099cb232a6e4ff_2_1024x750.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/7/717c07b06c7ba60d33f16bbffd099cb232a6e4ff_2_1366x1000.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;E6EFEF\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e2_ENS App\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1468×1074 85.5 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eFeatures will include:\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003e1-Click Registration Flow:\\u003c/strong\\u003e Single-click name registration using Smart Sessions with support for stablecoin payments, while still allowing optional manual wallet approvals for users who prefer direct transaction signing.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDashboard:\\u003c/strong\\u003e Unified dashboard that displays a user’s primary name, lists and organizes all owned names with search and filtering (search by \\u003ccode\\u003e.eth\\u003c/code\\u003e name or EOA address), shows accurate name metadata such as expiry and primary status, and surfaces dynamic \\u003cem\\u003e“Did you know?”\\u003c/em\\u003e insights based on on-chain activity.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eName Profile:\\u003c/strong\\u003e Detailed name profile view showing up-to-date information with Smart Session support for seamless interactions, allowing record edits for owners or accounts with the appropriate role permissions.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eNotifications:\\u003c/strong\\u003e Notifications system that lets users add and manage notification channels, verify email addresses, and configurable notification preferences.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\&quot;p-60249-ens-explorer-7\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-ens-explorer-7\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eENS Explorer\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003eThe ENS Explorer is like the Etherscan of ENS. It’s a comprehensive developer tool for ecosystem builders, featuring advanced ownership capabilities, custom resolvers, and detailed historical records that offers complete visibility with precise controls.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/e/e8844eeddd649b911ee254a8cb4ec205b69ec193.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/e8844eeddd649b911ee254a8cb4ec205b69ec193\\\&quot; title=\\\&quot;3_ENS Explorer\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/e/e8844eeddd649b911ee254a8cb4ec205b69ec193_2_690x336.jpeg\\\&quot; alt=\\\&quot;3_ENS Explorer\\\&quot; data-base62-sha1=\\\&quot;xaWf1O9wjLv09Ztwtq41BBZ6cf1\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;336\\\&quot; srcset=\\\&quot;https://dis gasless header images and integration support for partner initiatives such as Namehash’s referral program. The designs at this stage are still considered to be “wireframes” which will be refined over the course of 2026.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/d/df4f505a640ffa40f1df22cc4f812f078373942f.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/df4f505a640ffa40f1df22cc4f812f078373942f\\\&quot; title=\\\&quot;5_ENS Manager App\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/d/df4f505a640ffa40f1df22cc4f812f078373942f_2_690x451.jpeg\\\&quot; alt=\\\&quot;5_ENS Manager App\\\&quot; data-base62-sha1=\\\&quot;vRup7fHVVtqexOTwekBKCKKc3sr\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;451\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/d/df4f505a640ffa40f1df22cc4f812f078373942f_2_690x451.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/d/df4f505a640ffa40f1df22cc4f812f078373942f_2_1035x676.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/d/df4f505a640ffa40f1df22cc4f812f078373942f_2_1380x902.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;392D42\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e5_ENS Manager App\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1920×1255 96 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-60249-developer-enablement-ecosystem-readiness-9\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-developer-enablement-ecosystem-readiness-9\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eDeveloper Enablement \\u0026amp; Ecosystem Readiness\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eENSv2 readiness extended well beyond contracts and interfaces. Throughout Q4, ENS Labs accelerated work to prepare the broader ecosystem for ENSv2 adoption. \\u003ca href=\\\&quot;https://docs.ens.domains/web/ensv2-readiness/\\\&quot;\\u003eDocumentation was expanded\\u003c/a\\u003e to cover ENSv2 concepts, migration considerations, and new capabilities. Reproducible testing efforts began to ensure consistent behavior across tooling stacks and integrations.\\u003c/p\\u003e\\n\\u003cp\\u003eFor most applications, preparing for ENSv2 is as simple as updating to the latest version of a \\u003ca href=\\\&quot;https://docs.ens.domains/web/libraries\\\&quot;\\u003esupported library\\u003c/a\\u003e. At the time of writing, not all libraries have added ENSv2 support yet, but \\u003ca href=\\\&quot;http://ethers.js\\\&quot;\\u003eethers.js\\u003c/a\\u003e is currently a \\u003ca href=\\\&quot;https://github.com/ethers-io/ethers.js/tree/wip-v6.16.0-ens\\\&quot;\\u003ework in progress on v6.16.0\\u003c/a\\u003e. Additionally, we are meeting and discussing with most apps and companies that have integrated ENS to make sure they are ready to support ENSv2.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-60249-incoming-q1-2026-ensv2-public-alpha-10\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-incoming-q1-2026-ensv2-public-alpha-10\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eIncoming Q1 2026: ENSv2 Public Alpha\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eAs we closed out 2025, ENSv2 has moved from protocol completion into real-world testing and adoption. With core contracts finalized, testnet live, and private alphas of the ENS App and ENS Explorer already in use by ecosystem developers, we are preparing to launch the ENSv2 Public Alpha in Q1 2026.\\u003c/p\\u003e\\n\\u003cp\\u003eThe Public Alpha will introduce the larger ENS community to the new ENS App and ENS Explorer, offering hands-on access to streamlined user flows and powerful developer tooling that reflect the flexibility and scalability of ENSv2.\\u003c/p\\u003e\\n\\u003cp\\u003eFor developers, we’re planning to also release an updated version of \\u003ca href=\\\&quot;https://github.com/ensdomains/ensjs\\\&quot;\\u003eensjs\\u003c/a\\u003e and a new self-contained test environment to make developing against ENS locally easy.\\u003c/p\\u003e\\n\\u003cp\\u003eThese applications also serve as reference implementations, showcasing how ENSv2 can be integrated and extended across the ENS ecosystem.\\u003c/p\\u003e\\n\\u003cp\\u003eMore details on the Public Alpha will be shared soon as we open the next chapter of ENSv2 in Q1 2026!\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\&quot;p-60249-designing-for-our-users-11\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-designing-for-our-users-11\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eDesigning for our Users\\u003c/strong\\u003e\\u003c/h1\\u003e\\n\\u003cp\\u003eIn 2025, we stayed focused on ensuring design and UX work translated our technical progress into coherent, usable experiences. Our Design, Product and Engineering teams came together to ensure rapid iteration for real-life user flows.\\u003c/p\\u003e\\n\\u003cp\\u003eBeyond the apps themselves, Q4 addressed broader brand evolution. We expanded our visual language, refining colors, imagery, textures, and design norms to better support new app surfaces, migration tooling, and decentralized websites.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/4/428e2ef0d33e9defc47333fb457cb4a3cffe3c7d.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/428e2ef0d33e9defc47333fb457cb4a3cffe3c7d\\\&quot; title=\\\&quot;6_Designing for our Users\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/428e2ef0d33e9defc47333fb457cb4a3cffe3c7d_2_690x384.jpeg\\\&quot; alt=\\\&quot;6_Designing for our Users\\\&quot; data-base62-sha1=\\\&quot;9uM8EekIxeDixb5vuRt7NeqZHWd\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;384\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/4/428e2ef0d33e9defc47333fb457cb4a3cffe3c7d_2_690x384.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/428e2ef0d33e9defc47333fb457cb4a3cffe3c7d_2_1035x576.jpeg 1.5x, https://discuss.ens.domains/uploads/db9688/optimized/2X/4/428e2ef0d33e9defc47333fb457cb4a3cffe3c7d_2_1380x768.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;CDCCD1\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003e6_Designing for our Users\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1932×1076 181 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\n\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u 0249-devconnect-argentina-2025-13\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-60249-devconnect-argentina-2025-13\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eDevConnect Argentina 2025\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eENS infrastructure and tooling were showcased in real-world environments throughout the quarter. As Ethereum has grown from a small, open-source software community to a sprawling global industry, ENS continues to be a leader.\\u003c/p\\u003e\\n\\u003cp\\u003eAt Devconnect Buenos Aires, our goal was to put an ENS name in the hands of every attendee and showcase ENS as both a convenience and durable standard for wallet creation. We worked closely with the Ethereum Foundation to build out a “perk” directly in the EF wallet used by \\u003cstrong\\u003e14,000+ attendees\\u003c/strong\\u003e, used for purchasing meals, collecting POAPs, and catching talks at Devconnect.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://discuss.ens.domains/uploads/db9688/original/2X/0/00c918e9a44fc39eaf7c77b6406d2c6b96466efe.jpeg\\\&quot; data-download-href=\\\&quot;https://discuss.ens.domains/uploads/db9688/00c918e9a44fc39eaf7c77b6406d2c6b96466efe\\\&quot; title=\\\&quot;9_DevConnect Argentina 2025\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/00c918e9a44fc39eaf7c77b6406d2c6b96466efe_2_690x294.jpeg\\\&quot; alt=\\\&quot;9_DevConnect Argentina 2025\\\&quot; data-base62-sha1=\\\&quot;6WQDAYQHHE4aU6XSFNzy6hacs6\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;294\\\&quot; srcset=\\\&quot;https://discuss.ens.domains/uploads/db9688/optimized/2X/0/00c918e9a44fc39eaf7c77b6406d2c6b96466efe_2_690x294.jpeg, https://discuss.ens.domains/uploads/db9688/optimized/2X/0/00c918e9a44fc39eaf7c77b6406d2c6b96466efe_2_1035x441.jpeg 1.5x, https://discuss.ens.d
